              tag: "setup_ownership_error",
              tone: "danger",
              contentHtml: "PIN mismatch (<code>403 invalid_claim_pin</code>). Check <code>~/.ciris/claim_pin</code> (mode 0600).",
              rightHtml: `<button class="btn" data-csd-tag="btn_setup_finish_unclaimed" onclick="wizardFinishSetup()">Continue unclaimed</button>`,
            }) : ''}
          `;

          const step4FooterHtml = `
            <div style="display:flex; justify-content:space-between; padding:14px 0 6px;">
              <button class="btn" data-csd-tag="btn_back" onclick="wizardPrevStep()">&larr; Back</button>
              <button class="btn btn-brand" data-csd-tag="btn_finish_setup" onclick="wizardFinishSetup()">
                Finish Setup &amp; Open Circles &rarr;
              </button>
            </div>
          `;

          stepBodyHtml = `
            <div data-csd-tag="csd_085_claim_node">
              ${claimChoiceHtml}
              ${pinInputHtml}
              ${claimStateHtml}
              ${step4FooterHtml}
            </div>
          `;
        }
      }

      // Single cohesive 3D Spatial Slab container — no nested cards!
      return renderP1CardShell({
        tag: "csd_082_setup_wizard",
        titleHtml: "First-Run Setup",
        chipLabel: w.runWithAi ? "Run with AI (3 steps)" : "Node-only (2 steps)",
        chipTone: "brand",
        headerRightHtml: stepIndicatorsHtml,
        ellipsisKey: "wiz_node_posture",
        ellipsisHtml: wizardHeaderEllipsisHtml,
        bodyHtml: deferralStepBarHtml + stepBodyHtml,
      });
    }

    // ══════════════════════════════════════════════════════════════════════════
    // 2. FULL MULTI-DEVICE & SELF-KEY ROSTER (`CSD-037`, `CSD-094`, `CSD-095`)
    // ══════════════════════════════════════════════════════════════════════════

    function switchActiveDevicePerspective(occId) {
      state.multiDevice.activeOccurrenceId = occId;
      state.multiDevice.lastReceiptNote = null;
      renderAll();
    }

    function toggleDeviceReachable(occId) {
      const dev = state.multiDevice.devices.find(d => d.occurrenceId === occId);
      if (dev) dev.reachable = !dev.reachable;
      renderAll();
    }

    // `CSD-037`: Evict device with 3-fact ConfirmSheet + CC 4.5.12.1 honesty note + 2-stage force_self
    function openEvictDeviceSheet(occId) {
      const dev = state.multiDevice.devices.find(d => d.occurrenceId === occId);
      if (!dev) return;
      const isSelf = occId === state.multiDevice.activeOccurrenceId;
      const enrolledCount = activeEnrolledDevices().length;
      const requiresQuorum = enrolledCount >= 2 && !isSelf;

      const host = document.getElementById("sheetHost");
      host.innerHTML = `
        <div class="sheet-backdrop" onclick="if(event.target===this)closeSheet()">
          <div class="sheet" data-csd-tag="confirm_evict_device_${occId}">
            <div class="sheet-header">
              <span class="sheet-title">Evict ${dev.label}?</span>
              <button class="btn-ghost" onclick="closeSheet()">&#10005;</button>
            </div>
            <div class="card" style="padding:8px 14px;">
              <div class="kv-row"><span>1. Device</span><strong>${dev.label} (<code>${dev.keyId}</code>)</strong></div>
              <div class="kv-row"><span>2. Future access</span><span>Cannot act as you or receive new Self-DEK content</span></div>
              <div class="kv-row"><span>3. Path</span><span>${isSelf ? 'Self-release (requires 2-step force_self)' : (requiresQuorum ? 'Creates Self-Key Roster eviction proposal' : 'Immediate revocation')}</span></div>
            </div>
            <div class="state-banner danger" style="margin:10px 0;" data-csd-tag="txt_dek_honesty_note">
              <span><strong>Constitutional Honesty Note (CC 4.5.12.1 / 3.3.6.1):</strong> It can no longer act as you or receive anything new. Anything already shared with that device stays readable to it &mdash; CIRIS does not re-encrypt past content.</span>
            </div>
            ${isSelf && state.multiDevice.revokeForcePendingId !== occId ? `
              <div class="state-banner brand" data-csd-tag="txt_release_self_requires_force">
                <span>This is the device you are currently using (<code>self.release_self_requires_force</code>). Confirming once unlocks the final <code>force_self: true</code> release button.</span>
              </div>
              <div style="display:flex; gap:8px; margin-top:12px;">
                <button class="btn btn-danger" data-csd-tag="btn_evict_arm_force_self" onclick="state.multiDevice.revokeForcePendingId='${occId}'; openEvictDeviceSheet('${occId}');">
                  Step 1: Arm self-eviction
                </button>
                <button class="btn" onclick="closeSheet()">Cancel</button>
              </div>
            ` : `
              <div style="display:flex; gap:8px; margin-top:12px;">
                <button class="btn btn-danger" data-csd-tag="btn_confirm_evict_${occId}" onclick="executeEvictDevice('${occId}')">
                  ${isSelf ? 'Step 2: Evict this device (force_self: true)' : (requiresQuorum ? 'Propose eviction on Self-Key Roster' : 'Evict device now')}
                </button>
                <button class="btn" onclick="state.multiDevice.revokeForcePendingId=null; closeSheet();">Cancel</button>
              </div>
            `}
          </div>
        </div>
      `;
    }

    function executeEvictDevice(occId) {
      const dev = state.multiDevice.devices.find(d => d.occurrenceId === occId);
      if (!dev) return;
      const me = state.multiDevice.activeOccurrenceId;
      const myDev = state.multiDevice.devices.find(d => d.occurrenceId === me) || state.multiDevice.devices[0];
      const enrolledCount = activeEnrolledDevices().length;

      if (enrolledCount >= 3 && occId !== me) {
        // Multi-device quorum / 24h W_self eviction proposal (`CSD-095`)
        const propId = "prop-evict-" + occId;
        state.multiDevice.proposals.unshift({
          proposalId: propId,
          kind: "evict",
          subjectKeyId: dev.keyId,
          subjectOccurrenceId: dev.occurrenceId,
          subjectLabel: dev.label,
          subjectClass: dev.deviceClass,
          proposedByOccurrenceId: me,
          proposedByLabel: myDev.label,
          approvals: [me],
          objectors: [],
          windowRemSecs: 86400,
          earliestLoneAt: "2026-10-21T18:00:00Z (24h W_self)",
          settled: null,
        });
      } else {
        dev.revoked = true;
        dev.dekRecipient = false;
      }
      state.multiDevice.revokeForcePendingId = null;
      closeSheet();
      renderAll();
    }

    // `CSD-094`: Approve or Deny a pending device join request behind a 3-fact ConfirmSheet
    function openApproveDeviceConfirm(reqId, approve) {
      const req = state.multiDevice.pendingDeviceRequests.find(r => r.requestId === reqId);
      if (!req) return;
      const enrolledCount = activeEnrolledDevices().length;
      const willHold = approve && enrolledCount >= 2;

      const host = document.getElementById("sheetHost");
      host.innerHTML = `
        <div class="sheet-backdrop" onclick="if(event.target===this)closeSheet()">
          <div class="sheet" data-csd-tag="confirm_device_request_${reqId}">
            <div class="sheet-header">
              <span class="sheet-title">${approve ? 'Approve' : 'Deny'} ${req.label}?</span>
              <button class="btn-ghost" onclick="closeSheet()">&#10005;</button>
            </div>
            <div class="card" style="padding:8px 14px;">
              <div class="kv-row"><span>1. Device &amp; class</span><strong>${req.label} (<code>${req.deviceClass}</code>)</strong></div>
              <div class="kv-row"><span>2. 6-digit match code</span><strong class="mono-hint">${req.matchCode}</strong></div>
              <div class="kv-row"><span>3. Outcome</span><span>${!approve ? 'Refuses request immediately' : (willHold ? '202 Held: opens Self-Key Roster proposal (24h W_self or 2nd device signature)' : '200 Approved: enrolls device immediately (single-device roster)')}</span></div>
            </div>
            <div style="display:flex; gap:8px; margin-top:12px;">
              <button class="btn ${approve ? 'btn-brand' : 'btn-danger'}"
                      data-csd-tag="btn_confirm_device_req_yes"
                      onclick="executeDeviceRequestDecision('${reqId}', ${approve})">
                ${approve ? 'Confirm approval' : 'Confirm denial'}
              </button>
              <button class="btn" onclick="closeSheet()">Cancel</button>
            </div>
          </div>
        </div>
      `;
    }

    function executeDeviceRequestDecision(reqId, approve) {
      const req = state.multiDevice.pendingDeviceRequests.find(r => r.requestId === reqId);
      if (!req) return;
      const enrolledCount = activeEnrolledDevices().length;
      const me = state.multiDevice.activeOccurrenceId;
      const myDev = state.multiDevice.devices.find(d => d.occurrenceId === me) || state.multiDevice.devices[0];

      if (!approve) {
        req.status = "denied";
      } else if (enrolledCount <= 1) {
        // `roster_size == 1` -> `200 {approved: true}` immediate landing (`CSD-094`)
        req.status = "approved";
        if (!state.multiDevice.devices.some(d => d.occurrenceId === req.occurrenceId)) {
          state.multiDevice.devices.push({
            occurrenceId: req.occurrenceId,
            keyId: req.keyId,
            label: req.label,
            deviceClass: req.deviceClass,
            reachable: false,
            hardwareCustody: "secure_enclave",
            dekRecipient: true,
            revoked: false,
          });
        }
      } else {
        // `roster_size >= 2` -> `202 {approved: false, held: true, proposal_id}` (`CSD-094` + `CSD-095`)
        req.status = "held";
        const propId = "prop-add-" + req.occurrenceId;
        state.multiDevice.lastHeldBannerProposalId = propId;
        if (!state.multiDevice.proposals.some(p => p.proposalId === propId)) {
          state.multiDevice.proposals.unshift({
            proposalId: propId,
            kind: "add",
            subjectKeyId: req.keyId,
            subjectOccurrenceId: req.occurrenceId,
            subjectLabel: req.label,
            subjectClass: req.deviceClass,
            proposedByOccurrenceId: me,
            proposedByLabel: myDev.label,
            approvals: [me],
            objectors: [],
            windowRemSecs: 86400,
            earliestLoneAt: "2026-10-21T17:45:00Z (24h W_self)",
            settled: null,
          });
        }
      }
      closeSheet();
      renderAll();
    }

    // `CSD-095`: Agree (`+1`) or Object (`-1`) to a Self-Key Roster proposal behind 3-fact `ConfirmSheet`
    function openRosterAnswerConfirm(propId, assent) {
      const p = state.multiDevice.proposals.find(x => x.proposalId === propId);
      if (!p) return;
      const changeText = (p.kind === "add" ? "Add " : "Evict ") + p.subjectLabel;
      const effectText = assent
        ? (p.approvals.length + 1 >= 2
            ? "Reaches quorum (2 signatures) and lands immediately"
            : "Records your +1 scores signature toward quorum")
        : "Records your -1 scores objection, blocking the 24h single-device window and refusing the change";

      const host = document.getElementById("sheetHost");
      host.innerHTML = `
        <div class="sheet-backdrop" onclick="if(event.target===this)closeSheet()">
          <div class="sheet" data-csd-tag="confirm_roster_answer">
            <div class="sheet-header">
              <span class="sheet-title">${assent ? 'Agree' : 'Object'} to ${changeText}?</span>
              <button class="btn-ghost" onclick="closeSheet()">&#10005;</button>
            </div>
            <div class="card" style="padding:8px 14px;">
              <div class="kv-row"><span>1. Change</span><strong>${changeText}</strong></div>
              <div class="kv-row"><span>2. Proposed by</span><strong>${p.proposedByLabel}</strong></div>
              <div class="kv-row"><span>3. What your answer does</span><span>${effectText}</span></div>
            </div>
            ${p.kind === 'evict' && assent ? `
              <div style="font-size:12px; color:var(--danger); margin-bottom:10px;">
                CC 4.5.12.1: Already-shared content stays readable to the evicted device; CIRIS does not re-encrypt past content.
              </div>
            ` : ''}
            <div style="display:flex; gap:8px; margin-top:12px;">
              <button class="btn ${assent ? 'btn-brand' : 'btn-danger'}"
                      data-csd-tag="btn_confirm_roster_answer_yes"
                      onclick="executeRosterAnswer('${propId}', ${assent})">
                ${assent ? 'Sign agreement (+1)' : 'Sign objection (-1)'}
              </button>
              <button class="btn" data-csd-tag="btn_confirm_roster_answer_cancel" onclick="closeSheet()">Cancel</button>
            </div>
          </div>
        </div>
      `;
    }

    function executeRosterAnswer(propId, assent) {
      const p = state.multiDevice.proposals.find(x => x.proposalId === propId);
      if (!p) return;
      const me = state.multiDevice.activeOccurrenceId;

      if (assent) {
        if (!p.approvals.includes(me)) p.approvals.push(me);
        if (p.approvals.length >= 2) {
          p.settled = "LANDED";
          if (p.kind === "add") {
            if (!state.multiDevice.devices.some(d => d.occurrenceId === p.subjectOccurrenceId)) {
              state.multiDevice.devices.push({
                occurrenceId: p.subjectOccurrenceId,
                keyId: p.subjectKeyId,
                label: p.subjectLabel,
                deviceClass: p.subjectClass || "phone",
                reachable: false,
                hardwareCustody: "secure_enclave",
                dekRecipient: true,
                revoked: false,
              });
            }
            const req = state.multiDevice.pendingDeviceRequests.find(r => r.occurrenceId === p.subjectOccurrenceId);
            if (req) req.status = "approved";
          } else if (p.kind === "evict") {
            const dev = state.multiDevice.devices.find(d => d.occurrenceId === p.subjectOccurrenceId);
            if (dev) {
              dev.revoked = true;
              dev.dekRecipient = false;
            }
          }
        }
        state.multiDevice.lastReceiptNote = `Signed scores +1 on self_roster:${p.kind} (${p.proposalId}) by ${me} at federation scope -> ${p.settled || 'PENDING'}`;
      } else {
        if (!p.objectors.includes(me)) p.objectors.push(me);
        p.settled = "REFUSED";
        state.multiDevice.lastReceiptNote = `Signed scores -1 objection on self_roster:${p.kind} (${p.proposalId}) by ${me} -> REFUSED (24h lone window blocked)`;
      }
      closeSheet();
      renderAll();
    }

    function renderDevicesAndKeysSurface() {
      const md = state.multiDevice;
      const enrolled = activeEnrolledDevices();
      const visibleDevices = md.showRevoked ? md.devices : enrolled;
      const openProposals = md.proposals.filter(p => !p.settled);
      const settledProposals = md.proposals.filter(p => !!p.settled);

      return `
        <!-- Perspective Switcher so reviewer/harness can test A1 (Proposer) vs A2 (Second Device Voter) -->
        <div class="quiet-lens" data-csd-tag="multi_device_perspective_bar">
          <span>Viewing as device: <strong>${md.activeOccurrenceId.toUpperCase()}</strong> &middot; Roster size: <strong>${enrolled.length}</strong></span>
          <div style="display:flex; gap:4px;">
            ${md.devices.filter(d => !d.revoked).map(d => `
              <button class="btn ${md.activeOccurrenceId === d.occurrenceId ? 'btn-brand' : ''}"
                      style="padding:3px 9px; font-size:11px;"
                      data-csd-tag="btn_view_as_${d.occurrenceId}"
                      onclick="switchActiveDevicePerspective('${d.occurrenceId}')">
                ${d.label.split(' ')[0]} (${d.occurrenceId.replace('occ-', '').toUpperCase()})
              </button>
            `).join("")}
          </div>
        </div>

        <!-- CARD 1: CSD-095 Changes to Your Devices — Self-Key Roster -->
        <div class="card" data-csd-tag="card_self_roster">
          <div class="card-header">
            <div class="card-header-title">
              <span>Changes to your devices &mdash; Self-key roster</span>
              ${openProposals.length > 0
                ? `<span class="chip warn">${openProposals.length} waiting</span>`
                : `<span class="chip ok">All settled</span>`}
            </div>
            <button class="btn-ghost" data-csd-tag="btn_self_roster_refresh" title="Refresh proposals" onclick="renderAll()">&#8635;</button>
          </div>

          ${md.lastReceiptNote ? `
            <div class="state-banner brand" data-csd-tag="text_self_roster_receipt">
              <span class="mono-hint">${md.lastReceiptNote}</span>
            </div>
          ` : ''}

          ${openProposals.length === 0 ? `
            <div class="item-row" data-csd-tag="text_self_roster_empty">
              <span style="font-size:13px; color:var(--ink-mute);">No pending additions or evictions on your self-key roster.</span>
            </div>
          ` : openProposals.map(p => {
            const isOwn = p.proposedByOccurrenceId === md.activeOccurrenceId;
            const need = enrolled.length >= 3 ? 2 : 2;
            const sigText = `Signatures: ${p.approvals.length} of ${need}${enrolled.length >= 3 ? ` (quorum of ${enrolled.length})` : ''}`;
            const pathText = enrolled.length === 2 && p.kind === "add"
              ? `2-device roster: lands immediately on 2nd signature, or after 24h W_self (${p.earliestLoneAt}) if unopposed`
              : `Quorum path: 2 signatures land immediately · Lone path: 1 signature after ${p.earliestLoneAt} if 0 objections`;
            const propDvId = `self_roster_3d_${p.proposalId}`;
            const propDv = {
              deferralId: propDvId,
              contextTitle: `${p.kind === 'add' ? 'Add' : 'Evict'} ${p.subjectLabel}`,
              contextSubtitle: `Proposed by ${p.proposedByLabel}`,
              dimension: `self_roster:${p.kind}`,
              scope: "Everyone",
              quorumRequired: need,
              quorumApprovals: p.approvals.length,
              quorumObjections: p.objectors.length,
              choices: [
                {
                  choiceId: `${p.proposalId}_assent`,
                  label: "Agree (+1)",
                  subtitle: "Sign op:scores +1.0 toward 2-device quorum",
                  voteScore: 1.0,
                  atomicNumber: 7,
                  selected: p.approvals.length >= 1,
                  disabled: isOwn,
                  onClickJs: isOwn ? "" : `openRosterAnswerConfirm('${p.proposalId}', true)`,
                },
                {
                  choiceId: `${p.proposalId}_wait`,
                  label: "24h W_self Hold (0)",
                  subtitle: p.earliestLoneAt,
                  voteScore: 0.0,
                  atomicNumber: 3,
                  selected: p.approvals.length === 1 && p.objectors.length === 0,
                  disabled: true,
                },
                {
                  choiceId: `${p.proposalId}_object`,
                  label: "Object (-1)",
                  subtitle: "Sign op:scores -1.0 to block lone-signer path",
                  voteScore: -1.0,
                  atomicNumber: 9,
                  selected: p.objectors.length > 0,
                  disabled: isOwn,
                  onClickJs: isOwn ? "" : `openRosterAnswerConfirm('${p.proposalId}', false)`,
                },
              ],
            };
            window.__HOLON_ACTIVE_FRAMES = window.__HOLON_ACTIVE_FRAMES || {};
            window.__HOLON_ACTIVE_FRAMES[propDvId] = buildHolonFrameFromDeferral(propDv);
            return `
              <div class="item-row" style="flex-direction:column; align-items:stretch; gap:8px;" data-csd-tag="row_self_roster_${p.proposalId}">
                <div class="p9-question-hero"
                     style="margin:2px 0;"
                     data-bevy-question="1"
                     data-bevy-deferral-id="${propDvId}"
                     data-csd-tag="holon_canvas_${p.proposalId}">
                  <div style="display:flex; justify-content:space-between; align-items:center;">
                    <div>
                      <div class="p9-question-eyebrow">P9 &middot; SELF-ROSTER CEREMONY QUESTION &middot; <code>self_roster:${p.kind}</code></div>
                      <strong class="p9-question-title" style="display:block;font-size:15px;" data-csd-tag="text_self_roster_kind_${p.proposalId}">
                        ${p.kind === 'add' ? 'Add device' : 'Evict device'}: ${p.subjectLabel}?
                      </strong>
                      <div style="font-size:12px; color:var(--ink-mute);">
                        Proposed by ${p.proposedByLabel} &middot; <span class="mono-hint">${p.subjectKeyId}</span>
                      </div>
                    </div>
                    <div style="display:flex;align-items:center;gap:6px;">
                      <span class="chip warn" data-csd-tag="text_self_roster_signatures_${p.proposalId}">${sigText}</span>
                      <button class="btn-ghost" data-csd-tag="btn_receipt_${p.proposalId}" title="5-fact CEG receipt &amp; actions (P4)" onclick="openReceiptSheet('setup_add_device')">&#9776;</button>
                    </div>
                  </div>
                </div>
                <div style="font-size:12px; color:var(--ink-mute);" data-csd-tag="text_self_roster_path_${p.proposalId}">
                  ${pathText}
                </div>
                ${p.objectors.length > 0 ? `
                  <div style="font-size:12px; color:var(--danger);" data-csd-tag="text_self_roster_objectors_${p.proposalId}">
                    Objectors: ${p.objectors.join(", ")}
                  </div>
                ` : ''}
                <div style="display:flex; justify-content:space-between; align-items:center; padding-top:4px;">
                  ${isOwn ? `
                    <span style="font-size:12px; color:var(--ink-mute);" data-csd-tag="text_self_roster_own_${p.proposalId}">
                      This device proposed this change, so another of your devices answers it. (Switch to A2 above to answer!)
                    </span>
                  ` : `
                    <div style="display:flex; gap:8px;">
                      <button class="btn btn-brand"
                              data-bevy-choice="1"
                              data-bevy-selected="1"
                              data-csd-tag="btn_self_roster_assent_${p.proposalId}"
                              onclick="openRosterAnswerConfirm('${p.proposalId}', true)">
                        Agree (+1)
                      </button>
                      <button class="btn btn-danger"
                              data-bevy-choice="1"
                              data-bevy-selected="0"
                              data-csd-tag="btn_self_roster_object_${p.proposalId}"
                              onclick="openRosterAnswerConfirm('${p.proposalId}', false)">
                        Object (-1)
                      </button>
                    </div>
                  `}
                </div>
              </div>
            `;
          }).join("")}

          ${settledProposals.length > 0 ? `
            <div style="border-top:1px solid var(--hairline); padding:10px 0 6px;">
              <div style="font-size:12px; font-weight:600; color:var(--ink-mute); margin-bottom:6px;">No longer waiting</div>
              ${settledProposals.map(p => `
                <div class="kv-row" data-csd-tag="row_self_roster_history_${p.proposalId}">
                  <span>${p.kind === 'add' ? 'Add' : 'Evict'} ${p.subjectLabel}</span>
                  <span class="chip ${p.settled === 'LANDED' ? 'ok' : 'danger'}" data-csd-tag="chip_self_roster_settled_${p.proposalId}">
                    ${p.settled}
                  </span>
                </div>
              `).join("")}
            </div>
          ` : ''}
        </div>

        <!-- CARD 2: CSD-037 My Identity — Enrolled Devices Roster -->
        <div class="card" data-csd-tag="csd_037_my_identity">
          <div class="card-header">
            <div class="card-header-title">
              <span>My identity &amp; enrolled devices</span>
              <span class="chip ok" data-csd-tag="identity_self_key_id">${md.selfKeyId}</span>
            </div>
            <button class="btn-ghost" onclick="toggleExpand('csd037_more')">&ctdot;</button>
          </div>

          <div data-csd-tag="identity_device_list">
            ${visibleDevices.map(d => `
              <div class="item-row" data-csd-tag="identity_row_${d.occurrenceId}">
                <div>
                  <div class="item-title">
                    ${d.label}
                    ${d.occurrenceId === md.activeOccurrenceId ? '<span class="chip brand" style="margin-left:6px;">This device</span>' : ''}
                    ${d.revoked ? '<span class="chip danger" style="margin-left:6px;">Evicted</span>' : ''}
                  </div>
                  <div style="font-size:12px; color:var(--ink-mute);">
                    <code>${d.deviceClass}</code> &middot; Custody: <code>${d.hardwareCustody}</code>
                    ${d.dekRecipient ? ' &middot; Self-DEK recipient' : ''}
                  </div>
                </div>
                <div class="item-right">
                  ${!d.revoked ? `
                    <button class="btn" style="padding:3px 9px; font-size:11px;"
                            data-csd-tag="btn_reachability_${d.occurrenceId}"
                            onclick="toggleDeviceReachable('${d.occurrenceId}')">

    // ── `☰` Universal CEG Hamburger (`P4: ReceiptSheet` / `CSD-006` / `v0.5.245`) ──
    // Available on EVERY CEG object and its referents (blobs, files, messages, communities, rules, 3D holon orbs):
    // 1. 5 Universal Envelope Facts
    // 2. 3D `CIRISHolon` Atom/Bond Spatial View-Form (`#spatialCanvas`)
    // 3. All 9 Uniform `AttOp`s (`ViewDetails`, `History`, `Evidence`, `Copy`, `Cosign`, `Delegate`, `Supersede`, `Withdraw`, `Recant` with inline `whyDisabled` reasons)
    // 4. Referent / Blob / File Acts (`Open`, `Where is this file` `/custody`, `Rename`, `Move`)
    // 5. Moderation & Safety Acts (`Flag content` `/v1/safety/flag`, `Moderate author` `/v1/safety/moderation`, `Reveal` `/reveal`)
    function computeUniform9AttOps(c) {
      const isProducer = c.attester === "ed25519:viewer_self" || (c.attester && c.attester.includes(state.wizard.fedidLabel || "alice"));
      const isTerminal = c.op === "withdraws" || c.op === "recants";
      return [
        { op: "ViewDetails", label: "View envelope JSON", enabled: true, whyDisabled: null },
        { op: "History",     label: "Revision lineage",   enabled: true, whyDisabled: null },
        { op: "Evidence",    label: "Merkle / STH proof", enabled: true, whyDisabled: null },
        { op: "Copy",        label: "Copy canonical URI", enabled: true, whyDisabled: null },
        { op: "Cosign",      label: "Cosign (+1)",        enabled: c.op === "scores", whyDisabled: c.op !== "scores" ? `op:${c.op} does not accept cosignatures (RC9 matrix)` : null },
        { op: "Delegate",    label: "Delegate",           enabled: c.op === "delegates_to", whyDisabled: c.op !== "delegates_to" ? "Inv_BondDepthOne: only op:delegates_to supports delegation" : null },
        { op: "Supersede",   label: "Supersede (Revise)", enabled: isProducer && !isTerminal, whyDisabled: !isProducer ? "Only the original attester can supersede" : (isTerminal ? `Terminal op:${c.op} cannot be superseded` : null) },
        { op: "Withdraw",    label: "Withdraw (1-step)",  enabled: isProducer && c.op !== "withdraws", whyDisabled: !isProducer ? "Rule 0: only producer can withdraw" : "Already withdrawn" },
        { op: "Recant",      label: "Recant (Fault)",     enabled: isProducer && c.op !== "recants", whyDisabled: !isProducer ? "Rule 0: only producer can recant" : "Already recanted" },
      ];
    }

    async function executeHamburgerAttOp(claimId, op) {
      const c = CLAIMS.find(x => x.id === claimId) || getSetupReceiptClaim(claimId);
      if (!c) return;
      if (op === "Withdraw") {
        if (state.liveNode.connected && c.tab === "Chats") {
          await fetch(`/v1/chat/${state.activeCommunityId}/messages/${c.id}/withdraw`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ reason: "1-step producer withdrawal" }),
          }).catch(() => null);
        }
        oneStepWithdraw(claimId);
        return;
      }
      if (op === "Supersede") {
        const revTitle = c.title.endsWith(" (v2)") ? c.title : `${c.title} (v2)`;
        c.title = revTitle;
        if (state.liveNode.connected && c.tab === "Chats") {
          await fetch(`/v1/chat/${state.activeCommunityId}/messages/${c.id}/supersede`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ body: revTitle }),
          }).catch(() => null);
        }
        state.lastHamburgerNote = `Superseded ${c.id} -> minted revision envelope (${revTitle})`;
      } else if (op === "Recant") {
        c.op = "recants";
        c.score = -1.0;
        if (state.liveNode.connected && c.tab === "Chats") {
          await fetch(`/v1/chat/${state.activeCommunityId}/messages/${c.id}/recant`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ reason: "Producer fault recantation" }),
          }).catch(() => null);
        }
        state.lastHamburgerNote = `Recanted ${c.id} (op:recants signed on record)`;
      } else if (op === "Cosign") {
        c.confidence = Math.min(1.0, (c.confidence || 0.9) + 0.05);
        state.lastHamburgerNote = `Cosigned ${c.id} (op:scores +1.0 co-attestation recorded)`;
      } else if (op === "History") {
        state.lastHamburgerNote = `Lineage for ${c.id}: genesis -> active head (STH #42 verified)`;
      } else if (op === "Evidence") {
        state.lastHamburgerNote = `Merkle inclusion proof verified: Ed25519 + ML-DSA-65 hybrid signature valid`;
      } else if (op === "Copy") {
        state.lastHamburgerNote = `Copied canonical URI: ciris://ceg/${c.scope}/${c.id}`;
      } else {
        state.lastHamburgerNote = `Envelope ${c.id}: subject=${c.subject}, attester=${c.attester}, dim=${c.dimension}`;
      }
      openReceiptSheet(claimId);
    }

    async function executeBlobAct(claimId, act) {
      const c = CLAIMS.find(x => x.id === claimId) || getSetupReceiptClaim(claimId);
      if (!c) return;
      if (act === "custody") {
        if (state.liveNode.connected) {
          await fetch(`/v1/files/${claimId}/custody`).catch(() => null);
        }
        state.lastHamburgerNote = `GET /v1/files/${claimId}/custody: held on Local Node (${state.liveNode.keyId}) + 2 cohort replicas (72h custody:ack:v1)`;
      } else if (act === "rename") {
        c.title = c.title.startsWith("renamed-") ? c.title : `renamed-${c.title}`;
        if (state.liveNode.connected) {
          await fetch(`/v1/files/${claimId}/rename`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name: c.title }),
          }).catch(() => null);
        }
        state.lastHamburgerNote = `POST /v1/files/${claimId}/rename -> ${c.title}`;
      } else if (act === "move") {
        c.scope = c.scope === "JustMe" ? "Family" : "JustMe";
        if (state.liveNode.connected) {
          await fetch(`/v1/files/${claimId}/move`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ cohort: c.scope }),
          }).catch(() => null);
        }
        state.lastHamburgerNote = `POST /v1/files/${claimId}/move -> moved to ${c.scope}`;
      }
      openReceiptSheet(claimId);
      renderAll();
    }

    async function executeModerationAct(claimId, action) {
      const c = CLAIMS.find(x => x.id === claimId) || getSetupReceiptClaim(claimId);
      if (!c) return;
      if (action === "flag") {
        c.cw_opinion = { by: "viewer_self", rule: "cw_class:community_flag" };
        if (state.liveNode.connected) {
          await fetch("/v1/safety/flag", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ target_id: claimId, flag_class: "cw_class:community_flag", community_id: state.activeCommunityId }),
          }).catch(() => null);
        }
        state.lastHamburgerNote = `POST /v1/safety/flag: signed content note (cw_class:community_flag) on ${claimId}`;
      } else if (action === "reveal") {
        c.cw_opinion = null;
        if (state.liveNode.connected) {
          await fetch(`/v1/chat/${state.activeCommunityId}/items/${claimId}/reveal`, { method: "POST" }).catch(() => null);
        }
        state.lastHamburgerNote = `POST /v1/chat/${state.activeCommunityId}/items/${claimId}/reveal: item unblurred for your view`;
      } else {
        if (state.liveNode.connected) {
          await fetch("/v1/safety/moderation", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ community_id: state.activeCommunityId, target_id: claimId, action, reason: "CC 4.5.4 named moderator action" }),
          }).catch(() => null);
        }
        state.lastHamburgerNote = `POST /v1/safety/moderation (${action}) signed by Named Moderator on ${claimId} (CC 4.5.4)`;
      }
      openReceiptSheet(claimId);
      renderAll();
    }

    function startCall(roomId, mode) {
      const room = state.communities.find(c => c.id === roomId) || state.communities[0];
      const participants = [
        { id: "self", name: "You (Local)", isSelf: true, audioActive: true, videoActive: mode === "video", color: "#1F5E7A" },
      ];
      if (room.members && room.members.length > 1) {
        room.members.forEach(m => {
          if (m.key_id !== "ed25519:viewer_self") {
            participants.push({
              id: m.key_id,
              name: m.name,
              isSelf: false,
              audioActive: true,
              videoActive: mode === "video",
              color: m.name === "Maya" ? "#C96A38" : (m.name === "Sam" ? "#419CA0" : (m.name === "Dan" ? "#7A6FD6" : "#788C5D")),
            });
          }
        });
      } else {
        participants.push(
          { id: "maya", name: "Maya", isSelf: false, audioActive: true, videoActive: mode === "video", color: "#C96A38" },
          { id: "sam", name: "Sam", isSelf: false, audioActive: true, videoActive: mode === "video", color: "#419CA0" }
        );
      }

      if (state.activeCall && state.activeCall.timerInterval) {
        clearInterval(state.activeCall.timerInterval);
      }
      if (state.activeCall && state.activeCall.animFrameId) {
        cancelAnimationFrame(state.activeCall.animFrameId);
      }

      state.activeCall = {
        roomId: room.id,
        roomName: room.name,
        mode: mode,
        muted: false,
        cameraOff: false,
        startedAt: Date.now(),
        participants: participants,
        timerInterval: null,
        animFrameId: null,
      };

      state.activeCall.timerInterval = setInterval(() => {
        const statusEl = document.querySelector('[data-csd-tag="txt_call_status"]');
        if (statusEl && state.activeCall) {
          const elapsed = Math.floor((Date.now() - state.activeCall.startedAt) / 1000);
          const m = String(Math.floor(elapsed / 60)).padStart(2, "0");
          const s = String(elapsed % 60).padStart(2, "0");
          statusEl.innerHTML = `<span class="call-status-dot"></span><span>LIVE CALL &middot; ${m}:${s}</span>`;
        }
      }, 1000);

      renderAll();
      setTimeout(initCallCanvasAnimations, 50);
    }

    function leaveCall() {
      if (state.activeCall) {
        if (state.activeCall.timerInterval) clearInterval(state.activeCall.timerInterval);
        if (state.activeCall.animFrameId) cancelAnimationFrame(state.activeCall.animFrameId);
        state.activeCall = null;

    let callAnimTime = 0;
    function initCallCanvasAnimations() {
      if (!state.activeCall) return;
      const canvases = document.querySelectorAll(".call-tile-canvas");
      if (!canvases.length) return;

      function renderFrame() {
        if (!state.activeCall) return;
        callAnimTime += 0.05;
        canvases.forEach(cvs => {
          const ctx = cvs.getContext("2d");
          if (!ctx) return;
          const w = cvs.width;
          const h = cvs.height;
          const isSelf = cvs.id.includes("self");
          const isCamOff = isSelf && state.activeCall.cameraOff;
          const isMuted = isSelf && state.activeCall.muted;

          ctx.clearRect(0, 0, w, h);

          // Background gradient
          const grad = ctx.createLinearGradient(0, 0, w, h);
          if (isSelf) {
            grad.addColorStop(0, "#0c1820");
            grad.addColorStop(1, "#182c38");
          } else {
            grad.addColorStop(0, "#15181b");
            grad.addColorStop(1, "#1f2428");
          }
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, w, h);

          if (isCamOff) {
            ctx.fillStyle = "rgba(255,255,255,0.15)";
            ctx.beginPath();
            ctx.arc(w / 2, h / 2 - 10, 30, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#A09C94";
            ctx.font = "12px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("Video Paused", w / 2, h / 2 + 35);
            return;
          }

          // Subtle scanlines
          ctx.strokeStyle = "rgba(255,255,255,0.03)";
          ctx.lineWidth = 1;
          for (let y = 0; y < h; y += 4) {
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(w, y);
            ctx.stroke();
          }

          // Avatar silhouette in center
          const seed = cvs.id.split('').reduce((a, b) => a + b.charCodeAt(0), 0);
          ctx.fillStyle = isSelf ? "rgba(31, 94, 122, 0.35)" : "rgba(120, 140, 93, 0.35)";
          ctx.beginPath();
          ctx.arc(w / 2, h / 2 - 12, 28, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = isSelf ? "#5BE8A5" : "#E2DDD2";
          ctx.font = "bold 18px monospace";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          const initials = isSelf ? "YOU" : cvs.id.replace("canvas_call_", "").substring(0, 2).toUpperCase();
          ctx.fillText(initials, w / 2, h / 2 - 12);

          // Animated Audio Waveform
          if (!isMuted) {
            ctx.fillStyle = isSelf ? "rgba(91, 232, 165, 0.7)" : "rgba(201, 106, 56, 0.7)";
            const bars = 18;
            const barW = 4;
            const gap = 3;
            const startX = (w - (bars * (barW + gap))) / 2;
            for (let b = 0; b < bars; b++) {
              const freq = (callAnimTime * 2 + b * 0.4 + seed) % (Math.PI * 2);
              const barH = 4 + Math.abs(Math.sin(freq)) * 22;
              const x = startX + b * (barW + gap);
              const y = h - 22 - barH;
              ctx.fillRect(x, y, barW, barH);
            }
          }
        });
        state.activeCall.animFrameId = requestAnimationFrame(renderFrame);
      }
      state.activeCall.animFrameId = requestAnimationFrame(renderFrame);
    }

    async function sendChatMessage() {
      const inp = document.getElementById("chatInput");
      if (!inp || !inp.value.trim()) return;
      const text = inp.value.trim();
      const newId = "c_new_" + Date.now();
      const activeRoom = state.communities.find(c => c.id === state.activeCommunityId) || state.communities[0];
      const commId = activeRoom ? activeRoom.id : (state.activeCommunityId || "general");
      const scope = activeRoom ? (activeRoom.scope || activeRoom.cohort) : state.circleId;

      if (state.liveNode.connected) {
        await fetch(`/v1/chat/${commId}/messages`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            body: text,
            attachment_attestation_id: state.chatAttachmentId || undefined,
          }),
        }).catch(() => null);
      }
      CLAIMS.unshift({
        id: newId,
        tab: "Chats",
        scope: scope,
        op: "scores",
        dimension: `message:${commId}`,
        title: "You: " + text + (state.chatAttachmentId ? ` [blob:${state.chatAttachmentId}]` : ""),
        score: 0.9,
        confidence: 1.0,
        subject: `community:${commId}`,
        attester: "ed25519:viewer_self",
        author: "You",
        created_at: new Date().toISOString(),
      });
      state.chatAttachmentId = "";
      inp.value = "";
      renderAll();
    }

    async function decideOwnerRequest(reqId, approve) {
      const req = state.ownerRequests.find(r => r.id === reqId);

      if (state.liveNode.connected) {

          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ decision: approve ? "approve" : "deny" }),
        }).catch(() => null);
      }
      renderAll();
    }

    // Draw the 3D Spatial Slab preview inside `P4: ReceiptSheet` (`#spatialCanvas`) — no molecular spheres
    function draw3DViewForm(claim) {
      const canvas = document.getElementById("spatialCanvas");
      if (!canvas) return;
      const ctx = canvas.getContext("2d");
      const w = canvas.width, h = canvas.height;
      ctx.fillStyle = "#F3F2EE";
      ctx.fillRect(0, 0, w, h);

      // Subtle 3D architectural perspective grid
      ctx.strokeStyle = "rgba(43, 84, 126, 0.12)";
      ctx.lineWidth = 1;
      for (let x = 24; x < w; x += 48) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, h);
        ctx.stroke();
      }
      for (let y = 24; y < h; y += 36) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(w, y);
        ctx.stroke();
      }

      // 3D selection spline connecting Context Slab (left) -> Signed Envelope Slab (right)
      const bGrad = ctx.createLinearGradient(w * 0.34, h * 0.5, w * 0.66, h * 0.5);
      bGrad.addColorStop(0, "#2B547E");
      bGrad.addColorStop(1, "#2E6F40");
      ctx.strokeStyle = bGrad;
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      ctx.moveTo(w * 0.38, h * 0.46);
      ctx.bezierCurveTo(w * 0.48, h * 0.32, w * 0.52, h * 0.60, w * 0.60, h * 0.46);
      ctx.stroke();

      // Context Question Slab (left)
      ctx.fillStyle = "#FFFFFF";
      ctx.strokeStyle = "#2B547E";
      ctx.lineWidth = 1.6;
      ctx.fillRect(24, 34, 185, 86);
      ctx.strokeRect(24, 34, 185, 86);
      ctx.fillStyle = "#2B547E";
      ctx.font = "600 9px 'IBM Plex Mono', monospace";
      ctx.fillText("CONTEXT QUESTION SLAB (P9)", 34, 52);
      ctx.fillStyle = "#1A1D1F";
      ctx.font = "600 11px 'IBM Plex Sans', sans-serif";
      ctx.fillText(String(claim.dimension || "claim").slice(0, 24), 34, 72);
      ctx.fillStyle = "#5A626A";
      ctx.font = "10px 'IBM Plex Mono', monospace";
      ctx.fillText(`subject: ${String(claim.subject || "").slice(0, 18)}`, 34, 92);

      // Signed Selection / Envelope Slab (right)
      ctx.fillStyle = "#EEF4FA";
      ctx.strokeStyle = "#2E6F40";
      ctx.lineWidth = 1.8;
      ctx.fillRect(w - 215, 34, 191, 86);
      ctx.strokeRect(w - 215, 34, 191, 86);
      ctx.fillStyle = "#2E6F40";
      ctx.font = "600 9px 'IBM Plex Mono', monospace";
      ctx.fillText(`SIGNED SELECTION · op:${claim.op}`, w - 205, 52);
      ctx.fillStyle = "#1A1D1F";
      ctx.font = "600 11px 'IBM Plex Sans', sans-serif";
      ctx.fillText(String(claim.title || claim.id).slice(0, 24), w - 205, 72);
      ctx.fillStyle = "#5A626A";
      ctx.font = "10px 'IBM Plex Mono', monospace";
      ctx.fillText(`score=${(claim.score ?? 1.0).toFixed(2)} · conf=${(claim.confidence ?? 1.0).toFixed(2)}`, w - 205, 92);

      ctx.fillStyle = "#5A626A";
      ctx.font = "10px 'IBM Plex Mono', monospace";
      ctx.fillText(`view_form(&Form) · 3D Spatial Slab Projection · scope=${claim.scope}`, 24, h - 18);
    }

    // ── Full-Screen Bevy / `CIRISHolon` (`holon-render-3d`) Spatial Scene (`100vw × 100vh`) ──
    let __bevyLastTime = performance.now();
    function drawFullScreenBevyScene(now) {
      const canvas = document.getElementById("bevySceneCanvas");
      if (!canvas) return;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const vw = window.innerWidth || 1280;
      const vh = window.innerHeight || 800;
      if (canvas.width !== Math.round(vw * dpr) || canvas.height !== Math.round(vh * dpr)) {
        canvas.width = Math.round(vw * dpr);
        canvas.height = Math.round(vh * dpr);
      }

      const tNow = typeof now === "number" ? now : performance.now();
      const dt = Math.min((tNow - __bevyLastTime) / 1000, 0.1);
      __bevyLastTime = tNow;
      state.holon3d.time = (state.holon3d.time || 0) + dt;
      const time = state.holon3d.time;

      const ctx = canvas.getContext("2d");
      ctx.save();
      ctx.scale(dpr, dpr);
      ctx.clearRect(0, 0, vw, vh);

      // 1. Move living holon anchor downwards into the mid-lower viewport (vh * 0.58) so it is prominently visible through & beneath translucent cards
      const vanishX = vw * 0.5 + state.holon3d.yaw * 64;
      const targetAnchorY = Math.max(vh * 0.58, 400);
      const anchorX = vanishX;
      const anchorY = targetAnchorY + Math.sin(time * 0.85) * 8;
      const horizonY = anchorY - 150 + state.holon3d.pitch * 36;

      // Warm Stone-and-Paper 3D Architectural Environment Lighting centered around the living holon anchor
      const bg = ctx.createRadialGradient(anchorX, anchorY - 20, 50, anchorX, anchorY, Math.max(vw, vh) * 0.82);
      bg.addColorStop(0, "#FAF9F5");
      bg.addColorStop(0.55, "#F3F0E8");
      bg.addColorStop(1, "#E1DCCF");
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, vw, vh);

      // 2. 3D Perspective World-Box Architectural Floor & Horizon Grid (`holon-render-3d::spawn_world_box`)
      ctx.strokeStyle = "rgba(43, 84, 126, 0.075)";
      ctx.lineWidth = 1;

      const numRays = 22;
      for (let i = -numRays; i <= numRays; i++) {
        ctx.beginPath();
        ctx.moveTo(vanishX + i * 30, horizonY);
        ctx.lineTo(vanishX + i * 260, vh);
        ctx.stroke();
      }
      for (let row = 1; row <= 13; row++) {
        const t = Math.pow(row / 13, 1.45);
        const y = horizonY + (vh - horizonY) * t;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(vw, y);
        ctx.stroke();
      }

      // 3. Living 3D Holon Graph (5 Concentric Circle Orbits centered at anchorY)
      const baseR = Math.min(Math.max(vw * 0.16, 95), 180);
      const circleRadii = [baseR * 0.75, baseR * 1.35, baseR * 2.05, baseR * 2.85, baseR * 3.75];
      const ringAspect = 0.34;

      // 5 Concentric Circle Rings (Just me -> Everyone)
      const circleColors = [
        "rgba(217, 119, 87, 0.38)",  // Just me (Clay)
        "rgba(120, 140, 93, 0.32)",  // Family (Verdigris)
        "rgba(106, 155, 204, 0.28)", // Neighbours (Lapis)
        "rgba(142, 107, 168, 0.24)", // Communities & Businesses
        "rgba(95, 92, 85, 0.18)",    // Everyone (Slate)
      ];

      circleRadii.forEach((r, idx) => {
        ctx.save();
        ctx.beginPath();
        ctx.ellipse(anchorX, anchorY, r, r * ringAspect, 0, 0, Math.PI * 2);
        ctx.strokeStyle = circleColors[idx];
        ctx.lineWidth = idx === 0 ? 1.8 : 1.2;
        if (idx > 1) ctx.setLineDash([6, 6]);
        ctx.stroke();
        ctx.restore();
      });

      // Orbiting Epistemic Species Nodes with connecting filaments
      const speciesNodes = [
        { r: circleRadii[0], speed: 0.45, offset: 0.0, color: "#D97757", size: 6.5, label: "Identity" },
        { r: circleRadii[1], speed: -0.32, offset: 1.4, color: "#788C5D", size: 5.5, label: "Trust" },
        { r: circleRadii[2], speed: 0.24, offset: 2.9, color: "#6A9BCC", size: 5.5, label: "Peers" },
        { r: circleRadii[3], speed: -0.18, offset: 4.2, color: "#8E6BA8", size: 5.0, label: "Commons" },
        { r: circleRadii[4], speed: 0.12, offset: 5.6, color: "#5F5C55", size: 4.5, label: "Public" },
      ];

      speciesNodes.forEach((node) => {
        const theta = time * node.speed + node.offset;
        const nx = anchorX + Math.cos(theta) * node.r;
        const ny = anchorY + Math.sin(theta) * node.r * ringAspect;

        ctx.save();
        ctx.beginPath();
        ctx.moveTo(anchorX, anchorY);
        ctx.lineTo(nx, ny);
        ctx.strokeStyle = "rgba(176, 174, 165, 0.20)";
        ctx.lineWidth = 1;
        ctx.stroke();

        // Node Glow Halo
        const nGrad = ctx.createRadialGradient(nx, ny, 1, nx, ny, node.size * 2.4);
        nGrad.addColorStop(0, node.color);
        nGrad.addColorStop(1, "rgba(250, 249, 245, 0)");
        ctx.fillStyle = nGrad;
        ctx.beginPath();
        ctx.arc(nx, ny, node.size * 2.4, 0, Math.PI * 2);
        ctx.fill();

        // Node Core
        ctx.fillStyle = node.color;
        ctx.beginPath();
        ctx.arc(nx, ny, node.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      // Central Anchor Node (Golden Amber Core + Torus Ring)
      ctx.save();
      ctx.beginPath();
      ctx.ellipse(anchorX, anchorY, 28, 28 * ringAspect, time * 0.35, 0, Math.PI * 2);
      ctx.strokeStyle = "rgba(217, 119, 87, 0.65)";
      ctx.lineWidth = 2.2;
      ctx.stroke();

      const aGrad = ctx.createRadialGradient(anchorX - 3, anchorY - 4, 2, anchorX, anchorY, 18);
      aGrad.addColorStop(0, "#FAF9F5");
      aGrad.addColorStop(0.35, "#D97757");
      aGrad.addColorStop(0.85, "#8B3E2F");
      aGrad.addColorStop(1, "rgba(139, 62, 47, 0.15)");
      ctx.fillStyle = aGrad;
      ctx.beginPath();
      ctx.arc(anchorX, anchorY, 14, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // 4. Live 3D Selection Splines connecting every Question Slab (`[data-bevy-question="1"]`)
      //    to its Selection Slabs (`[data-bevy-choice="1"]`) in the full-screen Bevy scene
      const questions = document.querySelectorAll('[data-bevy-question="1"]');
      questions.forEach(qEl => {
        const qRect = qEl.getBoundingClientRect();
        if (qRect.bottom < 0 || qRect.top > vh) return;
        const qx = qRect.left + 26;
        const qy = qRect.bottom - 8;

        const cardEl = qEl.closest(".card, .item-row") || qEl.parentElement;
        if (!cardEl) return;
        const choices = cardEl.querySelectorAll('[data-bevy-choice="1"]');
        choices.forEach(cEl => {
          const cRect = cEl.getBoundingClientRect();
          const cx = cRect.left + 18;
          const cy = cRect.top + cRect.height * 0.5;
          const isSelected = cEl.getAttribute("data-bevy-selected") === "1" || cEl.classList.contains("selected");

          ctx.save();
          if (isSelected) {
            const grad = ctx.createLinearGradient(qx, qy, cx, cy);
            grad.addColorStop(0, "rgba(217, 119, 87, 0.85)");
            grad.addColorStop(1, "rgba(120, 140, 93, 0.90)");
            ctx.strokeStyle = grad;
            ctx.lineWidth = 2.8;

            // Animated Energy Pulse particle traveling along spline
            const pulseT = (time * 1.5) % 1.0;
            const px = (1 - pulseT) * (1 - pulseT) * qx + 2 * (1 - pulseT) * pulseT * (qx - 18) + pulseT * pulseT * cx;
            const py = (1 - pulseT) * (1 - pulseT) * qy + 2 * (1 - pulseT) * pulseT * ((qy + cy) * 0.5) + pulseT * pulseT * cy;
            ctx.fillStyle = "#788C5D";
            ctx.beginPath();
            ctx.arc(px, py, 3.5, 0, Math.PI * 2);
            ctx.fill();
          } else {
            ctx.strokeStyle = "rgba(90, 98, 106, 0.18)";
            ctx.setLineDash([4, 4]);
            ctx.lineWidth = 1.2;
          }
          ctx.beginPath();
          ctx.moveTo(qx, qy);
          ctx.bezierCurveTo(qx - 18, (qy + cy) * 0.5, cx - 22, cy, cx, cy);
          ctx.stroke();
          ctx.restore();
        });
      });

      // 5. Subtle Bevy 3D Scene HUD watermark in bottom-right corner
      ctx.fillStyle = "rgba(90, 98, 106, 0.55)";
      ctx.font = "500 10px 'IBM Plex Mono', monospace";
      ctx.textAlign = "right";
      ctx.fillText(
        `CIRISHolon 3D Scene (100vw×100vh) · P1–P12 Spatial Slabs · CIRISServer v${state.liveNode.version}`,
        vw - 16,
        vh - 10
      );
      ctx.restore();
    }

    function wireHolonCanvasEvents() {
      drawFullScreenBevyScene();
      if (window.__BEVY_VIEWPORT_WIRED) return;
      window.__BEVY_VIEWPORT_WIRED = true;

      function bevyLoop(now) {
        drawFullScreenBevyScene(now);
        requestAnimationFrame(bevyLoop);
      }
      requestAnimationFrame(bevyLoop);

      window.addEventListener("resize", () => {
        drawFullScreenBevyScene();
      });

      const surfaceEl = document.getElementById("surfaceRoot");
      if (surfaceEl) {
        surfaceEl.addEventListener("scroll", () => {
          drawFullScreenBevyScene();
        }, { passive: true });
      }

      window.addEventListener("pointermove", e => {
        const vw = window.innerWidth || 1280;
        const vh = window.innerHeight || 800;
        const nx = (e.clientX / vw) - 0.5;
        const ny = (e.clientY / vh) - 0.5;
        state.holon3d.yaw = nx * 0.22;
        state.holon3d.pitch = ny * 0.18;
        if (surfaceEl) {
          surfaceEl.style.setProperty("--cam-ry", `${(nx * 1.35).toFixed(2)}deg`);
          surfaceEl.style.setProperty("--cam-rx", `${(-ny * 1.15).toFixed(2)}deg`);
        }
      }, { passive: true });
    }

      const activeEl = document.activeElement;
      let focusedCsdTag = null;
      let focusedId = null;
      let selStart = null;
      let selEnd = null;
      if (activeEl && (activeEl.tagName === "INPUT" || activeEl.tagName === "TEXTAREA")) {
        focusedCsdTag = activeEl.getAttribute("data-csd-tag");
        focusedId = activeEl.id;
        try {

          selEnd = activeEl.selectionEnd;
        } catch (_e) {}

      document.getElementById("surfaceRoot").innerHTML = html;

      if (focusedCsdTag || focusedId) {
        const selector = focusedCsdTag ? `[data-csd-tag="${focusedCsdTag}"]` : `#${focusedId}`;
        const restoredEl = document.querySelector(selector);
        if (restoredEl && typeof restoredEl.focus === "function") {
          restoredEl.focus();
          if (selStart !== null && selEnd !== null) {
            try {

                <div class="rail-action-row">
                  <div class="rail-action-status" id="railActionStatus">
                    <span>⚡</span> <span>${RAIL_TOUR.currentActionText || 'Observing live state...'}</span>
                  </div>
                  <div style="font-size:11px; color:var(--ink-mute); font-family:var(--mono);">
                    ${stepNum}/${total}
                  </div>
                </div>
              </div>
            </div>
          </div>
        `;

        const btnIcon = document.getElementById("tour_btn_icon");
        const btnLabel = document.getElementById("tour_btn_label");
        if (btnIcon && btnLabel) {
          btnIcon.textContent = "🎬";
          btnLabel.textContent = `On Rails (${stepNum}/${total})`;
        }
      },

      executeStep: (idx) => {
        if (idx < 0 || idx >= RAIL_TOUR.steps.length) {
          RAIL_TOUR.finish();
          return;
        }
        RAIL_TOUR.stepIndex = idx;
        RAIL_TOUR.clearSubTimers();
        clearTimeout(RAIL_TOUR.stepTimer);

        const step = RAIL_TOUR.steps[idx];
        RAIL_TOUR.stepDuration = step.duration || 8000;
        RAIL_TOUR.stepStartTime = Date.now();
        RAIL_TOUR.currentActionText = "Starting step...";
        RAIL_TOUR.renderDock();
        RAIL_TOUR.setSpotlight(step.spotlight);

        const sub = (fn, delay) => {
          const t = setTimeout(fn, delay);
          RAIL_TOUR.subTimers.push(t);
        };

        try {
          step.run(sub);
        } catch (e) {
          console.error("Rail step error:", e);
        }

        if (!RAIL_TOUR.paused) {
          RAIL_TOUR.stepTimer = setTimeout(() => {
            RAIL_TOUR.executeStep(idx + 1);
          }, RAIL_TOUR.stepDuration);
        }
      },

      togglePause: () => {
        if (!RAIL_TOUR.active) return;
        RAIL_TOUR.paused = !RAIL_TOUR.paused;
        if (RAIL_TOUR.paused) {
          clearTimeout(RAIL_TOUR.stepTimer);
          RAIL_TOUR.clearSubTimers();
          RAIL_TOUR.setActionStatus("Walkthrough paused — you can interact freely with the UI");
        } else {
          RAIL_TOUR.executeStep(RAIL_TOUR.stepIndex);
        }
        RAIL_TOUR.renderDock();
      },

      next: () => {
        if (RAIL_TOUR.stepIndex < RAIL_TOUR.steps.length - 1) {
          RAIL_TOUR.executeStep(RAIL_TOUR.stepIndex + 1);
        } else {
          RAIL_TOUR.finish();
        }
      },

      prev: () => {
        if (RAIL_TOUR.stepIndex > 0) {
          RAIL_TOUR.executeStep(RAIL_TOUR.stepIndex - 1);
        }
      },

      start: (startIdx = 0) => {
        if (CLAIMS.length === 0) {
          CLAIMS = DEMO_CLAIMS.map(c => ({ ...c }));
          renderAll();
        }
        RAIL_TOUR.active = true;
        RAIL_TOUR.paused = false;
        if (!RAIL_TOUR.progressInterval) {
          RAIL_TOUR.progressInterval = setInterval(RAIL_TOUR.updateProgress, 80);
        }
        RAIL_TOUR.executeStep(startIdx);
      },

      stop: () => {
        RAIL_TOUR.active = false;
        RAIL_TOUR.paused = false;
        CLAIMS = [];
        renderAll();
        clearTimeout(RAIL_TOUR.stepTimer);
        RAIL_TOUR.clearSubTimers();
        if (RAIL_TOUR.progressInterval) {
          clearInterval(RAIL_TOUR.progressInterval);
          RAIL_TOUR.progressInterval = null;
        }
        RAIL_TOUR.setSpotlight(null);
        RAIL_TOUR.renderDock();

        const btnIcon = document.getElementById("tour_btn_icon");
        const btnLabel = document.getElementById("tour_btn_label");
        if (btnIcon && btnLabel) {
          btnIcon.textContent = "🎬";
          btnLabel.textContent = "Tour on Rails";
        }
      },

      finish: () => {
        RAIL_TOUR.stop();
        state.circleId = "JustMe";
        state.tab = "Files";
        state.setupMode = false;
        state.instrumentId = null;
        closeSheet();
        renderAll();

        const host = document.getElementById("tourHost");
        if (host) {
          host.innerHTML = `
            <div id="railTourDock">
              <div class="rail-card" style="border-color:var(--ok);">
                <div class="rail-content">
                  <div class="rail-topbar">
                    <span class="chip ok">🎉 WALKTHROUGH COMPLETE</span>
                    <button class="rail-btn-icon" onclick="RAIL_TOUR.stop()">✕ Close</button>
                  </div>
                  <div class="rail-title">You've Experienced the Epistemic Web</div>
                  <div class="rail-desc">
                    All 7 core principles — concentric circles, universal receipts, directional asymmetry, ChoiceBlocks, 423 halt, hardware sovereignty, and sovereign provisioning — are live in this client.
                  </div>
                  <div style="display:flex; gap:8px; margin-top:8px;">
                    <button class="btn btn-brand" onclick="RAIL_TOUR.start(0)">Replay Walkthrough</button>
                    <button class="btn" onclick="RAIL_TOUR.stop()">Explore Freely</button>
                  </div>
                </div>
              </div>
            </div>
          `;
          setTimeout(() => { if (host.querySelector('#railTourDock')) host.innerHTML = ""; }, 8000);
        }
      }
    };

    function toggleTourOnRails() {
      if (RAIL_TOUR.active) {
        RAIL_TOUR.togglePause();
      } else {
        RAIL_TOUR.start(0);
      }
    }

    function tourTestWidening() {
      state.setupMode = false;
      state.instrumentId = null;
      state.circleId = "Neighbours";
      state.tab = "Files";
      renderAll();
      setTimeout(() => {
        openP8ConfirmSheet({
          tag: "confirm_widen_beach_everyone",
          title: "Share beach.jpg to Everyone (Public Mesh)",
          fact1Label: "What moves", fact1Val: "beach.jpg (holds_bytes attestation)",
          fact2Label: "Where it goes", fact2Val: "Everyone (mesh federation peers)",
          fact3Label: "Can I undo it?", fact3Val: "Yes — retract back to Just me in 1 step anytime",
          noteHtml: `<div class="danger-banner" style="margin-top:8px;font-size:12px;">⚠️ Federation exposure: This photo will replicate to all public peers under CC 3.3.1 replication consent.</div>`,
          confirmTag: "btn_confirm_widen_yes",
          confirmLabel: "Sign & Share to Everyone",
          confirmTone: "btn-brand",
          onConfirmJs: "CLAIMS.find(x=>x.id==='f_nei_1').scope='Everyone'; state.circleId='Everyone'; closeSheet(); renderAll();",
        });
      }, 80);
    }

    renderAll();
    syncLiveNode();
    initHolonEngineAssets();

    // Start On-Rails Animated Tour only if explicitly requested via ?tour=1
    if (urlParams.get("tour") === "1" || urlParams.get("tour") === "true") {
      setTimeout(() => {
        if (!RAIL_TOUR.active) RAIL_TOUR.start(0);
      }, 1200);
    }
  </script>
</body>
</html>
