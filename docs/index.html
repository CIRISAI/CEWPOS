<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Circles — Constitutional Mesh</title>
  <style>
    :root {
      --bone: #FAF9F5;
      --paper: #F2EFE9;
      --obsidian: #141413;
      --ink-mute: #6E6B64;
      --hairline: #E4E0D6;
      --brand: #1F5E7A;
      --ok: #207A3C;
      --warn: #B86B14;
      --danger: #B82323;
      --c-justme: #22C0E8;
      --c-family: #419CA0;
      --c-neighbours: #7A6FD6;
      --c-communities: #C96A38;
      --c-everyone: #B08A3E;
      --mono: "JetBrains Mono", "SFMono-Regular", Consolas, monospace;
      --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #0F141C;
      color: var(--obsidian);
      font-family: var(--sans);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* ── Full-Screen Bevy / CIRISHolon Spatial Viewport (100vw × 100vh) ── */
    #bevyViewport {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at 50% 18%, #F6F4EE 0%, #EAE5DA 62%, #DDD6C7 100%);
    }
    canvas#bevySceneCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* ── Full-Screen 3D Spatial Scene Root (Perspective Camera + 3D Slabs) ── */
    .shell {
      position: relative;
      z-index: 10;
      max-width: 780px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 0 20px 104px;
      perspective: 1400px;
      transform-style: preserve-3d;
    }
    #surfaceRoot {
      transform-style: preserve-3d;
      transition: transform 0.12s ease-out;
    }

    /* ── Top Spatial HUD Bar: `My things`, Context Title, `Stop`, `⋯` ── */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      margin-top: 12px;
      margin-bottom: 10px;
      border: 1px solid rgba(20, 20, 19, 0.1);
      border-radius: 16px;
      position: sticky;
      top: 12px;
      background: rgba(250, 249, 245, 0.72);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 10px 30px rgba(20, 20, 19, 0.06), 0 1px 0 rgba(255, 255, 255, 0.8) inset;
      z-index: 20;
    }
    .topbar-center {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 15px;
      letter-spacing: -0.01em;
    }
    .topbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ── Buttons & Quiet Triggers (`☰` Hamburger & `⋯` Ellipsis) ── */
    .btn {
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--hairline);
      background: #fff;
      color: var(--obsidian);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn:hover:not(:disabled) { background: var(--paper); }
    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .btn-ghost {
      background: transparent;
      border: 1px solid transparent;
      color: var(--ink-mute);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 14px;
      line-height: 1;
      cursor: pointer;
    }
    .btn-ghost:hover {
      background: var(--paper);
      color: var(--obsidian);
    }
    .btn-stop {
      color: var(--danger);
      border-color: rgba(184, 35, 35, 0.35);
      background: #fff;
      font-weight: 600;
    }
    .btn-stop.halted {
      background: var(--danger);
      color: #fff;
      border-color: var(--danger);
    }
    .btn-brand {
      background: var(--brand);
      color: #fff;
      border-color: var(--brand);
    }
    .btn-brand:hover:not(:disabled) { opacity: 0.92; background: var(--brand); }
    .btn-danger {
      background: rgba(184, 35, 35, 0.08);
      color: var(--danger);
      border-color: rgba(184, 35, 35, 0.35);
    }

    /* ── 7 Circle Tabs & Step Indicators ── */
    .tabs {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      padding: 12px 0;
      margin-bottom: 6px;
    }
    .tab-pill {
      border: none;
      background: transparent;
      color: var(--ink-mute);
      font-size: 13px;
      font-weight: 500;
      padding: 5px 11px;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
    }
    .tab-pill:hover { color: var(--obsidian); background: var(--paper); }
    .tab-pill.active {
      background: var(--obsidian);
      color: var(--bone);
      font-weight: 600;
    }

    /* ── Quiet Context / Lens Line (`⋯` to expand) ── */
    .quiet-lens {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: var(--ink-mute);
      padding: 2px 2px 10px;
    }
    .lens-drawer {
      background: rgba(242, 239, 233, 0.55);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid var(--hairline);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 12px;
      font-size: 12px;
    }

    /* ── P1: CardShell (3D Spatial Slab in Full-Screen Bevy Scene — CIRISGame Bone Overlay) ── */
    .card {
      max-width: 660px;
      margin: 0 auto 16px;
      background: rgba(250, 249, 245, 0.68);
      backdrop-filter: blur(14px) saturate(120%);
      -webkit-backdrop-filter: blur(14px) saturate(120%);
      border: 1px solid rgba(255, 255, 255, 0.75);
      border-radius: 16px;
      padding: 14px 22px 18px;
      box-shadow: 0 16px 40px rgba(20, 20, 19, 0.07), 0 1px 0 rgba(255, 255, 255, 0.90) inset;
      transform-style: preserve-3d;
      transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
    }
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0 8px;
    }
    .card-header-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--obsidian);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      letter-spacing: -0.01em;
    }

    /* ── Editorial Tagline & Narrative (CIRISGame Style) ── */
    .editorial-tagline {
      font-family: var(--serif);
      font-size: 14.5px;
      font-style: italic;
      color: #5F5C55;
      line-height: 1.45;
      margin-bottom: 8px;
      text-align: center;
    }

    /* ── P9: 3D Context Question & Selection Tiles in Full-Screen Bevy Scene ── */
    .p9-question-hero {
      padding: 6px 0 14px;
      border-bottom: 1px solid var(--hairline);
      margin-bottom: 14px;
    }
    .p9-question-eyebrow {
      font-family: var(--mono);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--brand);
      font-weight: 600;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .p9-question-title {
      font-size: 21px;
      font-weight: 650;
      color: var(--obsidian);
      letter-spacing: -0.02em;
      line-height: 1.3;
    }
    .p9-question-sub {
      font-family: var(--serif);
      font-size: 14px;
      color: var(--ink-mute);
      margin-top: 4px;
      line-height: 1.45;
    }
    .p9-selection-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 12px;
      margin: 12px 0;
      transform-style: preserve-3d;
    }
    .p9-selection-tile {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-align: left;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1.5px solid rgba(228, 224, 214, 0.85);
      background: rgba(255, 255, 255, 0.52);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      cursor: pointer;
      font-family: var(--sans);
      transform: translate3d(0, 0, 4px);
      transition: transform 0.18s cubic-bezier(0.2, 0.8, 0.2, 1), border-color 0.16s, background 0.16s, box-shadow 0.18s;
      box-shadow: 0 6px 16px rgba(20, 20, 19, 0.04);
    }
    .p9-selection-tile:hover:not(:disabled) {
      transform: translate3d(0, -2px, 14px);
      border-color: rgba(31, 94, 122, 0.55);
      background: rgba(255, 255, 255, 0.80);
      box-shadow: 0 12px 26px rgba(20, 20, 19, 0.08);
    }
    .p9-selection-tile.selected {
      transform: translate3d(0, -3px, 22px);
      border-color: var(--brand);
      background: rgba(255, 255, 255, 0.90);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 16px 34px rgba(31, 94, 122, 0.14), 0 0 0 1px var(--brand);
    }
    .p9-selection-tile:disabled {
      opacity: 0.48;
      cursor: not-allowed;
    }
    .p9-tile-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }
    .p9-tile-check {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 1.5px solid var(--hairline);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: #fff;
      background: #fff;
      flex-shrink: 0;
    }
    .p9-selection-tile.selected .p9-tile-check {
      background: var(--brand);
      border-color: var(--brand);
    }
    .p9-tile-label {
      font-size: 14px;
      font-weight: 600;
      color: var(--obsidian);
      line-height: 1.3;
    }
    .p9-tile-sub {
      font-size: 12px;
      color: var(--ink-mute);
      line-height: 1.4;
      margin-top: 4px;
    }

    /* ── Modern Spatial Field Controls (No 1990s HTML Forms) ── */
    .spatial-field-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 12px;
      margin: 12px 0;
    }
    .spatial-field-box {
      background: rgba(255, 255, 255, 0.48);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1.5px solid rgba(228, 224, 214, 0.85);
      border-radius: 12px;
      padding: 10px 14px;
      box-shadow: 0 4px 12px rgba(20, 20, 19, 0.03);
      transition: border-color 0.16s, box-shadow 0.18s, background 0.16s;
    }
    .spatial-field-box:focus-within {
      border-color: var(--brand);
      background: rgba(255, 255, 255, 0.85);
      box-shadow: 0 8px 20px rgba(31, 94, 122, 0.10);
    }
    .spatial-field-label {
      font-size: 12px;
      font-family: var(--sans);
      font-weight: 600;
      color: var(--obsidian);
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .spatial-input {
      width: 100%;
      border: none;
      background: transparent;
      font-size: 14.5px;
      font-weight: 600;
      color: var(--obsidian);
      outline: none;
      font-family: var(--mono);
      padding: 2px 0;
    }
    .spatial-input::placeholder {
      color: rgba(90, 98, 106, 0.5);
      font-weight: 400;
    }

    /* ── Tactile Device Pairing Ceremony (P10: QrCeremony — CIRISGame Design) ── */
    .pairing-ceremony-card {
      margin-top: 14px;
      padding: 16px 18px;
      background: rgba(234, 242, 238, 0.60);
      border: 1px solid rgba(120, 140, 93, 0.35);
      border-radius: 14px;
      box-shadow: 0 6px 18px rgba(20, 20, 19, 0.03);
    }
    .pairing-ceremony-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .pairing-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: rgba(120, 140, 93, 0.20);
      color: #788C5D;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }
    .pairing-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--obsidian);
    }
    .pairing-sub {
      font-family: var(--serif);
      font-size: 12.5px;
      color: var(--ink-mute);
      margin-top: 2px;
    }
    .viewfinder-scan-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 14px;
      background: rgba(250, 249, 245, 0.85);
      border: 1.5px dashed rgba(176, 174, 165, 0.60);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.18s ease;
      text-align: center;
      margin-top: 10px;
    }
    .viewfinder-scan-box:hover {
      border-color: var(--brand);
      background: #ffffff;
      box-shadow: 0 6px 18px rgba(31, 94, 122, 0.10);
    }
    /* ── Live QR Camera Viewfinder ── */
    .qr-camera-viewport {
      position: relative;
      width: 100%;
      height: 290px;
      border-radius: 14px;
      overflow: hidden;
      background: #141413;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 32px rgba(0,0,0,0.25);
    }
    .qr-camera-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .qr-reticle {
      position: absolute;
      width: 200px;
      height: 200px;
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-radius: 16px;
      box-shadow: 0 0 0 4000px rgba(0, 0, 0, 0.45);
      pointer-events: none;
    }
    .qr-reticle::before, .qr-reticle::after {
      content: "";
      position: absolute;
      width: 24px;
      height: 24px;
      border-color: #D97757;
      border-style: solid;
    }
    .qr-reticle::before {
      top: -2px; left: -2px;
      border-width: 4px 0 0 4px;
      border-top-left-radius: 14px;
    }
    .qr-reticle::after {
      bottom: -2px; right: -2px;
      border-width: 0 4px 4px 0;
      border-bottom-right-radius: 14px;
    }
    .qr-reticle-c2 {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
    }
    .qr-reticle-c2::before, .qr-reticle-c2::after {
      content: "";
      position: absolute;
      width: 24px;
      height: 24px;
      border-color: #D97757;
      border-style: solid;
    }
    .qr-reticle-c2::before {
      top: -2px; right: -2px;
      border-width: 4px 4px 0 0;
      border-top-right-radius: 14px;
    }
    .qr-reticle-c2::after {
      bottom: -2px; left: -2px;
      border-width: 0 0 4px 4px;
      border-bottom-left-radius: 14px;
    }
    .qr-scan-line {
      position: absolute;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, transparent, #788C5D, #D97757, #788C5D, transparent);
      box-shadow: 0 0 8px #788C5D;
      animation: qrScanSweep 2s ease-in-out infinite alternate;
    }
    @keyframes qrScanSweep {
      0% { top: 8%; opacity: 0.3; }
      50% { opacity: 1; }
      100% { top: 92%; opacity: 0.3; }
    }
    .editorial-input-capsule {
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1.5px solid rgba(176, 174, 165, 0.45);
      background: rgba(250, 249, 245, 0.90);
      font-family: var(--mono);
      font-size: 13.5px;
      color: var(--obsidian);
      transition: all 0.16s ease;
      box-sizing: border-box;
      margin-top: 4px;
    }
    .editorial-input-capsule:focus {
      outline: none;
      border-color: var(--brand);
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(31, 94, 122, 0.14);
    }
    .match-code-card {
      margin-top: 12px;
      padding: 14px;
      border-radius: 10px;
      background: rgba(212, 162, 127, 0.14);
      border: 1px solid rgba(212, 162, 127, 0.45);
      text-align: center;
    }
    .match-code-eyebrow {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      color: #966742;
      font-weight: 600;
    }
    .match-code-digits {
      font-family: var(--mono);
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 0.24em;
      color: var(--obsidian);
      margin: 4px 0;
    }
    .match-code-hint {
      font-family: var(--serif);
      font-size: 12px;
      color: var(--ink-mute);
    }
    .status-pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--ink-mute);
      display: inline-block;
    }
    .status-pulse-dot.ok {
      background: #2E6F40;
      box-shadow: 0 0 0 3px rgba(46, 111, 64, 0.20);
    }
    .status-pulse-dot.warn {
      background: #D97757;
      box-shadow: 0 0 0 3px rgba(217, 119, 87, 0.22);
    }

    /* ── P3: ItemRow — Strictly 3 Scannable Inline Elements (`Title`, `ScopePill`/`Chip`, `☰`/`⋯`) ── */
    .item-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 0;
      border-top: 1px solid #F2EFE9;
    }
    .item-row:first-child { border-top: none; }
    .item-title {
      font-size: 14px;
      font-weight: 500;
      color: var(--obsidian);
    }
    .item-row.blurred .item-title {
      filter: blur(4px);
      transition: filter 0.18s;
    }
    .item-row.blurred:hover .item-title { filter: none; }
    .item-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    /* ── P5: ScopePill ── */
    .scope-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      color: var(--obsidian);
      background: var(--bone);
      border: 1px solid var(--hairline);
    }
    .circle-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* ── P6: Chip ── */
    .chip {
      display: inline-flex;
      align-items: center;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--paper);
      color: var(--ink-mute);
    }
    .chip.ok { background: rgba(32, 122, 60, 0.1); color: var(--ok); }
    .chip.warn { background: rgba(184, 107, 20, 0.12); color: var(--warn); }
    .chip.danger { background: rgba(184, 35, 35, 0.12); color: var(--danger); }
    .chip.brand { background: rgba(31, 94, 122, 0.1); color: var(--brand); }

    /* ── Expandable Detail Drawer (`⋯`) ── */
    .expand-body {
      border-top: 1px solid #F2EFE9;
      padding: 10px 0 14px;
      font-size: 12px;
      color: var(--ink-mute);
    }
    .kv-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      padding: 6px 0;
      border-bottom: 1px dashed #F2EFE9;
    }
    .kv-row:last-child { border-bottom: none; }
    .mono-hint {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--ink-mute);
    }

    /* ── P7: StateBlock ── */
    .state-banner {
      padding: 12px 14px;
      border-radius: 10px;
      margin-bottom: 12px;
      font-size: 13px;
      border: 1px solid var(--hairline);
      background: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .state-banner.danger {
      border-color: rgba(184, 35, 35, 0.4);
      background: rgba(184, 35, 35, 0.05);
      color: var(--danger);
    }
    .state-banner.brand {
      border-color: rgba(31, 94, 122, 0.35);
      background: rgba(31, 94, 122, 0.05);
      color: var(--brand);
    }

    /* ── Form Inputs & Choice Cards (First-Run Wizard) ── */
    .field-input {
      width: 100%;
      padding: 8px 11px;
      border-radius: 8px;
      border: 1px solid rgba(228, 224, 214, 0.85);
      background: rgba(255, 255, 255, 0.52);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      font-family: var(--sans);
      font-size: 13px;
      color: var(--obsidian);
      box-sizing: border-box;
      transition: background 0.16s, border-color 0.16s;
    }
    .field-input:focus {
      background: rgba(255, 255, 255, 0.85);
      border-color: var(--brand);
      outline: none;
    }
    .choice-btn {
      flex: 1;
      text-align: left;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--hairline);
      background: var(--bone);
      cursor: pointer;
      font-family: var(--sans);
      transition: border-color 0.15s, background 0.15s;
    }
    .choice-btn.selected {
      border-color: var(--brand);
      background: rgba(31, 94, 122, 0.06);
    }
    .choice-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .match-code-box {
      font-family: var(--mono);
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: var(--brand);
      background: var(--bone);
      border: 1px solid var(--hairline);
      border-radius: 10px;
      padding: 10px 16px;
      text-align: center;
      margin: 8px 0;
    }

    /* ── Compose / Chat Input Bar ── */
    .compose-row {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .compose-input {
      flex: 1;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid rgba(228, 224, 214, 0.85);
      background: rgba(255, 255, 255, 0.52);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      font-family: var(--sans);
      font-size: 13px;
      outline: none;
      transition: background 0.16s, border-color 0.16s;
    }
    .compose-input:focus {
      background: rgba(255, 255, 255, 0.85);
      border-color: var(--brand);
    }

    /* ── Bottom Circle Bar (5 Circles) ── */
    .bottom-circles {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(250, 249, 245, 0.94);
      backdrop-filter: blur(8px);
      border-top: 1px solid var(--hairline);
      display: flex;
      justify-content: center;
      gap: 6px;
      padding: 10px 12px;
      z-index: 25;
    }
    .circle-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--ink-mute);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
    }
    .circle-btn:hover { background: var(--paper); color: var(--obsidian); }
    .circle-btn.active {
      background: #fff;
      color: var(--obsidian);
      font-weight: 600;
      border-color: var(--hairline);
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }

    /* ── Slide-Up Sheet (`☰` Receipt, `ConfirmSheet`, `My things`) ── */
    .sheet-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(20, 20, 19, 0.28);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 50;
    }
    .sheet {
      width: 100%;
      max-width: 560px;
      background: rgba(250, 249, 245, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top-left-radius: 16px;
      border-top-right-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.80);
      padding: 18px 20px 24px;
      box-shadow: 0 -8px 30px rgba(0,0,0,0.12);
      max-height: 85vh;
      overflow-y: auto;
    }
    .sheet-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .sheet-title {
      font-size: 15px;
      font-weight: 600;
    }
    canvas#spatialCanvas {
      width: 100%;
      height: 160px;
      background: #0F1319;
      border: 1px solid var(--hairline);
      border-radius: 8px;
      display: block;
      margin-top: 8px;
    }

    /* ── 3D Bevy / CIRISHolon (`holon-render-3d`) Deferral-Vote Stage ── */
    .holon-3d-stage {
      background: radial-gradient(circle at 50% 42%, #182230 0%, #0D1117 100%);
      color: #EDF2F7;
      border: 1px solid #2A3648;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
      box-shadow: 0 10px 28px rgba(10, 14, 22, 0.22);
      position: relative;
      overflow: hidden;
    }
    .holon-3d-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 10px;
    }
    .holon-3d-title {
      font-size: 14px;
      font-weight: 600;
      color: #F7FAFC;
      letter-spacing: -0.01em;
    }
    .holon-3d-sub {
      font-size: 12px;
      color: #A0AEC0;
      margin-top: 2px;
    }
    .holon-canvas-wrap {
      position: relative;
      width: 100%;
      height: 310px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.12);
      background: radial-gradient(circle at 50% 50%, #16202E 0%, #0A0E14 100%);
      overflow: hidden;
      cursor: grab;
    }
    .holon-canvas-wrap:active {
      cursor: grabbing;
    }
    canvas#holonDeferralCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .holon-ledger-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid rgba(255,255,255,0.1);
      font-family: var(--mono);
      font-size: 11px;
      color: #A0AEC0;
    }
    .holon-orb-strip {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 10px;
    }
    .holon-orb-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.06);
      color: #F7FAFC;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, transform 0.12s;
    }
    .holon-orb-pill:hover {
      background: rgba(255,255,255,0.14);
      transform: translateY(-1px);
    }
    .holon-orb-pill.bonded {
      border-color: #38B2AC;
      background: rgba(56, 178, 172, 0.22);
      font-weight: 600;
    }

    /* ── Universal CEG Hamburger (`☰`) 9 AttOps + Referent & Moderation Grid ── */
    .attop-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-top: 8px;
    }
    .attop-btn {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      padding: 7px 9px;
      border-radius: 8px;
      border: 1px solid var(--hairline);
      background: #fff;
      cursor: pointer;
      text-align: left;
      font-family: var(--sans);
      transition: background 0.12s, border-color 0.12s;
    }
    .attop-btn:hover:not(:disabled) {
      background: var(--paper);
      border-color: var(--brand);
    }
    .attop-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      background: var(--bone);
    }
    .attop-name {
      font-size: 12px;
      font-weight: 600;
      color: var(--obsidian);
    }
    .attop-why {
      font-size: 10px;
      color: var(--ink-mute);
      line-height: 1.25;
      margin-top: 2px;
    }

    /* ── Explanatory Tour & Guide Drawer (CC 4.5.13 / Epistemic Web) ── */
    .tour-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(20, 20, 19, 0.45);
      backdrop-filter: blur(4px);
      z-index: 1200;
      display: flex;
      justify-content: flex-start;
      animation: tourFadeIn 0.22s ease-out;
    }
    @keyframes tourFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .tour-panel {
      width: 460px;
      max-width: 94vw;
      height: 100%;
      background: var(--paper);
      box-shadow: 6px 0 28px rgba(0,0,0,0.22);
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--hairline);
      animation: tourSlideIn 0.28s cubic-bezier(0.16, 1, 0.3, 1);
      overflow: hidden;
    }
    @keyframes tourSlideIn {
      from { transform: translateX(-100%); }
      to { transform: translateX(0); }
    }
    .tour-header {
      padding: 16px 18px;
      border-bottom: 1px solid var(--hairline);
      background: #F3F0E8;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .tour-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .tour-subtitle {
      font-size: 12px;
      color: var(--ink-mute);
      margin-top: 2px;
    }
    .tour-body {
      padding: 18px;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .tour-card {
      background: #FAF9F5;
      border: 1px solid var(--hairline);
      border-radius: 8px;
      padding: 14px 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.03);
    }
    .tour-card-eyebrow {
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--brand);
      margin-bottom: 4px;
    }
    .tour-card-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 6px;
    }
    .tour-card-text {
      font-size: 13px;
      line-height: 1.5;
      color: #383836;
      margin-bottom: 10px;
    }
    .tour-card-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .tour-badge {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      background: #E8E4DA;
      color: #4A4A46;
    }

    /* ── On-Rails Guided Animation Engine HUD & Spotlight ── */
    .rail-spotlight {
      outline: 2.5px solid var(--brand) !important;
      outline-offset: 3px !important;
      box-shadow: 0 0 28px rgba(31, 94, 122, 0.45) !important;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1) !important;
    }
    #railTourDock {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      width: min(720px, 94vw);
      z-index: 1000;
      pointer-events: auto;
      animation: railDockSlideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes railDockSlideUp {
      from { transform: translate(-50%, 40px); opacity: 0; }
      to { transform: translate(-50%, 0); opacity: 1; }
    }
    .rail-card {
      background: rgba(250, 249, 245, 0.88);
      backdrop-filter: blur(20px) saturate(130%);
      -webkit-backdrop-filter: blur(20px) saturate(130%);
      border: 1.5px solid rgba(31, 94, 122, 0.32);
      border-radius: 18px;
      box-shadow: 0 20px 50px rgba(15, 20, 28, 0.20), 0 1px 0 rgba(255, 255, 255, 0.95) inset;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .rail-progress-bar-container {
      width: 100%;
      height: 4px;
      background: rgba(20, 20, 19, 0.08);
      position: relative;
    }
    .rail-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--c-justme) 0%, var(--brand) 45%, var(--c-neighbours) 100%);
      width: 0%;
      transition: width 0.1s linear;
    }
    .rail-content {
      padding: 13px 18px 12px;
    }
    .rail-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 6px;
    }
    .rail-badge-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .rail-live-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      color: #207A3C;
      background: rgba(32, 122, 60, 0.12);
      padding: 2px 8px;
      border-radius: 999px;
      letter-spacing: 0.04em;
    }
    .rail-live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #207A3C;
      animation: railPulse 1.4s ease-in-out infinite;
    }
    @keyframes railPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.85); }
    }
    .rail-step-pill {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 600;
      color: var(--brand);
      background: rgba(31, 94, 122, 0.09);
      padding: 2px 8px;
      border-radius: 999px;
    }
    .rail-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .rail-btn-icon {
      background: rgba(255, 255, 255, 0.75);
      border: 1px solid var(--hairline);
      border-radius: 8px;
      padding: 3px 8px;
      font-size: 12px;
      color: var(--obsidian);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-family: var(--sans);
      font-weight: 500;
      transition: background 0.15s, border-color 0.15s;
    }
    .rail-btn-icon:hover {
      background: #fff;
      border-color: var(--brand);
    }
    .rail-title {
      font-size: 15.5px;
      font-weight: 700;
      color: var(--obsidian);
      letter-spacing: -0.01em;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .rail-desc {
      font-size: 13px;
      color: #383836;
      line-height: 1.45;
      margin-bottom: 8px;
    }
    .rail-action-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: rgba(255, 255, 255, 0.65);
      border: 1px solid rgba(228, 224, 214, 0.80);
      border-radius: 10px;
      padding: 6px 12px;
      font-size: 12px;
    }
    .rail-action-status {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--brand);
      font-weight: 500;
      font-family: var(--mono);
      font-size: 11.5px;
    }

    /* ── Multi-User Chat & Room Surfaces (CSD-091, CSD-103, CSD-110) ── */
    .chat-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      transform-style: preserve-3d;
    }
    .chat-room-nav {
      display: flex;
      gap: 6px;
      align-items: center;
      overflow-x: auto;
      padding: 4px 2px;
      border-bottom: 1px solid var(--hairline);
    }
    .chat-room-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.75);
      border: 1px solid rgba(228, 224, 214, 0.90);
      border-radius: 12px;
      backdrop-filter: blur(12px);
      box-shadow: 0 4px 16px rgba(20, 20, 19, 0.03);
    }
    .chat-room-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .chat-room-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--obsidian);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .chat-room-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .chat-call-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(46, 125, 90, 0.12);
      color: #246B4E;
      border: 1px solid rgba(46, 125, 90, 0.35);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.16s ease;
      box-shadow: 0 2px 6px rgba(46, 125, 90, 0.08);
    }
    .chat-call-btn:hover {
      background: rgba(46, 125, 90, 0.22);
      border-color: #246B4E;
      transform: translateY(-1px);
    }
    .chat-members-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(20, 20, 19, 0.05);
      border: 1px solid rgba(228, 224, 214, 0.85);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12px;
      color: var(--obsidian);
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .chat-members-btn:hover {
      background: rgba(20, 20, 19, 0.08);
      border-color: var(--brand);
    }
    .chat-roster-drawer {
      background: rgba(246, 244, 239, 0.95);
      border: 1px solid rgba(210, 204, 192, 0.85);
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 8px;
      animation: fadeIn 0.2s ease;
    }
    .chat-roster-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 8px;
      margin: 10px 0;
    }
    .chat-roster-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      background: #fff;
      border: 1px solid var(--hairline);
      border-radius: 8px;
      font-size: 12px;
    }
    .chat-message-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 440px;
      overflow-y: auto;
      padding: 8px 4px;
    }
    .chat-msg-card {
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(228, 224, 214, 0.85);
      border-radius: 10px;
      padding: 10px 14px;
      position: relative;
      transition: transform 0.16s ease, border-color 0.16s ease;
    }
    .chat-msg-card:hover {
      border-color: rgba(31, 94, 122, 0.4);
      transform: translate3d(0, -1px, 4px);
    }
    .chat-msg-card.mine {
      background: rgba(234, 243, 248, 0.85);
      border-color: rgba(31, 94, 122, 0.25);
    }
    .chat-msg-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: var(--ink-mute);
      margin-bottom: 4px;
    }
    .chat-msg-author {
      font-weight: 600;
      color: var(--obsidian);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .chat-msg-body {
      font-size: 13.5px;
      color: var(--obsidian);
      line-height: 1.45;
      white-space: pre-wrap;
    }

    /* ── CSD-134 Video & Voice Calls (3D Spatial Call Stage) ── */
    .call-stage-card {
      background: rgba(18, 20, 22, 0.94);
      color: #F0EDE6;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 16px 20px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      transform-style: preserve-3d;
      animation: fadeIn 0.22s ease-out;
    }
    .call-top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.10);
    }
    .call-status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(46, 125, 90, 0.25);
      color: #5BE8A5;
      border: 1px solid rgba(91, 232, 165, 0.4);
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 12px;
      font-weight: 600;
      font-family: var(--mono);
      letter-spacing: 0.02em;
    }
    .call-status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #5BE8A5;
      animation: pulseGreen 1.4s infinite;
    }
    @keyframes pulseGreen {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.2); }
    }
    .call-disclaimer-box {
      margin: 12px 0;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.10);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 12px;
      color: #C0BCB4;
    }
    .call-video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 14px;
      margin: 14px 0;
      perspective: 1200px;
    }
    .call-video-tile {
      position: relative;
      background: #141618;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 12px;
      overflow: hidden;
      aspect-ratio: 16 / 10;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 10px 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      transform: translate3d(0, 0, 8px);
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .call-video-tile:hover {
      transform: translate3d(0, -3px, 18px);
      border-color: rgba(91, 232, 165, 0.45);
    }
    .call-video-tile.speaking {
      border-color: #5BE8A5;
      box-shadow: 0 0 16px rgba(91, 232, 165, 0.3);
    }
    .call-tile-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 2;
    }
    .call-tile-name {
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .call-tile-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      opacity: 0.85;
    }
    .call-tile-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 2;
      font-size: 11px;
      color: #A09C94;
    }

        p.proposedByOccurrenceId !== me &&
        !p.approvals.includes(me) &&
        !p.objectors.includes(me)
      ).length;
    }

    function toggleExpand(key) {
      state.expandedIds[key] = !state.expandedIds[key];
      renderAll();
    }

    function getCircle(id) {
      return CIRCLES.find(c => c.id === id) || CIRCLES[0];
    }

    function selectCircle(id) {
      state.setupMode = false;
      state.circleId = id;
      state.instrumentId = null;
      state.showRosterDrawer = false;
      const matchingComm = state.communities.find(c => (c.scope || c.cohort) === id);
      if (matchingComm) {
        state.activeCommunityId = matchingComm.id;
      }
      renderAll();
    }

    function selectTab(tab) {
      state.setupMode = false;
      state.tab = tab;
      state.instrumentId = null;
      state.showRosterDrawer = false;
      if (tab === "Chats") {
        const matchingComm = state.communities.find(c => (c.scope || c.cohort) === state.circleId);
        if (matchingComm && (!state.activeCommunityId || !state.communities.some(c => c.id === state.activeCommunityId && (c.scope || c.cohort) === state.circleId))) {
          state.activeCommunityId = matchingComm.id;
        }
      }
      renderAll();
    }

    function selectInstrument(id) {
      state.setupMode = false;
      state.instrumentId = id;
      closeSheet();
      renderAll();
    }

    function startFirstRunWizard(resetFresh) {
      if (resetFresh) {
        state.wizard.step = "YOU";
        state.wizard.identityPath = null;
        state.wizard.ageBand = null;
        state.wizard.traceConsent = null;
        state.wizard.addDeviceStatus = "idle";
        state.wizard.addDeviceMatchCode = null;
        state.wizard.ownershipState = "unclaimed";
      }
      state.setupMode = true;
      closeSheet();
      renderAll();
    }

    function toggleHalt() {
      state.halted = !state.halted;
      renderAll();
    }

    function closeSheet() {
      if (typeof closeQrCameraScanner === "function") {
        closeQrCameraScanner();
      }
      document.getElementById("sheetHost").innerHTML = "";
    }

    // ══════════════════════════════════════════════════════════════════════════
    // 0. THE 12 REUSABLE UX PRIMITIVES (`P1`–`P12` from `epistemic_scene.rs`)
    // ══════════════════════════════════════════════════════════════════════════

    // `P5: ScopePill` — sole place a Circle's color dot, name, and `local_only_badge` (`CSD-127`) are rendered
    function renderP5ScopePill(scopeId, tag, localOnlyBadge) {
      const sc = getCircle(scopeId);
      return `
        <span class="scope-pill" ${tag ? `data-csd-tag="${tag}"` : ''}>
          <span class="circle-dot" style="background:${sc.color}"></span>
          <span>${sc.label}</span>

        </span>
      `;
    }

    // `P6: Chip` — `Choice | Badge | Filter | Sort`
    function renderP6Chip({ tag, label, tone = "", kind = "Badge", selected = false, disabled = false, onclick = "", style = "" }) {
      const tagAttr = tag ? `data-csd-tag="${tag}"` : "";
      const styleAttr = style ? `style="${style}"` : "";
      if (kind === "Choice") {
        return `
          <button class="btn ${selected ? 'btn-brand' : ''} ${tone}"
                  ${tagAttr} ${styleAttr}
                  ${disabled ? 'disabled' : ''}
                  ${onclick ? `onclick="${onclick}"` : ''}>
            ${label}
          </button>
        `;
      }
      return `<span class="chip ${tone}" ${tagAttr} ${styleAttr}>${label}</span>`;
    }

    // `P7: StateBlock` — 7-way epistemic surface state (`Populated | Loading | Empty | Error | FileGone | HiddenByRules | Unreviewed`)
    function renderP7StateBlock({ tag, tone = "", contentHtml, rightHtml = "" }) {
      return `
        <div class="state-banner ${tone}" ${tag ? `data-csd-tag="${tag}"` : ''}>
          <span>${contentHtml}</span>
          ${rightHtml}
        </div>
      `;
    }

    // `P2: FieldRow` — scalar state variable key-value row with `protocol_wire_name` and `VerificationBasis`
    function renderP2FieldRow({ tag, labelHtml, valueHtml, wireName = "", verification = "" }) {
      const basisBadge = verification
        ? ` <span class="chip ${verification === 'Wire' ? 'ok' : verification.startsWith('ByRule') ? 'brand' : ''}" style="font-size:10px;padding:1px 6px;">${verification}</span>`
        : "";
      const wireHint = wireName ? ` <code style="font-size:11px;color:var(--ink-mute);">(${wireName})</code>` : "";
      return `
        <div class="kv-row" ${tag ? `data-csd-tag="${tag}"` : ''}>
          <span>${labelHtml}${wireHint}</span>
          <span style="display:flex;align-items:center;gap:6px;">${valueHtml}${basisBadge}</span>
        </div>
      `;
    }

    // `P3: ItemRow` — collection row enforcing the 3-fact inline scannability cap + Hamburger Epistemic Invariant (`CSD-006`)
    function renderP3ItemRow({ tag, id, titleHtml, subtitleHtml = "", scopeId = "JustMe", localOnlyBadge = false, hasReceipt = true, rightExtraHtml = "" }) {
      const rowTag = tag || `csd_item_${id}`;
      return `
        <div class="item-row" data-csd-tag="${rowTag}">
          <div>
            <div class="item-title">${titleHtml}</div>

          </div>

              <button class="btn-ghost" data-csd-tag="btn_receipt_${id}" title="5-fact CEG receipt &amp; actions (P4)" onclick="openReceiptSheet('${id}')">
                &#9776;
              </button>

        </div>

    // `P1: CardShell` — non-nesting card shell with title, chip, `P2` fields, `P3` items, and `⋯` (`EllipsisExpand`) progressive disclosure
    function renderP1CardShell({ tag, titleHtml, chipLabel = "", chipTone = "", headerRightHtml = "", bodyHtml = "", ellipsisKey = "", ellipsisHtml = "" }) {
      const isOpen = ellipsisKey ? !!state.expandedIds[ellipsisKey] : false;
      return `
        <div class="card" ${tag ? `data-csd-tag="${tag}"` : ''}>
          <div class="card-header">

              ${headerRightHtml}
              ${ellipsisKey && ellipsisHtml ? `
                <button class="btn-ghost" data-csd-tag="btn_${ellipsisKey}_ellipsis" title="More details (&ctdot;)" onclick="toggleExpand('${ellipsisKey}')">&ctdot;</button>
              ` : ''}
            </div>
          </div>
          ${bodyHtml}
          ${ellipsisKey && ellipsisHtml && isOpen ? `<div class="expand-body">${ellipsisHtml}</div>` : ''}
        </div>
      `;
    }

    // `P8: ConfirmSheet` — 3-fact confirmation gate (`ConfirmFacts3`)
    function openP8ConfirmSheet({ tag, title, fact1Label, fact1Val, fact2Label, fact2Val, fact3Label, fact3Val, noteHtml = "", confirmTag, confirmLabel, confirmTone = "btn-brand", onConfirmJs, cancelLabel = "Cancel" }) {
      const host = document.getElementById("sheetHost");
      host.innerHTML = `
        <div class="sheet-backdrop" onclick="if(event.target===this)closeSheet()">

              <button class="btn-ghost" onclick="closeSheet()">&#10005;</button>
            </div>
            <div class="card" style="padding:8px 14px;">

              <div class="kv-row"><span>2. ${fact2Label}</span><strong>${fact2Val}</strong></div>

            ${noteHtml}
            <div style="display:flex; gap:8px; margin-top:12px;">

    // ── `CIRISHolon` (`holon-render-3d` / `species_palette.json`) 3D Species Palette & Context/Vote Engine ──
    const HOLON_SPECIES_PALETTE = {
      1: { symbol: "H",  name: "Hydrogen", color: "#EBEBEB", rgb: [0.92, 0.92, 0.92], r_cov: 0.59 },
      3: { symbol: "Li", name: "Lithium",  color: "#CC80FF", rgb: [0.80, 0.50, 1.00], r_cov: 1.28 },
      6: { symbol: "C",  name: "Carbon",   color: "#38BDF8", rgb: [0.22, 0.74, 0.97], r_cov: 1.44 },
      7: { symbol: "N",  name: "Nitrogen", color: "#34D399", rgb: [0.20, 0.83, 0.60], r_cov: 1.34 },
      8: { symbol: "O",  name: "Oxygen",   color: "#60A5FA", rgb: [0.38, 0.65, 0.98], r_cov: 1.25 },
      9: { symbol: "F",  name: "Fluorine", color: "#F87171", rgb: [0.97, 0.44, 0.44], r_cov: 1.21 },
    };

    // Build a `HolonFrameBuffer` (`24.0`-bohr World Box, Atom 0 = Context `Z=8` at `[12,12,12]`, Atoms `1..=K` = Choices)
    function buildHolonFrameFromDeferral(dv) {
      const center = [12.0, 12.0, 12.0];
      const atoms = [
        {
          idx: 0,
          label: dv.contextTitle,
          subtitle: dv.contextSubtitle || dv.dimension,
          z: 8,
          pos: center,
          radius: 1.48,
          isContext: true,
          receiptId: dv.receiptId || dv.deferralId,
        }
      ];
      const bonds = [];
      const choices = dv.choices || [];
      const n = Math.max(1, choices.length);
      choices.forEach((ch, i) => {
        const angle = (2 * Math.PI * i) / n - Math.PI / 2;
        const isSel = !!ch.selected || (dv.selectedChoiceId && dv.selectedChoiceId === ch.choiceId);
        const orbitR = isSel ? 4.2 : 6.6;
        const zOff = ((i % 3) - 1) * 1.65;
        const pos = [
          center[0] + orbitR * Math.cos(angle),
          center[1] + orbitR * Math.sin(angle),
          center[2] + zOff,
        ];
        atoms.push({
          idx: i + 1,
          choiceId: ch.choiceId,
          label: ch.label,
          subtitle: ch.subtitle || "",
          voteScore: typeof ch.voteScore === "number" ? ch.voteScore : 1.0,
          z: ch.atomicNumber || (ch.voteScore < 0 ? 9 : ch.voteScore === 0 ? 3 : 7),
          pos,
          radius: isSel ? 1.24 : 0.98,
          selected: isSel,
          disabled: !!ch.disabled,
          onClickJs: ch.onClickJs || "",
          csdTag: ch.csdTag || `holon_orb_${ch.choiceId}`,
          receiptId: ch.receiptId || `orb_${ch.choiceId}`,
        });
        if (isSel) {
          bonds.push({ a: 0, b: i + 1, order: 2 });
        }
      });
      return { boxL: 24.0, atoms, bonds, deferral: dv };
    }

    // ── P9: ChoiceBlock (Context, Options, Consequences / What Changes Based on Each Option) ──
    // In CEWPOS, P9 is the universal Choice primitive. The Context determines whether it is
    // a wizard step, an operational posture choice, an agent deferral needing response,
    // a consent decision, a moderation ruling, or a multi-party circle governance vote.
    function renderP9ChoiceBlock({
      tag,
      contextTitle,
      contextSubtitle = "",
      dimension = "choice:selection",
      eyebrow = "CEWP CHOICE",
      scope = "JustMe",
      stageTag = "",
      receiptId = "",
      options = [],
      summaryHtml = "",
      bodyExtraHtml = "",
      actionsHtml = "",
      quorumRule = "",
      approvals = 0,
      required = 1,
      objections = 0,
    }) {
      const isVote = required > 1 || dimension.includes("vote") || dimension.includes("roster") || dimension.includes("ceremony");
      const quorumBadge = isVote
        ? `${approvals}/${required} Quorum &middot; ${objections || 0} objections`
        : (required === 1 && approvals >= 1 ? "1/1 Selected" : "");

      const optionsGridHtml = (options && options.length > 0) ? `
        <div class="p9-selection-grid" data-csd-tag="p9_choices_${tag}">
          ${options.map((opt, idx) => {
            const isSel = !!opt.selected;
            const recId = opt.receiptId || receiptId;
            const tagAttr = opt.csdTag || `choice_${opt.id || idx}`;
            return `
              <div class="p9-selection-tile ${isSel ? 'selected' : ''}"
                   role="button"
                   tabindex="0"
                   data-bevy-choice="1"
                   data-bevy-selected="${isSel ? '1' : '0'}"
                   data-csd-tag="${tagAttr}"
                   ${opt.disabled ? 'style="opacity:0.48;pointer-events:none;"' : `onclick="${opt.onSelectJs || opt.onClickJs || ''}"`}>
                <div>
                  <div class="p9-tile-top">
                    <div style="display:flex;align-items:center;gap:8px;">
                      <span class="p9-tile-check">${isSel ? '&#10003;' : (opt.indicator || idx + 1)}</span>
                      <span class="p9-tile-label">${opt.label}</span>
                    </div>
                    <div style="display:flex;align-items:center;gap:4px;">
                      ${opt.chipLabel ? `<span class="chip ${isSel ? 'brand' : ''}">${opt.chipLabel}</span>` : ''}
                      ${recId ? `<button class="btn-ghost" style="padding:2px 6px;font-size:12px;"
                              data-csd-tag="btn_receipt_${recId}"
                              title="5-fact CEG receipt &amp; actions (P4)"
                              onclick="event.stopPropagation(); openReceiptSheet('${recId}')">&#9776;</button>` : ''}
                    </div>
                  </div>
                  ${opt.consequence || opt.subtitle ? `<div class="p9-tile-sub">${opt.consequence || opt.subtitle}</div>` : ''}
                </div>
              </div>
            `;
          }).join("")}
        </div>
      ` : "";

      return `
        <div class="p9-question-hero"
             data-bevy-question="1"
             data-csd-tag="${stageTag || tag}">
          <div class="p9-question-eyebrow">
            <span>${eyebrow}</span>
            <div style="display:flex;align-items:center;gap:6px;">
              ${scope ? renderP5ScopePill(scope, "", true) : ''}
              ${quorumBadge ? `<span class="chip">${quorumBadge}</span>` : ''}
              ${receiptId ? `<button class="btn-ghost"
                      data-csd-tag="btn_receipt_${receiptId}"
                      title="5-fact CEG receipt &amp; actions"
                      onclick="openReceiptSheet('${receiptId}')">&#9776;</button>` : ''}
            </div>
          </div>
          <div class="p9-question-title">${contextTitle}</div>
          ${contextSubtitle ? `<div class="p9-question-sub">${contextSubtitle}</div>` : ''}
        </div>
        ${optionsGridHtml}
        ${summaryHtml ? `<div style="font-size:12.5px;color:var(--ink-mute);padding:4px 0 8px;">${summaryHtml}</div>` : ''}
        ${bodyExtraHtml}
        ${actionsHtml}
      `;
    }

    // ── CC 4.5.13 ChoiceItem Renderer (P9 ChoiceBlock + Derived P8 ConfirmSheet) ──
    function renderP9FromChoiceItem(item, { onSelectJs = null, extraActionsHtml = "" } = {}) {
      if (!item) return "";
      const isSelf = item.policy === "self_choice" || (item.context && (item.context.role === "first_run" || item.context.role === "consent"));
      const selectedVal = (item.answer && item.answer.value) || item.default || null;

      const options = (item.options || []).map((opt, idx) => {
        const isSel = selectedVal === opt.value;
        const consequence = (opt.benefit && opt.downside)
          ? `Benefit: ${opt.benefit.text || opt.benefit} &middot; Downside: ${opt.downside.text || opt.downside}`
          : (opt.consequence || "");

        // Directional Asymmetry Law: outward/widening or irreversible actions require P8 ConfirmSheet
        const imp = opt.impact || {};
        const isWidening = imp.direction === "widens" || (imp.undo && imp.undo.possible === false);

        let clickJs = "";
        if (isWidening) {
          const movesText = imp.moves ? (imp.moves.text || imp.moves) : "State mutation";
          const toText = imp.to ? `${imp.to.audience} (${imp.to.tier})` : "Federation";
          const undoText = imp.undo ? (imp.undo.possible ? ((imp.undo.how && imp.undo.how.text) || "Yes — retract in 1 step") : "No — irreversible") : "Yes";
          const dangerNote = imp.to && imp.to.tier === "federation"
            ? `<div class="danger-banner" style="margin-top:8px;font-size:12px;">⚠️ Federation exposure: This telemetry will replicate across federation peers.</div>`
            : "";

          clickJs = `openP8ConfirmSheet({
            tag: 'confirm_${opt.value}',
            title: 'Confirm ${opt.benefit ? (opt.benefit.text || opt.benefit) : opt.value}',
            fact1Label: 'What moves', fact1Val: '${movesText.replace(/'/g, "\\'")}',
            fact2Label: 'Where it goes', fact2Val: '${toText.replace(/'/g, "\\'")}',
            fact3Label: 'Can I undo it?', fact3Val: '${undoText.replace(/'/g, "\\'")}',
            noteHtml: '${dangerNote.replace(/'/g, "\\'")}',
            confirmTag: 'btn_confirm_${opt.value}',
            confirmLabel: 'Confirm & Sign',
            confirmTone: 'btn-brand',
            onConfirmJs: 'closeSheet(); ${onSelectJs ? onSelectJs(opt.value) : `console.log("selected ${opt.value}")`}',
          })`;
        } else {
          // Narrowing and reversible options execute immediately in 1 step (Inv_ExitOneStep)
          clickJs = onSelectJs ? onSelectJs(opt.value) : `console.log("selected ${opt.value}")`;
        }

        return {
          id: opt.value,
          label: opt.benefit ? (opt.benefit.text || opt.benefit) : opt.value,
          consequence,
          chipLabel: imp.to ? (imp.to.tier === 'federation' ? 'Everyone' : 'Just me') : '',
          selected: isSel,
          csdTag: opt.tag || `choice_${opt.value}`,
          onSelectJs: clickJs,
        };
      });

      return renderP9ChoiceBlock({
        tag: item.id || "choice_item",
        contextTitle: item.context && item.context.title ? (item.context.title.text || item.context.title) : "Decision",
        contextSubtitle: item.context && item.context.body && item.context.body[0] ? (item.context.body[0].text || item.context.body[0]) : "",
        dimension: (item.options && item.options[0] && item.options[0].writes && item.options[0].writes[0] && item.options[0].writes[0].family) || item.policy || "choice:v1",
        eyebrow: isSelf ? "SINGLE-PERSON SELF CHOICE" : "QUORUM CEREMONY",
        scope: item.context && item.context.circle ? (item.context.circle === 'federation' ? 'Everyone' : 'JustMe') : 'JustMe',
        options,
        actionsHtml: extraActionsHtml,
        approvals: selectedVal ? 1 : 0,
        required: 1,
        objections: 0,
      });
    }

    // `P9: TwoPathCeremonyBlock` — Adapter mapping ceremony/deferral votes to `renderP9ChoiceBlock`
    function renderP9TwoPathCeremony({
      tag,
      title,
      chipLabel,
      chipTone = "brand",
      summaryHtml = "",
      bodyExtraHtml = "",
      ellipsisKey,
      quorumRule,
      approvals = 0,
      required = 1,
      objections = 0,
      windowLabel = "24h W_self (86,400s)",
      actionsHtml = "",
      deferralVote = null,
    }) {
      const dv = deferralVote || {
        deferralId: tag || "p9_ceremony",
        contextTitle: title,
        contextSubtitle: quorumRule || "Select your decision below",
        dimension: quorumRule || "ceremony:quorum",
        scope: state.circleId || "JustMe",
        quorumRequired: required,
        quorumApprovals: approvals,
        quorumObjections: objections,
        windowLabel,
        choices: [],
      };

      const choiceBlockHtml = renderP9ChoiceBlock({
        tag: dv.deferralId || tag,
        contextTitle: dv.contextTitle || title,
        contextSubtitle: dv.contextSubtitle,
        dimension: dv.dimension || quorumRule || "ceremony:quorum",
        eyebrow: dv.quorumRequired > 1 ? "TWO-PATH CEREMONY" : "SINGLE-PERSON VOTE",
        scope: dv.scope,
        stageTag: dv.stageTag || dv.canvasTag || `p9_stage_${dv.deferralId}`,
        receiptId: dv.receiptId,
        options: (dv.choices || []).map(ch => ({
          id: ch.choiceId,
          label: ch.label,
          consequence: ch.subtitle,
          selected: !!ch.selected || (dv.selectedChoiceId && dv.selectedChoiceId === ch.choiceId),
          disabled: !!ch.disabled,
          onSelectJs: ch.onClickJs || `holonSelectDeferralOrb('${dv.deferralId}', '${ch.choiceId}')`,
          csdTag: ch.csdTag || `holon_orb_${ch.choiceId}`,
          receiptId: ch.receiptId,
        })),
        summaryHtml,
        bodyExtraHtml,
        actionsHtml,
        approvals: approvals || dv.quorumApprovals,
        required: required || dv.quorumRequired,
        objections: objections || dv.quorumObjections,
      });

      const expandContent = `
        ${renderP2FieldRow({ labelHtml: "Ceremony / Deferral policy", valueHtml: `<code>${quorumRule || dv.dimension}</code>`, verification: "ByRule CC 4.5.12" })}
        ${renderP2FieldRow({ labelHtml: "Quorum tally", valueHtml: `${dv.quorumApprovals} of ${dv.quorumRequired} signatures &middot; ${dv.quorumObjections || 0} objections`, verification: "Wire" })}
        ${renderP2FieldRow({ labelHtml: "Silence / Deferral window", valueHtml: windowLabel, verification: "ByRule" })}
        ${actionsHtml}
      `;

      return renderP1CardShell({
        tag,
        titleHtml: title,
        chipLabel,
        chipTone,
        headerRightHtml: `<button class="btn-ghost" data-csd-tag="btn_receipt_${dv.receiptId || dv.deferralId}" title="5-fact CEG receipt &amp; actions" onclick="openReceiptSheet('${dv.receiptId || dv.deferralId}')">&#9776;</button>`,
        bodyHtml: choiceBlockHtml,

    function wizardCast3DVote(choiceId) {
      const w = state.wizard;
      state.holon3d.wExt += 0.0125;
      state.holon3d.ePair -= 0.042;
      if (choiceId === "choice_identity_new") {
        w.identityPath = "NEW";
        if (!w.fedidLabel.trim()) w.fedidLabel = "alice.ciris";
        if (!w.ageBand) w.ageBand = "ADULT";
      } else if (choiceId === "choice_identity_add_device") {
        w.identityPath = "ADD_THIS_DEVICE";
        if (!w.addDeviceContact) w.addDeviceContact = "ciris://ed25519:alice.ciris#root@192.168.1.42:4243";
      } else if (choiceId === "choice_age_adult") {
        w.identityPath = w.identityPath || "NEW";
        if (!w.fedidLabel.trim()) w.fedidLabel = "alice.ciris";
        w.ageBand = "ADULT";
      } else if (choiceId === "choice_age_declined") {
        w.identityPath = w.identityPath || "NEW";
        if (!w.fedidLabel.trim()) w.fedidLabel = "alice.ciris";
        w.ageBand = "DECLINED";
      } else if (choiceId === "choice_age_minor") {
        w.identityPath = w.identityPath || "NEW";
        w.ageBand = "MINOR";
      } else if (choiceId === "choice_consent_local_only") {
        w.traceConsent = false;
        w.traceAnalyze = false;
      } else if (choiceId === "choice_consent_share_traces") {
        w.traceConsent = true;
      } else if (choiceId === "choice_bond_local_ollama") {
        w.runWithAi = true;
        w.llmProvider = "local_ollama";
        w.llmStatus = "ok";
      } else if (choiceId === "choice_bond_ciris_portal") {
        w.runWithAi = true;
        w.llmProvider = "ciris_portal";
        w.llmStatus = "ok";
      } else if (choiceId === "choice_bond_node_only") {
        w.runWithAi = false;
      } else if (choiceId === "choice_claim_0600_pin") {
        wizardClaimOwnershipNow();
        return;
      } else if (choiceId === "choice_complete_enter_circles") {
        if (w.identityPath === "ADD_THIS_DEVICE" && w.addDeviceStatus !== "approved") {
          w.addDeviceStatus = "approved";
        }
        wizardFinishSetup();
        return;
      } else if (choiceId === "choice_claim_unclaimed") {
        wizardFinishSetup();
        return;
      }
      renderAll();
    }

        return {

      if (claimId.startsWith("owner_req_")) {

    async function startQrCameraStream() {
      const statusOverlay = document.getElementById("qrCameraStatusOverlay");
      const statusMsg = document.getElementById("qrCameraStatusMsg");
      const videoEl = document.getElementById("qrCameraVideo");
      const canvasEl = document.getElementById("qrScanCanvas");

      if (!videoEl) return;

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        if (statusOverlay && statusMsg) {
          statusOverlay.style.display = "flex";
          statusMsg.innerHTML = "Camera API not supported in this browser. Please use the <strong>Upload Image</strong> button below.";
        }
        return;
      }

      try {
        if (statusOverlay) statusOverlay.style.display = "flex";
        if (statusMsg) statusMsg.textContent = "Requesting camera permissions…";

        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1280 },
            height: { ideal: 720 },
          },
          audio: false,
        });

        __qrCameraStream = stream;
        videoEl.srcObject = stream;
        await videoEl.play();

        if (statusOverlay) statusOverlay.style.display = "none";

        runQrDetectionLoop(videoEl, canvasEl);
      } catch (err) {
        console.warn("[QR Scanner] Camera error:", err);
        if (statusOverlay && statusMsg) {
          statusOverlay.style.display = "flex";
          let friendly = "Camera access denied or unavailable.";
          if (err.name === "NotAllowedError") friendly = "Camera permission was denied. Please allow camera access in browser settings, or upload a QR image.";
          else if (err.name === "NotFoundError") friendly = "No video camera was found on this device. You can upload an image or type the address.";
          statusMsg.innerHTML = `${friendly}<br><span style="font-size:11px; color:#B0AEA5;">(${err.name})</span>`;
        }
      }
    }

    function runQrDetectionLoop(videoEl, canvasEl) {
      const hasBarcodeDetector = "BarcodeDetector" in window;
      let detector = null;
      if (hasBarcodeDetector) {
        try {
          detector = new BarcodeDetector({ formats: ["qr_code"] });
        } catch (_e) {
          detector = null;
        }
      }

      const canvasCtx = canvasEl ? canvasEl.getContext("2d", { willReadFrequently: true }) : null;

      async function scanFrame() {
        if (!__qrCameraStream || !videoEl || videoEl.paused || videoEl.ended) return;

        if (videoEl.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA) {
          // 1. Native BarcodeDetector if available
          if (detector) {
            try {
              const barcodes = await detector.detect(videoEl);
              if (barcodes && barcodes.length > 0) {
                const result = barcodes[0].rawValue;
                if (result) {
                  onQrCodeDetected(result);
                  return;
                }
              }
            } catch (_e) {}
          }

          // 2. jsQR via canvas
          if (typeof jsQR === "function" && canvasEl && canvasCtx) {
            if (canvasEl.width !== videoEl.videoWidth || canvasEl.height !== videoEl.videoHeight) {
              canvasEl.width = videoEl.videoWidth;
              canvasEl.height = videoEl.videoHeight;
            }
            canvasCtx.drawImage(videoEl, 0, 0, canvasEl.width, canvasEl.height);
            try {
              const imgData = canvasCtx.getImageData(0, 0, canvasEl.width, canvasEl.height);
              const code = jsQR(imgData.data, imgData.width, imgData.height, {
                inversionAttempts: "dontInvert",
              });
              if (code && code.data) {
                onQrCodeDetected(code.data);
                return;
              }
            } catch (_e) {}
          }
        }

        __qrScanAnimationId = requestAnimationFrame(scanFrame);
      }

      __qrScanAnimationId = requestAnimationFrame(scanFrame);
    }

    function handleQrFileSelected(fileInput) {
      if (!fileInput.files || fileInput.files.length === 0) return;
      const file = fileInput.files[0];
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = async function() {
          if ("BarcodeDetector" in window) {
            try {
              const detector = new BarcodeDetector({ formats: ["qr_code"] });
              const codes = await detector.detect(img);
              if (codes && codes.length > 0) {
                onQrCodeDetected(codes[0].rawValue);
                return;
              }
            } catch (_e) {}
          }

          if (typeof jsQR === "function") {
            const canvas = document.createElement("canvas");
            canvas.width = img.width;
            canvas.height = img.height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0);
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const code = jsQR(imgData.data, imgData.width, imgData.height);
            if (code && code.data) {
              onQrCodeDetected(code.data);
              return;
            }
          }

          alert("Could not detect a QR code in the uploaded image. Please try another image or enter the contact address.");
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    async function wizardSendAddDeviceRequest() {
      const w = state.wizard;
      const contact = (w.addDeviceContact || "").trim();
      const deviceName = (w.addDeviceName || "").trim();
      if (!deviceName || !contact) return;

      // Deterministic harness URI (`ciris://ed25519:alice.ciris#root@192.168.1.42:4243`) or offline fallback
      if (!state.liveNode.connected || contact.startsWith("ciris://ed25519:alice.ciris")) {
        w.addDeviceStatus = "requested";
        w.addDeviceMatchCode = "482 913";
        w.addDeviceServerNote = null;
        renderAll();
        return;
      }

      w.addDeviceStatus = "retrying";
      w.addDeviceServerNote = "Contacting existing device over Reticulum mesh (POST /v1/setup/add-device)…";
      renderAll();
      startAddDevicePolling();
      try {
        const resp = await fetch("/v1/setup/add-device", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contact,
            device_name: deviceName,
            label: deviceName,
          }),
        });
        const data = await resp.json().catch(() => ({}));
        if (resp.ok) {
          w.addDeviceStatus = data.state || "requested";
          w.addDeviceMatchCode = data.match_code || data.code || data.verification_code || "482 913";
          w.addDeviceServerNote = `Accepted from /v1/setup/add-device: state=${w.addDeviceStatus}`;
        } else if (resp.status === 503 && data.reason_id === "add_device.owner_route_pending") {
          const retrySecs = parseInt(resp.headers.get("Retry-After") || "10", 10) || 10;
          w.addDeviceStatus = "retrying";
          w.addDeviceMatchCode = null;
          w.addDeviceServerNote = `503 ${data.reason_id}: ${data.error} (Auto-retrying in ${retrySecs}s while mesh route converges…)`;
          setTimeout(() => {
            if (state.wizard.addDeviceStatus === "retrying") {
              wizardSendAddDeviceRequest();
            }
          }, retrySecs * 1000);
        } else {
          w.addDeviceStatus = "failed";
          w.addDeviceMatchCode = null;
          w.addDeviceServerNote = `${resp.status} ${data.reason_id || 'refused'}: ${data.error || JSON.stringify(data)}`;
        }
      } catch (err) {
        w.addDeviceStatus = "failed";
        w.addDeviceServerNote = `Network error calling /v1/setup/add-device: ${err}`;
      }
      renderAll();
    }
