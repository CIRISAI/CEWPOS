    function renderCeremonyCard(circleId) {
      const spec = CEREMONIES_BY_CIRCLE[circleId] || CEREMONIES_BY_CIRCLE.JustMe;
      const votes = state.ceremonyVotes[circleId] || { app: 1, obj: 0 };
      let statusLabel = `${votes.app} of ${spec.need} signed`;
      let statusTone = "warn";
      if (votes.obj > 0) {
        statusLabel = "Objected";
        statusTone = "danger";
      } else if (votes.app >= spec.need) {
        statusLabel = "Approved";
        statusTone = "ok";
      }
      const key = "ceremony_" + circleId;
      const ceremonyDv = {
        deferralId: `ceremony_${circleId}`,
        canvasTag: `holon_canvas_ceremony_${circleId}`,
        receiptId: `ceremony_${circleId}`,
        contextTitle: spec.title,
        contextSubtitle: spec.policy,
        dimension: spec.policy.split(" ")[0] || "ceremony:quorum",
        scope: circleId,
        quorumRequired: spec.need,
        quorumApprovals: votes.app,
        quorumObjections: votes.obj,
        choices: [
          {
            choiceId: `cer_${circleId}_approve`,
            label: "Approve (+1)",
            subtitle: `Sign op:scores +1.0 (${votes.app}/${spec.need})`,
            voteScore: 1.0,
            atomicNumber: 7,
            selected: votes.app >= spec.need,
            onClickJs: `state.ceremonyVotes['${circleId}'].app++; renderAll();`,
          },
          {
            choiceId: `cer_${circleId}_object`,
            label: "Object (-1)",
            subtitle: "Brake / block lone-signer silence window",
            voteScore: -1.0,
            atomicNumber: 9,
            selected: votes.obj > 0,
            onClickJs: `state.ceremonyVotes['${circleId}'].obj++; renderAll();`,
          },
          {
            choiceId: `cer_${circleId}_reset`,
            label: "Reset Tally (0)",
            subtitle: "Reset simulation tally to 1 approval",
            voteScore: 0.0,
            atomicNumber: 3,
            selected: false,
            onClickJs: `state.ceremonyVotes['${circleId}']={app:1,obj:0}; renderAll();`,
          },
        ],
      };

      return renderP9TwoPathCeremony({
        tag: `csd_two_path_ceremony_${circleId}`,
        title: spec.title,
        chipLabel: statusLabel,
        chipTone: statusTone,
        ellipsisKey: key,
        quorumRule: spec.policy,
        approvals: votes.app,
        required: spec.need,
        objections: votes.obj,
        deferralVote: ceremonyDv,
        actionsHtml: `
          <div style="display:flex; gap:8px; margin-top:10px;">
            <button class="btn btn-brand" data-csd-tag="btn_ceremony_approve_${circleId}" onclick="state.ceremonyVotes['${circleId}'].app++; renderAll();">Approve</button>
            <button class="btn" data-csd-tag="btn_ceremony_object_${circleId}" onclick="state.ceremonyVotes['${circleId}'].obj++; renderAll();">Object</button>
            <button class="btn-ghost" onclick="state.ceremonyVotes['${circleId}']={app:1,obj:0}; renderAll();">Reset</button>
          </div>
        `,
      });
    }

    // ── Full-Screen Bevy / `CIRISHolon` (`holon-render-3d`) Spatial Scene (`100vw × 100vh`) ──
    function drawFullScreenBevyScene() {
      const canvas = document.getElementById("bevySceneCanvas");
      if (!canvas) return;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const vw = window.innerWidth || 1280;
      const vh = window.innerHeight || 800;
      if (canvas.width !== Math.round(vw * dpr) || canvas.height !== Math.round(vh * dpr)) {
        canvas.width = Math.round(vw * dpr);
        canvas.height = Math.round(vh * dpr);
      }

      const ctx = canvas.getContext("2d");
      ctx.save();
      ctx.scale(dpr, dpr);
      ctx.clearRect(0, 0, vw, vh);

      // 1. Warm Stone-and-Paper 3D Architectural Environment Lighting
      const bg = ctx.createRadialGradient(vw * 0.5, vh * 0.32, 40, vw * 0.5, vh * 0.5, Math.max(vw, vh) * 0.78);
      bg.addColorStop(0, "#FAF9F6");
      bg.addColorStop(0.65, "#F3F1EC");
      bg.addColorStop(1, "#E7E4DC");
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, vw, vh);

      // 2. 3D Perspective World-Box Architectural Floor & Horizon Grid (`holon-render-3d::spawn_world_box`)
      const horizonY = vh * 0.16 + state.holon3d.pitch * 36;
      const vanishX = vw * 0.5 + state.holon3d.yaw * 64;
      ctx.strokeStyle = "rgba(43, 84, 126, 0.065)";
      ctx.lineWidth = 1;

      const numRays = 16;
      for (let i = -numRays; i <= numRays; i++) {
        ctx.beginPath();
        ctx.moveTo(vanishX + i * 28, horizonY);
        ctx.lineTo(vanishX + i * 220, vh);
        ctx.stroke();
      }
      for (let row = 1; row <= 10; row++) {
        const t = Math.pow(row / 10, 1.55);
        const y = horizonY + (vh - horizonY) * t;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(vw, y);
        ctx.stroke();
      }

      // 3. Live 3D Selection Splines connecting every Question Slab (`[data-bevy-question="1"]`)
      //    to its Selection Slabs (`[data-bevy-choice="1"]`) in the full-screen Bevy scene
      const questions = document.querySelectorAll('[data-bevy-question="1"]');
      questions.forEach(qEl => {
        const qRect = qEl.getBoundingClientRect();
        if (qRect.bottom < 0 || qRect.top > vh) return;
        const qx = qRect.left + 26;
        const qy = qRect.bottom - 8;

        const cardEl = qEl.closest(".card, .item-row") || qEl.parentElement;
        if (!cardEl) return;
        const choices = cardEl.querySelectorAll('[data-bevy-choice="1"]');
        choices.forEach(cEl => {
          const cRect = cEl.getBoundingClientRect();
          const cx = cRect.left + 18;
          const cy = cRect.top + cRect.height * 0.5;
          const isSelected = cEl.getAttribute("data-bevy-selected") === "1" || cEl.classList.contains("selected");

          ctx.save();
          if (isSelected) {
            const grad = ctx.createLinearGradient(qx, qy, cx, cy);
            grad.addColorStop(0, "rgba(43, 84, 126, 0.55)");
            grad.addColorStop(1, "rgba(46, 111, 64, 0.65)");
            ctx.strokeStyle = grad;
            ctx.lineWidth = 2.6;
          } else {
            ctx.strokeStyle = "rgba(90, 98, 106, 0.18)";
            ctx.setLineDash([4, 4]);
            ctx.lineWidth = 1.2;
          }
          ctx.beginPath();
          ctx.moveTo(qx, qy);
          ctx.bezierCurveTo(qx - 18, (qy + cy) * 0.5, cx - 22, cy, cx, cy);
          ctx.stroke();
          ctx.restore();
        });
      });

      // 4. Subtle Bevy 3D Scene HUD watermark in bottom-right corner
      ctx.fillStyle = "rgba(90, 98, 106, 0.55)";
      ctx.font = "500 10px 'IBM Plex Mono', monospace";
      ctx.textAlign = "right";
      ctx.fillText(
        `CIRISHolon 3D Scene (100vw×100vh) · P1–P12 Spatial Slabs · CIRISServer v${state.liveNode.version}`,
        vw - 16,
        vh - 10
      );
      ctx.restore();
    }

    function wireHolonCanvasEvents() {
      drawFullScreenBevyScene();
      if (window.__BEVY_VIEWPORT_WIRED) return;
      window.__BEVY_VIEWPORT_WIRED = true;

      window.addEventListener("resize", () => {
        requestAnimationFrame(drawFullScreenBevyScene);
      });

      const surfaceEl = document.getElementById("surfaceRoot");
      if (surfaceEl) {
        surfaceEl.addEventListener("scroll", () => {
          requestAnimationFrame(drawFullScreenBevyScene);
        }, { passive: true });
      }

      window.addEventListener("pointermove", e => {
        const vw = window.innerWidth || 1280;
        const vh = window.innerHeight || 800;
        const nx = (e.clientX / vw) - 0.5;
        const ny = (e.clientY / vh) - 0.5;
        state.holon3d.yaw = nx * 0.22;
        state.holon3d.pitch = ny * 0.18;
        if (surfaceEl) {
          surfaceEl.style.setProperty("--cam-ry", `${(nx * 1.35).toFixed(2)}deg`);
          surfaceEl.style.setProperty("--cam-rx", `${(-ny * 1.15).toFixed(2)}deg`);
        }
        requestAnimationFrame(drawFullScreenBevyScene);
      }, { passive: true });
    }

    async function initHolonEngineAssets() {
      try {
        const [palResp, probeResp] = await Promise.all([
          fetch("/holon/species_palette.json").catch(() => null),
          fetch("/holon/law_probe.json").catch(() => null),
        ]);
        if (palResp && palResp.ok) {
          state.holon3d.wasmLoaded = true;
        }
        if (probeResp && probeResp.ok) {
          const probe = await probeResp.json().catch(() => null);
          if (probe && probe.equilibrium_r_bohr) {
            state.holon3d.ePair = -1.1482;
          }
        }
        renderAll();
      } catch (_e) {}
    }

    // ── Main Render ──
    function renderAll() {
      const circle = getCircle(state.circleId);
      const pendingRosterCount = answerableProposalCount();

      // Update Top Bar Badge (`CSD-095`)
      const badgeEl = document.getElementById("top_devices_badge");
      if (badgeEl) {
        if (pendingRosterCount > 0) {
          badgeEl.style.display = "inline-flex";
          badgeEl.textContent = pendingRosterCount;
        } else {
          badgeEl.style.display = "none";
        }
      }

      // Header Title
      const headerTitle = document.getElementById("headerTitle");
      if (state.setupMode) {
        headerTitle.innerHTML = `<span style="color:var(--brand);">First-Run Setup (3D Holon P9)</span>`;
      } else if (state.instrumentId) {
        const inst = INSTRUMENTS.find(i => i.id === state.instrumentId);
        headerTitle.innerHTML = `<span style="color:var(--ink-mute); font-weight:400;">My things /</span> <span>${inst.label}</span>`;
      } else {
        headerTitle.innerHTML = `<span class="circle-dot" style="background:${circle.color}"></span><span>${circle.label}</span>`;
      }

      const stopBtn = document.getElementById("btn_stop_everything");
      stopBtn.textContent = state.halted ? "Halted (423)" : "Stop";
      stopBtn.className = state.halted ? "btn btn-stop halted" : "btn btn-stop";

      // Tabs Bar
      const tabsBar = document.getElementById("tabsBar");
      if (state.setupMode || state.instrumentId) {
        tabsBar.style.display = "none";
      } else {
        tabsBar.style.display = "flex";
        tabsBar.innerHTML = TABS.map(t => `
          <button class="tab-pill ${state.tab === t ? 'active' : ''}"
                  data-csd-tag="tab_${t.toLowerCase()}"
                  onclick="selectTab('${t}')">${t}</button>
        `).join("");
      }

      // Bottom Circle Switcher
      document.getElementById("circleNav").innerHTML = CIRCLES.map(c => `
        <button class="circle-btn ${!state.setupMode && !state.instrumentId && state.circleId === c.id ? 'active' : ''}"
                data-csd-tag="nav_circle_${c.id}"
                onclick="selectCircle('${c.id}')">
          <span class="circle-dot" style="background:${c.color}"></span>
          <span>${c.label}</span>
        </button>
      `).join("");

      let html = "";

      // Global Halt Banner (`P7`)
      if (state.halted) {
        html += `
          <div class="state-banner danger" data-csd-tag="state_halt_423">
            <span><strong>Agent paused (423 Locked)</strong> &middot; Data doors remain open</span>
            <button class="btn-ghost" onclick="toggleExpand('halt_detail')">&ctdot;</button>
          </div>
          ${state.expandedIds['halt_detail'] ? `
            <div class="lens-drawer" data-csd-tag="state_halt_423_data_doors_open">
              Autonomous actions are refused (<code>HALT_LATCHED_423</code>). Reading, exporting, and 1-step take-back continue normally (<code>Inv_X1_LatchDoesNotBlockServing</code>).
            </div>
          ` : ''}
        `;
      }

      // If First-Run Setup Mode is active, render the First-Run Wizard (`CSD-080`..`CSD-085`, `CSD-093`)
      if (state.setupMode) {
        html += renderFirstRunWizard();
        document.getElementById("surfaceRoot").innerHTML = html;
        wireHolonCanvasEvents();
        return;
      }

      // If an instrument under `My things` is active, render it
      if (state.instrumentId) {
        const inst = INSTRUMENTS.find(i => i.id === state.instrumentId);
        html += renderInstrumentSurface(inst);
        document.getElementById("surfaceRoot").innerHTML = html;
        wireHolonCanvasEvents();
        return;
      }

      // Otherwise render the active `(Circle × Tab)`
      const rows = CLAIMS.filter(c => c.scope === state.circleId && c.tab === state.tab);

      if (state.tab === "Files" || state.tab === "Chats") {
        html += `
          <div class="quiet-lens" data-csd-tag="csd_policy_lens_bar">
            <span>Lens: <strong>my rules</strong> &middot; ${rows.length} ${state.tab.toLowerCase()}</span>
            <button class="btn-ghost" onclick="toggleExpand('lens')">&ctdot;</button>
          </div>
          ${state.expandedIds['lens'] ? `
            <div class="lens-drawer">
              <div style="display:flex; justify-content:space-between; align-items:center;">
                <span>Blur items with neighbour content notes (<code>cw_class</code>)</span>
                <button class="btn" onclick="state.blurEnabled=!state.blurEnabled; renderAll();">
                  ${state.blurEnabled ? 'Blur: On' : 'Blur: Off'}
                </button>
              </div>
            </div>
          ` : ''}
        `;
      }

      if (state.tab === "Decisions") {
        html += renderCeremonyCard(state.circleId);
      } else {
        html += `
          <div class="card" data-csd-tag="csd_main_card">
            ${rows.length > 0 ? rows.map(renderItemRow).join("") : `
              <div class="item-row"><span style="color:var(--ink-mute); font-size:13px;">No ${state.tab.toLowerCase()} in ${circle.label} yet.</span></div>
            `}
          </div>
        `;
      }

      // Contextual footer action per tab (quiet, 1-line)
      if (state.tab === "Chats") {
        const commSelectorHtml = `
          <div style="display:flex;gap:6px;align-items:center;padding:4px 2px;font-size:12px;color:var(--ink-mute);">
            <span>Room:</span>
            ${state.communities.map(cm => `
              <button class="btn ${state.activeCommunityId === cm.id ? 'btn-brand' : ''}"
                      style="font-size:11px;padding:3px 9px;"
                      data-csd-tag="btn_room_${cm.id}"
                      onclick="state.activeCommunityId='${cm.id}'; renderAll();">
                ${cm.name}
              </button>
              <button class="btn-ghost" style="padding:2px 5px;font-size:11px;"
                      data-csd-tag="btn_receipt_comm_${cm.id}"
                      onclick="openReceiptSheet('comm_${cm.id}')">&#9776;</button>
            `).join("")}
          </div>
        `;
        html += commSelectorHtml + `
          <div class="compose-row">
            <input id="chatInput" class="compose-input" data-csd-tag="input_chat_message" placeholder="Write a signed message to ${circle.label}&hellip;" onkeydown="if(event.key==='Enter')sendChatMessage()" />
            <button class="btn btn-brand" data-csd-tag="btn_send_chat" onclick="sendChatMessage()">Send</button>
          </div>
        `;
      } else if (state.tab === "People" && state.circleId !== "JustMe") {
        html += `
          <div class="compose-row" style="margin-bottom:6px;" data-csd-tag="bar_create_community">
            <input id="newCommunityInput" class="compose-input" data-csd-tag="input_new_community_name" placeholder="Create new community in ${circle.label} (POST /v1/communities)&hellip;" value="${state.newCommunityName}" oninput="state.newCommunityName=this.value" />
            <button class="btn btn-brand" data-csd-tag="btn_create_community" onclick="createCommunityNow()">Create Community</button>
          </div>
          <div style="display:flex; justify-content:space-between; align-items:center; padding:4px 2px;">
            <span style="font-size:12px; color:var(--ink-mute);">One-step exit (<code>Inv_ExitOneStep</code>)</span>
            <button class="btn" data-csd-tag="btn_leave_circle" onclick="selectCircle('JustMe')">Leave ${circle.label} (1-step)</button>
          </div>
        `;
      } else if (state.tab === "Safety" && (state.circleId === "Neighbours" || state.circleId === "CommunitiesAndBusinesses")) {
        html += `
          <div style="display:flex; justify-content:flex-end; padding:4px 2px;">
            <button class="btn" data-csd-tag="btn_open_protected_report" onclick="openProtectedReportSheet()">File protected report&hellip;</button>
          </div>
        `;
      }

      document.getElementById("surfaceRoot").innerHTML = html;
      wireHolonCanvasEvents();
    }

    renderAll();
    syncLiveNode();
    initHolonEngineAssets();
  </script>
</body>
</html>
