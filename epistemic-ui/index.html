<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Circles — Constitutional Mesh</title>
  <style>
    :root {
      --bone: #FAF9F5;
      --paper: #F2EFE9;
      --obsidian: #141413;
      --ink-mute: #6E6B64;
      --hairline: #E4E0D6;
      --brand: #1F5E7A;
      --ok: #207A3C;
      --warn: #B86B14;
      --danger: #B82323;
      --c-justme: #22C0E8;
      --c-family: #419CA0;
      --c-neighbours: #7A6FD6;
      --c-communities: #C96A38;
      --c-everyone: #B08A3E;
      --mono: "JetBrains Mono", "SFMono-Regular", Consolas, monospace;
      --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bone);
      color: var(--obsidian);
      font-family: var(--sans);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Calm Centered Shell (Single-Column, Zero Dashboard Clutter) ── */
    .shell {
      max-width: 640px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 0 16px 88px;
    }

    /* ── Top Bar: Only 2 Permanent Anchors (`My things` & `Stop`) + Quiet Title ── */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 0 12px;
      border-bottom: 1px solid var(--hairline);
      position: sticky;
      top: 0;
      background: var(--bone);
      z-index: 20;
    }
    .topbar-title {
      font-weight: 600;
      font-size: 15px;
      letter-spacing: -0.01em;
    }
    .topbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ── Buttons & Icon Triggers (`☰` Hamburger & `⋯` Ellipsis) ── */
    .btn {
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--hairline);
      background: #fff;
      color: var(--obsidian);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .btn:hover { background: var(--paper); }
    .btn-ghost {
      background: transparent;
      border-color: transparent;
      color: var(--ink-mute);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 14px;
      line-height: 1;
      cursor: pointer;
    }
    .btn-ghost:hover {
      background: var(--paper);
      color: var(--obsidian);
    }
    .btn-stop {
      color: var(--danger);
      border-color: rgba(184, 35, 35, 0.35);
      background: #fff;
      font-weight: 600;
    }
    .btn-stop.halted {
      background: var(--danger);
      color: #fff;
      border-color: var(--danger);
    }
    .btn-brand {
      background: var(--brand);
      color: #fff;
      border-color: var(--brand);
    }
    .btn-brand:hover { opacity: 0.92; background: var(--brand); }

    /* ── Tabs Strip (Quiet Horizontal Text) ── */
    .tabs {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      padding: 12px 0;
      margin-bottom: 8px;
    }
    .tab-pill {
      border: none;
      background: transparent;
      color: var(--ink-mute);
      font-size: 13px;
      font-weight: 500;
      padding: 5px 11px;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
    }
    .tab-pill:hover { color: var(--obsidian); background: var(--paper); }
    .tab-pill.active {
      background: var(--obsidian);
      color: var(--bone);
      font-weight: 600;
    }

    /* ── Quiet Lens Line (`my rules · ⋯`) ── */
    .quiet-lens {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: var(--ink-mute);
      padding: 4px 2px 12px;
    }
    .lens-drawer {
      background: var(--paper);
      border: 1px solid var(--hairline);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 14px;
      font-size: 12px;
    }

    /* ── P1: CardShell (Quiet Hairline Frame) ── */
    .card {
      background: #fff;
      border: 1px solid var(--hairline);
      border-radius: 12px;
      padding: 4px 16px;
      margin-bottom: 14px;
    }
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
    }
    .card-header-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--obsidian);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ── P3: ItemRow — Strictly 3 Scannable Inline Facts (`Title`, `ScopePill`, `☰`) ── */
    .item-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 0;
      border-top: 1px solid #F2EFE9;
    }
    .item-row:first-child { border-top: none; }
    .item-title {
      font-size: 14px;
      font-weight: 500;
      color: var(--obsidian);
    }
    .item-row.blurred .item-title {
      filter: blur(4px);
      transition: filter 0.18s;
    }
    .item-row.blurred:hover .item-title { filter: none; }
    .item-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    /* ── P5: ScopePill (The SOLE place Circle color + name is rendered) ── */
    .scope-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      color: var(--obsidian);
      background: var(--bone);
      border: 1px solid var(--hairline);
    }
    .circle-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* ── P6: Chip ── */
    .chip {
      display: inline-flex;
      align-items: center;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--paper);
      color: var(--ink-mute);
    }
    .chip.ok { background: rgba(32, 122, 60, 0.1); color: var(--ok); }
    .chip.warn { background: rgba(184, 107, 20, 0.12); color: var(--warn); }
    .chip.danger { background: rgba(184, 35, 35, 0.12); color: var(--danger); }
    .chip.brand { background: rgba(31, 94, 122, 0.1); color: var(--brand); }

    /* ── Expandable Detail Drawer (Hidden Until `⋯` or `☰` Clicked) ── */
    .expand-body {
      border-top: 1px solid #F2EFE9;
      padding: 12px 0 14px;
      font-size: 12px;
      color: var(--ink-mute);
    }
    .kv-row {
      display: flex;
      justify-content: space-between;
      padding: 5px 0;
      border-bottom: 1px dashed #F2EFE9;
    }
    .kv-row:last-child { border-bottom: none; }
    .mono-hint {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--ink-mute);
    }

    /* ── P7: StateBlock ── */
    .state-banner {
      padding: 12px 14px;
      border-radius: 10px;
      margin-bottom: 12px;
      font-size: 13px;
      border: 1px solid var(--hairline);
      background: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .state-banner.danger {
      border-color: rgba(184, 35, 35, 0.4);
      background: rgba(184, 35, 35, 0.05);
      color: var(--danger);
    }

    /* ── Bottom Circle Bar (5 Circles, Fixed & Calm) ── */
    .bottom-circles {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(250, 249, 245, 0.94);
      backdrop-filter: blur(8px);
      border-top: 1px solid var(--hairline);
      display: flex;
      justify-content: center;
      gap: 6px;
      padding: 10px 12px;
      z-index: 25;
    }
    .circle-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--ink-mute);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
    }
    .circle-btn:hover { background: var(--paper); color: var(--obsidian); }
    .circle-btn.active {
      background: #fff;
      color: var(--obsidian);
      font-weight: 600;
      border-color: var(--hairline);
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }

    /* ── Slide-Up / Popover Sheet for `☰` Receipt, `ConfirmSheet`, and `My things` ── */
    .sheet-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(20, 20, 19, 0.28);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 50;
    }
    .sheet {
      width: 100%;
      max-width: 560px;
      background: var(--bone);
      border-top-left-radius: 16px;
      border-top-right-radius: 16px;
      border: 1px solid var(--hairline);
      padding: 18px 20px 24px;
      box-shadow: 0 -8px 30px rgba(0,0,0,0.08);
      max-height: 85vh;
      overflow-y: auto;
    }
    .sheet-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .sheet-title {
      font-size: 15px;
      font-weight: 600;
    }
    canvas#spatialCanvas {
      width: 100%;
      height: 150px;
      background: var(--bone);
      border: 1px solid var(--hairline);
      border-radius: 8px;
      display: block;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <div class="shell">
    <!-- Top Bar: Calm 3-item header. Everything else is tucked under `My things` or `⋯` -->
    <header class="topbar">
      <button id="btn_my_things" data-csd-tag="btn_my_things" class="btn" onclick="openMyThingsSheet()">
        &#9670; My things
      </button>

      <div class="topbar-title" id="headerTitle">Just me</div>

      <div class="topbar-right">
        <button id="btn_stop_everything" data-csd-tag="btn_stop_everything" class="btn btn-stop" onclick="toggleHalt()">
          Stop
        </button>
        <button id="btn_overflow_inspector" data-csd-tag="btn_overflow_inspector" class="btn-ghost" title="Developer / CSD-4 Inspector" onclick="openInspectorSheet()">
          &ctdot;
        </button>
      </div>
    </header>

    <!-- 7 Circle Tabs -->
    <nav class="tabs" id="tabsBar"></nav>

    <!-- Main Single-Column Surface -->
    <main id="surfaceRoot"></main>
  </div>

  <!-- Fixed Bottom Bar: The 5 Circles -->
  <nav class="bottom-circles" id="circleNav"></nav>

  <!-- Modal / Sheet Host (Hidden until a `☰` Receipt, `⋯` Sheet, or `My things` is tapped) -->
  <div id="sheetHost"></div>

  <script>
    const CIRCLES = [
      { id: "JustMe", wire: "self", label: "Just me", color: "#22C0E8", rank: 0 },
      { id: "Family", wire: "family", label: "Family", color: "#419CA0", rank: 1 },
      { id: "Neighbours", wire: "community", label: "Neighbours", color: "#7A6FD6", rank: 2 },
      { id: "CommunitiesAndBusinesses", wire: "affiliations", label: "Communities", color: "#C96A38", rank: 3 },
      { id: "Everyone", wire: "federation", label: "Everyone", color: "#B08A3E", rank: 4 },
    ];

    const TABS = ["Files", "Chats", "People", "Safety", "Rules", "Decisions", "Record"];

    const INSTRUMENTS = [
      { id: "DevicesAndKeys", label: "Devices & keys", sub: "Self-key roster & pairing", requiresAgent: false },
      { id: "EverythingIShared", label: "Everything I shared", sub: "One-step take-back & storage", requiresAgent: false },
      { id: "ThisAgent", label: "This agent", sub: "Steward bond, conscience & retirement", requiresAgent: true },
      { id: "ThisNode", label: "This node", sub: "Trust root standing & transport", requiresAgent: false },
      { id: "SomeoneITrust", label: "Someone I trust", sub: "Wise Authority & rulings", requiresAgent: true },
      { id: "Help", label: "Help & principles", sub: "Published principles & limits", requiresAgent: false },
    ];

    const CLAIMS = [
      {
        id: "row_0",
        op: "scores",
        dimension: "evaluation:quality",
        title: "Quality review (+0.85)",
        score: 0.85,
        confidence: 0.92,
        subject: "ed25519:alice",
        attester: "ed25519:viewer_self",
        scope: "JustMe",
        cw_opinion: null,
      },
      {
        id: "row_1",
        op: "scores",
        dimension: "holds_bytes:beach.jpg",
        title: "beach.jpg",
        score: 0.40,
        confidence: 0.95,
        subject: "ed25519:viewer_self",
        attester: "ed25519:viewer_self",
        scope: "Neighbours",
        cw_opinion: { by: "neighbour_dan", rule: "cw_class:sunburn_note" },
      },
      {
        id: "row_2",
        op: "delegates_to",
        dimension: "licensure:steward_bond:v1",
        title: "Steward — Agent bond",
        score: 1.0,
        confidence: 1.0,
        subject: "ed25519:agent_self",
        attester: "ed25519:viewer_self",
        scope: "Family",
        cw_opinion: null,
      },
    ];

    let state = {
      circleId: "JustMe",
      tab: "Files",
      instrumentId: null,
      hasAgent: true,
      halted: false,
      blurEnabled: true,
      lensExpanded: false,
      ceremonyExpanded: false,
      lineageExpanded: false,
      haltDetailExpanded: false,
      rosterSize: 3,
      rosterApprovals: 1,
      rosterObjections: 0,
      retirementStage: 1,
    };

    function getCircle(id) {
      return CIRCLES.find(c => c.id === id) || CIRCLES[0];
    }

    function selectCircle(id) {
      state.circleId = id;
      state.instrumentId = null;
      renderAll();
    }

    function selectTab(tab) {
      state.tab = tab;
      state.instrumentId = null;
      renderAll();
    }

    function selectInstrument(id) {
      state.instrumentId = id;
      closeSheet();
      renderAll();
    }

    function toggleHalt() {
      state.halted = !state.halted;
      renderAll();
    }

    function closeSheet() {
      document.getElementById("sheetHost").innerHTML = "";
    }

    // ── `◆ My things` Sheet (Hidden until tapped) ──
    function openMyThingsSheet() {
      const host = document.getElementById("sheetHost");
      host.innerHTML = `
        <div class="sheet-backdrop" onclick="if(event.target===this)closeSheet()">
          <div class="sheet" data-csd-tag="sheet_my_things">
            <div class="sheet-header">
              <span class="sheet-title">My things</span>
              <button class="btn-ghost" onclick="closeSheet()">&#10005;</button>
            </div>
            <div class="card" style="padding:0 14px;">
              ${INSTRUMENTS.map(inst => `
                <div class="item-row" style="cursor:pointer;" data-csd-tag="inst_${inst.id}" onclick="selectInstrument('${inst.id}')">
                  <div>
                    <div class="item-title">${inst.label}</div>
                    <div style="font-size:12px; color:var(--ink-mute);">${inst.sub}</div>
                  </div>
                  <span class="btn-ghost">&rsaquo;</span>
                </div>
              `).join("")}
            </div>
            <div style="display:flex; justify-content:space-between; align-items:center; font-size:12px; color:var(--ink-mute); padding:4px 2px;">
              <span>Attached node has AI agent (<code>has_agent</code>)</span>
              <input type="checkbox" ${state.hasAgent ? 'checked' : ''} onchange="state.hasAgent=this.checked; closeSheet(); renderAll();" />
            </div>
          </div>
        </div>
      `;
    }

    // ── `☰` Receipt Sheet (CSD-006: All 5 envelope facts + actions live here, NOT cluttering the row) ──
    function openReceiptSheet(claimId) {
      const c = CLAIMS.find(x => x.id === claimId);
      const sc = getCircle(c.scope);
      const host = document.getElementById("sheetHost");
      host.innerHTML = `
        <div class="sheet-backdrop" onclick="if(event.target===this)closeSheet()">
          <div class="sheet" data-csd-tag="csd_receipt_${c.id}">
            <div class="sheet-header">
              <span class="sheet-title">${c.title}</span>
              <button class="btn-ghost" onclick="closeSheet()">&#10005;</button>
            </div>

            <div class="card" style="padding:8px 14px;">
              <div class="kv-row">
                <span>Who it is about</span>
                <span class="mono-hint">${c.subject} &middot; <span class="chip ok">Wire</span></span>
              </div>
              <div class="kv-row">
                <span>Who sent it</span>
                <span class="mono-hint">${c.attester} &middot; <span class="chip ok">Wire</span></span>
              </div>
              <div class="kv-row">
                <span>Who can see it</span>
                <span>
                  <span class="scope-pill"><span class="circle-dot" style="background:${sc.color}"></span>${sc.label}</span>
                  <span class="chip ok">Wire</span>
                </span>
              </div>
              <div class="kv-row">
                <span>What it is</span>
                <span class="mono-hint">${c.dimension} &middot; <span class="chip ok">Wire</span></span>
              </div>
              <div class="kv-row">
                <span>Rule</span>
                <span class="mono-hint">op:${c.op} &middot; <span class="chip brand">ByRule CC 2.1</span></span>
              </div>
            </div>

            <!-- Secondary 3D Spatial View-Form tucked inside a quiet `<details>` disclosure -->
            <details style="margin:10px 0; font-size:12px; color:var(--ink-mute);">
              <summary style="cursor:pointer; user-select:none;">&ctdot; Spatial 3D view-form (<code>view_form(&amp;Form)</code>)</summary>
              <canvas id="spatialCanvas" width="480" height="150" data-csd-tag="csd_spatial_canvas"></canvas>
            </details>

            <div style="display:flex; gap:8px; margin-top:14px;">
              <button class="btn" data-csd-tag="btn_act_withdraw_${c.id}" onclick="oneStepWithdraw('${c.id}')">
                Take back (1-step)
              </button>
              <button class="btn btn-brand" data-csd-tag="btn_act_widen_${c.id}" onclick="openWidenConfirm('${c.id}')">
                Share outward&hellip;
              </button>
            </div>
          </div>
        </div>
      `;
      const detailsEl = host.querySelector("details");
      detailsEl.addEventListener("toggle", () => {
        if (detailsEl.open) draw3DViewForm(c);
      });
    }

    function oneStepWithdraw(claimId) {
      const c = CLAIMS.find(x => x.id === claimId);
      c.scope = "JustMe";
      closeSheet();
      renderAll();
    }

    // ── `ConfirmSheet` (P8: 3 Facts for Outward Share) ──
    function openWidenConfirm(claimId) {
      const c = CLAIMS.find(x => x.id === claimId);
      const host = document.getElementById("sheetHost");
      host.innerHTML = `
        <div class="sheet-backdrop" onclick="if(event.target===this)closeSheet()">
          <div class="sheet" data-csd-tag="csd_confirm_sheet_${c.id}">
            <div class="sheet-header">
              <span class="sheet-title">Share ${c.title}?</span>
              <button class="btn-ghost" onclick="closeSheet()">&#10005;</button>
            </div>
            <div class="card" style="padding:8px 14px;">
              <div class="kv-row"><span>1. Moving</span><strong>${c.title}</strong></div>
              <div class="kv-row"><span>2. To</span><strong>Everyone (federation)</strong></div>
              <div class="kv-row"><span>3. Can I undo it?</span><span>1-step take-back at any time</span></div>
            </div>
            <div style="font-size:12px; color:var(--danger); margin-bottom:14px;">
              Note: Copies replicated to federation peers cannot be forcibly erased from remote devices.
            </div>
            <div style="display:flex; gap:8px;">
              <button class="btn btn-brand" data-csd-tag="btn_confirm_yes" onclick="CLAIMS.find(x=>x.id==='${c.id}').scope='Everyone'; closeSheet(); renderAll();">
                Confirm share
              </button>
              <button class="btn" data-csd-tag="btn_confirm_cancel" onclick="closeSheet()">Cancel</button>
            </div>
          </div>
        </div>
      `;
    }

    // ── `⋯` Developer / CSD-4 Tree Inspector Sheet (Completely hidden from main screen) ──
    function openInspectorSheet() {
      const tagged = Array.from(document.querySelectorAll("[data-csd-tag]"));
      const host = document.getElementById("sheetHost");
      host.innerHTML = `
        <div class="sheet-backdrop" onclick="if(event.target===this)closeSheet()">
          <div class="sheet" data-csd-tag="sheet_csd4_inspector">
            <div class="sheet-header">
              <span class="sheet-title">CSD/4 Automation Tag Tree (<code>/tree</code>)</span>
              <button class="btn-ghost" onclick="closeSheet()">&#10005;</button>
            </div>
            <div class="card" style="padding:10px 14px; font-family:var(--mono); font-size:11px; max-height:320px; overflow-y:auto;">
              ${tagged.map(el => `
                <div class="kv-row">
                  <strong>${el.getAttribute("data-csd-tag")}</strong>
                  <span>${(el.textContent || "").trim().replace(/\s+/g, " ").slice(0, 42)}</span>
                </div>
              `).join("")}
            </div>
          </div>
        </div>
      `;
    }

    function draw3DViewForm(claim) {
      const canvas = document.getElementById("spatialCanvas");
      if (!canvas) return;
      const ctx = canvas.getContext("2d");
      const w = canvas.width, h = canvas.height;
      ctx.fillStyle = "#FAF9F5";
      ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = "#E4E0D6";
      ctx.fillRect(40, h - 24, w - 80, 4);

      const t = Math.max(0, Math.min(1, (claim.score + 1) / 2));
      const r = Math.round((0.85 + (0.20 - 0.85) * t) * 255);
      const g = Math.round((0.12 + (0.72 - 0.12) * t) * 255);
      const b = Math.round((0.12 + (0.30 - 0.12) * t) * 255);
      const radius = 16 + claim.confidence * 22;

      ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
      ctx.beginPath();
      ctx.arc(w / 2, h / 2, radius, 0, Math.PI * 2);
      ctx.fill();
    }

    // ── Main Render: Quiet by default; details tucked behind `☰` and `⋯` ──
    function renderAll() {
      const circle = getCircle(state.circleId);

      // Header
      const headerTitle = document.getElementById("headerTitle");
      if (state.instrumentId) {
        const inst = INSTRUMENTS.find(i => i.id === state.instrumentId);
        headerTitle.textContent = inst.label;
      } else {
        headerTitle.textContent = circle.label;
      }

      const stopBtn = document.getElementById("btn_stop_everything");
      stopBtn.textContent = state.halted ? "Halted (423)" : "Stop";
      stopBtn.className = state.halted ? "btn btn-stop halted" : "btn btn-stop";

      // Tabs
      const tabsBar = document.getElementById("tabsBar");
      if (state.instrumentId) {
        tabsBar.style.display = "none";
      } else {
        tabsBar.style.display = "flex";
        tabsBar.innerHTML = TABS.map(t => `
          <button class="tab-pill ${state.tab === t ? 'active' : ''}"
                  data-csd-tag="tab_${t.toLowerCase()}"
                  onclick="selectTab('${t}')">${t}</button>
        `).join("");
      }

      // Bottom Circle Bar
      document.getElementById("circleNav").innerHTML = CIRCLES.map(c => `
        <button class="circle-btn ${!state.instrumentId && state.circleId === c.id ? 'active' : ''}"
                data-csd-tag="nav_circle_${c.id}"
                onclick="selectCircle('${c.id}')">
          <span class="circle-dot" style="background:${c.color}"></span>
          <span>${c.label}</span>
        </button>
      `).join("");

      let html = "";

      // Halt banner: 1 concise line + `⋯` to expand data-door proof
      if (state.halted) {
        html += `
          <div class="state-banner danger" data-csd-tag="state_halt_423">
            <span><strong>Agent paused (423 Locked)</strong> &middot; Data doors remain open</span>
            <button class="btn-ghost" data-csd-tag="btn_halt_ellipsis" onclick="state.haltDetailExpanded=!state.haltDetailExpanded; renderAll();">&ctdot;</button>
          </div>
          ${state.haltDetailExpanded ? `
            <div class="lens-drawer" data-csd-tag="state_halt_423_data_doors_open">
              Autonomous actions are refused (<code>HALT_LATCHED_423</code>). Reading, exporting, and 1-step take-back continue normally (<code>Inv_X1_LatchDoesNotBlockServing</code>).
            </div>
          ` : ''}
        `;
      }

      // Runtime Narrowing (`CC 4.4.3.4.3`) when viewing an agent instrument on a bare node
      if (state.instrumentId) {
        const inst = INSTRUMENTS.find(i => i.id === state.instrumentId);
        if (inst.requiresAgent && !state.hasAgent) {
          html += `
            <div class="state-banner" data-csd-tag="state_no_agent">
              <span>No AI agent is attached to this node.</span>
              <span class="chip">Bare node</span>
            </div>
          `;
          document.getElementById("surfaceRoot").innerHTML = html;
          return;
        }
      }

      // Quiet Policy Lens summary line + `⋯` expansion
      html += `
        <div class="quiet-lens" data-csd-tag="csd_policy_lens_bar">
          <span>Lens: <strong>my rules</strong> &middot; 1 helper</span>
          <button class="btn-ghost" data-csd-tag="btn_lens_ellipsis" title="Expand lens options" onclick="state.lensExpanded=!state.lensExpanded; renderAll();">&ctdot;</button>
        </div>
        ${state.lensExpanded ? `
          <div class="lens-drawer">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <span>Blur items with neighbour content notes (<code>cw_class</code>)</span>
              <button class="btn" data-csd-tag="btn_toggle_blur" onclick="state.blurEnabled=!state.blurEnabled; renderAll();">
                ${state.blurEnabled ? 'Blur: On' : 'Blur: Off'}
              </button>
            </div>
          </div>
        ` : ''}
      `;

      // Primary Claims Card: Each row shows ONLY Title + ScopePill + `☰` Receipt button!
      html += `
        <div class="card" data-csd-tag="csd_main_card">
          ${CLAIMS.map(c => {
            const sc = getCircle(c.scope);
            const isBlurred = state.blurEnabled && c.cw_opinion !== null;
            return `
              <div class="item-row ${isBlurred ? 'blurred' : ''}" data-csd-tag="csd_item_${c.id}">
                <div class="item-title">
                  ${c.title}
                  ${isBlurred ? '<span class="chip warn" style="margin-left:6px;">blurred by rule</span>' : ''}
                </div>
                <div class="item-right">
                  <span class="scope-pill" data-csd-tag="csd_scope_${c.id}">
                    <span class="circle-dot" style="background:${sc.color}"></span>
                    ${sc.label}
                  </span>
                  <button class="btn-ghost" data-csd-tag="btn_receipt_${c.id}" title="Receipt &amp; actions" onclick="openReceiptSheet('${c.id}')">
                    &#9776;
                  </button>
                </div>
              </div>
            `;
          }).join("")}
        </div>
      `;

      // Ceremony Card (`P9`): Collapsed to 1 quiet summary row by default; expands on `⋯`
      const enactNeeded = Math.floor(state.rosterSize / 2) + 1;
      const others = Math.max(0, state.rosterSize - 1);
      const cancelNeeded = others === 0 ? 1 : Math.floor(others / 2) + 1;
      let verdictLabel = `${state.rosterApprovals} of ${enactNeeded} signed`;
      let verdictClass = "warn";
      if (state.rosterObjections >= cancelNeeded) {
        verdictLabel = "Cancelled";
        verdictClass = "danger";
      } else if (state.rosterApprovals >= enactNeeded) {
        verdictLabel = "Approved";
        verdictClass = "ok";
      }

      html += `
        <div class="card" data-csd-tag="csd_two_path_ceremony">
          <div class="card-header">
            <div class="card-header-title">
              <span>Add device key to self-roster</span>
              <span class="chip ${verdictClass}">${verdictLabel}</span>
            </div>
            <button class="btn-ghost" data-csd-tag="btn_ceremony_ellipsis" title="Show ceremony details" onclick="state.ceremonyExpanded=!state.ceremonyExpanded; renderAll();">&ctdot;</button>
          </div>
          ${state.ceremonyExpanded ? `
            <div class="expand-body">
              <div class="kv-row"><span>Policy</span><span class="mono-hint">self_roster_add (24h window, 1 lone floor)</span></div>
              <div class="kv-row"><span>Quorum</span><span>${state.rosterApprovals} / ${enactNeeded} approvals &middot; ${state.rosterObjections} / ${cancelNeeded} objections</span></div>
              <div style="display:flex; gap:8px; margin-top:10px;">
                <button class="btn btn-brand" data-csd-tag="btn_ceremony_assent" onclick="state.rosterApprovals++; renderAll();">Approve</button>
                <button class="btn" data-csd-tag="btn_ceremony_object" onclick="state.rosterObjections++; renderAll();">Object</button>
                <button class="btn" onclick="state.rosterApprovals=1; state.rosterObjections=0; renderAll();">Reset</button>
              </div>
            </div>
          ` : ''}
        </div>
      `;

      // Lineage / Retirement Card (`P11`): Collapsed to 1 quiet summary row by default; expands on `⋯`
      const steps = ["Decided", "Frozen", "SecretsDestroyed", "HandedOver", "Notified", "CustodianMinted", "Retired"];
      const currentStepName = steps[state.retirementStage - 1];
      html += `
        <div class="card" data-csd-tag="csd_lineage_and_conscience">
          <div class="card-header">
            <div class="card-header-title">
              <span>Steward bond &amp; lifecycle</span>
              <span class="chip brand">Step ${state.retirementStage}/7 &middot; ${currentStepName}</span>
            </div>
            <button class="btn-ghost" data-csd-tag="btn_lineage_ellipsis" title="Show 7-step lifecycle" onclick="state.lineageExpanded=!state.lineageExpanded; renderAll();">&ctdot;</button>
          </div>
          ${state.lineageExpanded ? `
            <div class="expand-body">
              ${steps.map((s, idx) => `
                <div class="kv-row" data-csd-tag="csd_retire_step_${idx + 1}">
                  <span style="${idx + 1 === state.retirementStage ? 'font-weight:600; color:var(--obsidian);' : ''}">
                    ${idx + 1}. ${s}
                  </span>
                  <span>${idx === 0 ? 'Cancelable (1-step)' : 'Forward-only'}</span>
                </div>
              `).join("")}
              <div style="display:flex; gap:8px; margin-top:10px;">
                <button class="btn" data-csd-tag="btn_advance_retirement" onclick="state.retirementStage = Math.min(7, state.retirementStage + 1); renderAll();">Next step</button>
                ${state.retirementStage === 1 ? `<button class="btn" data-csd-tag="btn_cancel_retirement" onclick="state.lineageExpanded=false; renderAll();">Cancel retirement (1-step)</button>` : ''}
                <button class="btn-ghost" onclick="state.retirementStage = 1; renderAll();">Reset</button>
              </div>
            </div>
          ` : ''}
        </div>
      `;

      document.getElementById("surfaceRoot").innerHTML = html;
    }

    renderAll();
  </script>
</body>
</html>
