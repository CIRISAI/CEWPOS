<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Circles — Constitutional Mesh</title>
  <style>
    :root {
      --bone: #FAF9F5;
      --paper: #F2EFE9;
      --obsidian: #141413;
      --ink-mute: #6E6B64;
      --hairline: #E4E0D6;
      --brand: #1F5E7A;
      --ok: #207A3C;
      --warn: #B86B14;
      --danger: #B82323;
      --c-justme: #22C0E8;
      --c-family: #419CA0;
      --c-neighbours: #7A6FD6;
      --c-communities: #C96A38;
      --c-everyone: #B08A3E;
      --mono: "JetBrains Mono", "SFMono-Regular", Consolas, monospace;
      --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bone);
      color: var(--obsidian);
      font-family: var(--sans);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Calm Centered Single-Column Shell ── */
    .shell {
      max-width: 640px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 0 16px 92px;
    }

    /* ── Top Bar: `My things`, Context Title, `Stop`, `⋯` ── */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 0 12px;
      border-bottom: 1px solid var(--hairline);
      position: sticky;
      top: 0;
      background: var(--bone);
      z-index: 20;
    }
    .topbar-center {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 15px;
      letter-spacing: -0.01em;
    }
    .topbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ── Buttons & Quiet Triggers (`☰` Hamburger & `⋯` Ellipsis) ── */
    .btn {
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--hairline);
      background: #fff;
      color: var(--obsidian);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .btn:hover { background: var(--paper); }
    .btn-ghost {
      background: transparent;
      border: 1px solid transparent;
      color: var(--ink-mute);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 14px;
      line-height: 1;
      cursor: pointer;
    }
    .btn-ghost:hover {
      background: var(--paper);
      color: var(--obsidian);
    }
    .btn-stop {
      color: var(--danger);
      border-color: rgba(184, 35, 35, 0.35);
      background: #fff;
      font-weight: 600;
    }
    .btn-stop.halted {
      background: var(--danger);
      color: #fff;
      border-color: var(--danger);
    }
    .btn-brand {
      background: var(--brand);
      color: #fff;
      border-color: var(--brand);
    }
    .btn-brand:hover { opacity: 0.92; background: var(--brand); }

    /* ── 7 Circle Tabs ── */
    .tabs {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      padding: 12px 0;
      margin-bottom: 6px;
    }
    .tab-pill {
      border: none;
      background: transparent;
      color: var(--ink-mute);
      font-size: 13px;
      font-weight: 500;
      padding: 5px 11px;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
    }
    .tab-pill:hover { color: var(--obsidian); background: var(--paper); }
    .tab-pill.active {
      background: var(--obsidian);
      color: var(--bone);
      font-weight: 600;
    }

    /* ── Quiet Context / Lens Line (`⋯` to expand) ── */
    .quiet-lens {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: var(--ink-mute);
      padding: 2px 2px 10px;
    }
    .lens-drawer {
      background: var(--paper);
      border: 1px solid var(--hairline);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 12px;
      font-size: 12px;
    }

    /* ── P1: CardShell ── */
    .card {
      background: #fff;
      border: 1px solid var(--hairline);
      border-radius: 12px;
      padding: 4px 16px;
      margin-bottom: 12px;
    }
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
    }
    .card-header-title {
      font-size: 14px;
      font-weight: 500;
      color: var(--obsidian);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ── P3: ItemRow — Strictly 3 Scannable Inline Elements (`Title`, `ScopePill`/`Chip`, `☰`/`⋯`) ── */
    .item-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 0;
      border-top: 1px solid #F2EFE9;
    }
    .item-row:first-child { border-top: none; }
    .item-title {
      font-size: 14px;
      font-weight: 500;
      color: var(--obsidian);
    }
    .item-row.blurred .item-title {
      filter: blur(4px);
      transition: filter 0.18s;
    }
    .item-row.blurred:hover .item-title { filter: none; }
    .item-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    /* ── P5: ScopePill ── */
    .scope-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      color: var(--obsidian);
      background: var(--bone);
      border: 1px solid var(--hairline);
    }
    .circle-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* ── P6: Chip ── */
    .chip {
      display: inline-flex;
      align-items: center;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--paper);
      color: var(--ink-mute);
    }
    .chip.ok { background: rgba(32, 122, 60, 0.1); color: var(--ok); }
    .chip.warn { background: rgba(184, 107, 20, 0.12); color: var(--warn); }
    .chip.danger { background: rgba(184, 35, 35, 0.12); color: var(--danger); }
    .chip.brand { background: rgba(31, 94, 122, 0.1); color: var(--brand); }

    /* ── Expandable Detail Drawer (`⋯`) ── */
    .expand-body {
      border-top: 1px solid #F2EFE9;
      padding: 10px 0 14px;
      font-size: 12px;
      color: var(--ink-mute);
    }
    .kv-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      padding: 6px 0;
      border-bottom: 1px dashed #F2EFE9;
    }
    .kv-row:last-child { border-bottom: none; }
    .mono-hint {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--ink-mute);
    }

    /* ── P7: StateBlock ── */
    .state-banner {
      padding: 12px 14px;
      border-radius: 10px;
      margin-bottom: 12px;
      font-size: 13px;
      border: 1px solid var(--hairline);
      background: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .state-banner.danger {
      border-color: rgba(184, 35, 35, 0.4);
      background: rgba(184, 35, 35, 0.05);
      color: var(--danger);
    }

    /* ── Compose / Chat Input Bar ── */
    .compose-row {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .compose-input {
      flex: 1;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid var(--hairline);
      background: #fff;
      font-family: var(--sans);
      font-size: 13px;
    }

    /* ── Bottom Circle Bar (5 Circles) ── */
    .bottom-circles {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(250, 249, 245, 0.94);
      backdrop-filter: blur(8px);
      border-top: 1px solid var(--hairline);
      display: flex;
      justify-content: center;
      gap: 6px;
      padding: 10px 12px;
      z-index: 25;
    }
    .circle-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--ink-mute);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
    }
    .circle-btn:hover { background: var(--paper); color: var(--obsidian); }
    .circle-btn.active {
      background: #fff;
      color: var(--obsidian);
      font-weight: 600;
      border-color: var(--hairline);
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }

    /* ── Slide-Up Sheet (`☰` Receipt, `ConfirmSheet`, `My things`) ── */
    .sheet-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(20, 20, 19, 0.28);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 50;
    }
    .sheet {
      width: 100%;
      max-width: 560px;
      background: var(--bone);
      border-top-left-radius: 16px;
      border-top-right-radius: 16px;
      border: 1px solid var(--hairline);
      padding: 18px 20px 24px;
      box-shadow: 0 -8px 30px rgba(0,0,0,0.08);
      max-height: 85vh;
      overflow-y: auto;
    }
    .sheet-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .sheet-title {
      font-size: 15px;
      font-weight: 600;
    }
    canvas#spatialCanvas {
      width: 100%;
      height: 140px;
      background: var(--bone);
      border: 1px solid var(--hairline);
      border-radius: 8px;
      display: block;
      margin-top: 8px;
    }
  </style>
</head>

    function draw3DViewForm(claim) {
      const canvas = document.getElementById("spatialCanvas");
      if (!canvas) return;
      const ctx = canvas.getContext("2d");
      const w = canvas.width, h = canvas.height;
      ctx.fillStyle = "#FAF9F5";
      ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = "#E4E0D6";
      ctx.fillRect(40, h - 24, w - 80, 4);

      const t = Math.max(0, Math.min(1, (claim.score + 1) / 2));
      const r = Math.round((0.85 + (0.20 - 0.85) * t) * 255);
      const g = Math.round((0.12 + (0.72 - 0.12) * t) * 255);
      const b = Math.round((0.12 + (0.30 - 0.12) * t) * 255);
      const radius = 16 + claim.confidence * 22;

      ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
      ctx.beginPath();
      ctx.arc(w / 2, h / 2, radius, 0, Math.PI * 2);
      ctx.fill();
    }

    function renderExpandableCard(tag, title, chipLabel, chipTone, bodyHtml) {
      const open = !!state.expandedIds[tag];
      return `

    function renderCeremonyCard(circleId) {
      const spec = CEREMONIES_BY_CIRCLE[circleId] || CEREMONIES_BY_CIRCLE.JustMe;
      const votes = state.ceremonyVotes[circleId] || { app: 1, obj: 0 };
      let statusLabel = `${votes.app} of ${spec.need} signed`;
      let statusTone = "warn";
      if (votes.obj > 0) {
        statusLabel = "Objected";
        statusTone = "danger";
      } else if (votes.app >= spec.need) {
        statusLabel = "Approved";
        statusTone = "ok";
      }
      const key = "ceremony_" + circleId;
      const open = !!state.expandedIds[key];

      return `
        <div class="card" data-csd-tag="csd_two_path_ceremony_${circleId}">
          <div class="card-header">
            <div class="card-header-title">
              <span>${spec.title}</span>
              <span class="chip ${statusTone}">${statusLabel}</span>
            </div>
            <button class="btn-ghost" data-csd-tag="btn_ceremony_ellipsis" onclick="toggleExpand('${key}')">&ctdot;</button>
          </div>
          ${open ? `
            <div class="expand-body">
              <div class="kv-row"><span>Rule</span><span class="mono-hint">${spec.policy}</span></div>

                <button class="btn btn-brand" onclick="state.ceremonyVotes['${circleId}'].app++; renderAll();">Approve</button>

            </div>
          ` : ''}
        </div>
      `;
    }

    // ── Main Render ──
    function renderAll() {
      const circle = getCircle(state.circleId);

      // Header Title
      const headerTitle = document.getElementById("headerTitle");
      if (state.instrumentId) {
        const inst = INSTRUMENTS.find(i => i.id === state.instrumentId);
        headerTitle.innerHTML = `<span style="color:var(--ink-mute); font-weight:400;">My things /</span> <span>${inst.label}</span>`;
      } else {
        headerTitle.innerHTML = `<span class="circle-dot" style="background:${circle.color}"></span><span>${circle.label}</span>`;
      }

      const stopBtn = document.getElementById("btn_stop_everything");
      stopBtn.textContent = state.halted ? "Halted (423)" : "Stop";
      stopBtn.className = state.halted ? "btn btn-stop halted" : "btn btn-stop";

      // Tabs Bar
      const tabsBar = document.getElementById("tabsBar");
      if (state.instrumentId) {
        tabsBar.style.display = "none";
      } else {
        tabsBar.style.display = "flex";
        tabsBar.innerHTML = TABS.map(t => `
          <button class="tab-pill ${state.tab === t ? 'active' : ''}"
                  data-csd-tag="tab_${t.toLowerCase()}"
                  onclick="selectTab('${t}')">${t}</button>
        `).join("");
      }

      // Bottom Circle Switcher
      document.getElementById("circleNav").innerHTML = CIRCLES.map(c => `
        <button class="circle-btn ${!state.instrumentId && state.circleId === c.id ? 'active' : ''}"
                data-csd-tag="nav_circle_${c.id}"
                onclick="selectCircle('${c.id}')">
          <span class="circle-dot" style="background:${c.color}"></span>
          <span>${c.label}</span>
        </button>
      `).join("");

      let html = "";

      // Global Halt Banner (`P7`)
      if (state.halted) {
        html += `
          <div class="state-banner danger" data-csd-tag="state_halt_423">
            <span><strong>Agent paused (423 Locked)</strong> &middot; Data doors remain open</span>
            <button class="btn-ghost" onclick="toggleExpand('halt_detail')">&ctdot;</button>
          </div>
          ${state.expandedIds['halt_detail'] ? `
            <div class="lens-drawer" data-csd-tag="state_halt_423_data_doors_open">
              Autonomous actions are refused (<code>HALT_LATCHED_423</code>). Reading, exporting, and 1-step take-back continue normally (<code>Inv_X1_LatchDoesNotBlockServing</code>).
            </div>
          ` : ''}
        `;
      }

      // If an instrument under `My things` is active, render it
      if (state.instrumentId) {
        const inst = INSTRUMENTS.find(i => i.id === state.instrumentId);
        html += renderInstrumentSurface(inst);
        document.getElementById("surfaceRoot").innerHTML = html;
        return;
      }

      // Otherwise render the active `(Circle × Tab)`
      const rows = CLAIMS.filter(c => c.scope === state.circleId && c.tab === state.tab);

      if (state.tab === "Files" || state.tab === "Chats") {
        html += `
          <div class="quiet-lens" data-csd-tag="csd_policy_lens_bar">
            <span>Lens: <strong>my rules</strong> &middot; ${rows.length} ${state.tab.toLowerCase()}</span>
            <button class="btn-ghost" onclick="toggleExpand('lens')">&ctdot;</button>
          </div>
          ${state.expandedIds['lens'] ? `
            <div class="lens-drawer">
              <div style="display:flex; justify-content:space-between; align-items:center;">
                <span>Blur items with neighbour content notes (<code>cw_class</code>)</span>
                <button class="btn" onclick="state.blurEnabled=!state.blurEnabled; renderAll();">
                  ${state.blurEnabled ? 'Blur: On' : 'Blur: Off'}
                </button>
              </div>
            </div>
          ` : ''}
        `;
      }

      if (state.tab === "Decisions") {
        html += renderCeremonyCard(state.circleId);
      } else {
        html += `
          <div class="card" data-csd-tag="csd_main_card">
            ${rows.length > 0 ? rows.map(renderItemRow).join("") : `
              <div class="item-row"><span style="color:var(--ink-mute); font-size:13px;">No ${state.tab.toLowerCase()} in ${circle.label} yet.</span></div>
            `}
          </div>
        `;
      }

      // Contextual footer action per tab (quiet, 1-line)
      if (state.tab === "Chats") {
        html += `
          <div class="compose-row">
            <input id="chatInput" class="compose-input" placeholder="Write a signed message to ${circle.label}&hellip;" onkeydown="if(event.key==='Enter')sendChatMessage()" />
            <button class="btn btn-brand" onclick="sendChatMessage()">Send</button>
          </div>
        `;
      } else if (state.tab === "People" && state.circleId !== "JustMe") {
        html += `
          <div style="display:flex; justify-content:space-between; align-items:center; padding:4px 2px;">
            <span style="font-size:12px; color:var(--ink-mute);">One-step exit (<code>Inv_ExitOneStep</code>)</span>
            <button class="btn" data-csd-tag="btn_leave_circle" onclick="selectCircle('JustMe')">Leave ${circle.label} (1-step)</button>
          </div>
        `;
      } else if (state.tab === "Safety" && (state.circleId === "Neighbours" || state.circleId === "CommunitiesAndBusinesses")) {
        html += `
          <div style="display:flex; justify-content:flex-end; padding:4px 2px;">
            <button class="btn" data-csd-tag="btn_open_protected_report" onclick="openProtectedReportSheet()">File protected report&hellip;</button>
          </div>
        `;
      }

      document.getElementById("surfaceRoot").innerHTML = html;
    }

    renderAll();
  </script>
</body>
</html>
