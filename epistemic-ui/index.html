<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Circles — Constitutional Mesh</title>
  <style>
    :root {
      --bone: #FAF9F5;
      --paper: #F2EFE9;
      --obsidian: #141413;
      --ink-mute: #6E6B64;
      --hairline: #E4E0D6;
      --brand: #1F5E7A;
      --ok: #207A3C;
      --warn: #B86B14;
      --danger: #B82323;
      --c-justme: #22C0E8;
      --c-family: #419CA0;
      --c-neighbours: #7A6FD6;
      --c-communities: #C96A38;
      --c-everyone: #B08A3E;
      --mono: "JetBrains Mono", "SFMono-Regular", Consolas, monospace;
      --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bone);
      color: var(--obsidian);
      font-family: var(--sans);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Calm Centered Single-Column Shell ── */
    .shell {
      max-width: 640px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 0 16px 92px;
    }

    /* ── Top Bar: `My things`, Context Title, `Stop`, `⋯` ── */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 0 12px;
      border-bottom: 1px solid var(--hairline);
      position: sticky;
      top: 0;
      background: var(--bone);
      z-index: 20;
    }
    .topbar-center {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 15px;
      letter-spacing: -0.01em;
    }
    .topbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ── Buttons & Quiet Triggers (`☰` Hamburger & `⋯` Ellipsis) ── */
    .btn {
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--hairline);
      background: #fff;
      color: var(--obsidian);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn:hover:not(:disabled) { background: var(--paper); }
    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .btn-ghost {
      background: transparent;
      border: 1px solid transparent;
      color: var(--ink-mute);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 14px;
      line-height: 1;
      cursor: pointer;
    }
    .btn-ghost:hover {
      background: var(--paper);
      color: var(--obsidian);
    }
    .btn-stop {
      color: var(--danger);
      border-color: rgba(184, 35, 35, 0.35);
      background: #fff;
      font-weight: 600;
    }
    .btn-stop.halted {
      background: var(--danger);
      color: #fff;
      border-color: var(--danger);
    }
    .btn-brand {
      background: var(--brand);
      color: #fff;
      border-color: var(--brand);
    }
    .btn-brand:hover:not(:disabled) { opacity: 0.92; background: var(--brand); }
    .btn-danger {
      background: rgba(184, 35, 35, 0.08);
      color: var(--danger);
      border-color: rgba(184, 35, 35, 0.35);
    }

    /* ── 7 Circle Tabs & Step Indicators ── */
    .tabs {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      padding: 12px 0;
      margin-bottom: 6px;
    }
    .tab-pill {
      border: none;
      background: transparent;
      color: var(--ink-mute);
      font-size: 13px;
      font-weight: 500;
      padding: 5px 11px;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
    }
    .tab-pill:hover { color: var(--obsidian); background: var(--paper); }
    .tab-pill.active {
      background: var(--obsidian);
      color: var(--bone);
      font-weight: 600;
    }

    /* ── Quiet Context / Lens Line (`⋯` to expand) ── */
    .quiet-lens {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: var(--ink-mute);
      padding: 2px 2px 10px;
    }
    .lens-drawer {
      background: var(--paper);
      border: 1px solid var(--hairline);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 12px;
      font-size: 12px;
    }

    /* ── P1: CardShell ── */
    .card {
      background: #fff;
      border: 1px solid var(--hairline);
      border-radius: 12px;
      padding: 4px 16px;
      margin-bottom: 12px;
    }
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
    }
    .card-header-title {
      font-size: 14px;
      font-weight: 500;
      color: var(--obsidian);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* ── P3: ItemRow — Strictly 3 Scannable Inline Elements (`Title`, `ScopePill`/`Chip`, `☰`/`⋯`) ── */
    .item-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 0;
      border-top: 1px solid #F2EFE9;
    }
    .item-row:first-child { border-top: none; }
    .item-title {
      font-size: 14px;
      font-weight: 500;
      color: var(--obsidian);
    }
    .item-row.blurred .item-title {
      filter: blur(4px);
      transition: filter 0.18s;
    }
    .item-row.blurred:hover .item-title { filter: none; }
    .item-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    /* ── P5: ScopePill ── */
    .scope-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      color: var(--obsidian);
      background: var(--bone);
      border: 1px solid var(--hairline);
    }
    .circle-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* ── P6: Chip ── */
    .chip {
      display: inline-flex;
      align-items: center;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--paper);
      color: var(--ink-mute);
    }
    .chip.ok { background: rgba(32, 122, 60, 0.1); color: var(--ok); }
    .chip.warn { background: rgba(184, 107, 20, 0.12); color: var(--warn); }
    .chip.danger { background: rgba(184, 35, 35, 0.12); color: var(--danger); }
    .chip.brand { background: rgba(31, 94, 122, 0.1); color: var(--brand); }

    /* ── Expandable Detail Drawer (`⋯`) ── */
    .expand-body {
      border-top: 1px solid #F2EFE9;
      padding: 10px 0 14px;
      font-size: 12px;
      color: var(--ink-mute);
    }
    .kv-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      padding: 6px 0;
      border-bottom: 1px dashed #F2EFE9;
    }
    .kv-row:last-child { border-bottom: none; }
    .mono-hint {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--ink-mute);
    }

    /* ── P7: StateBlock ── */
    .state-banner {
      padding: 12px 14px;
      border-radius: 10px;
      margin-bottom: 12px;
      font-size: 13px;
      border: 1px solid var(--hairline);
      background: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .state-banner.danger {
      border-color: rgba(184, 35, 35, 0.4);
      background: rgba(184, 35, 35, 0.05);
      color: var(--danger);
    }
    .state-banner.brand {
      border-color: rgba(31, 94, 122, 0.35);
      background: rgba(31, 94, 122, 0.05);
      color: var(--brand);
    }

    /* ── Form Inputs & Choice Cards (First-Run Wizard) ── */
    .field-input {
      width: 100%;
      padding: 8px 11px;
      border-radius: 8px;
      border: 1px solid var(--hairline);
      background: var(--bone);
      font-family: var(--sans);
      font-size: 13px;
      color: var(--obsidian);
    }
    .choice-btn {
      flex: 1;
      text-align: left;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--hairline);
      background: var(--bone);
      cursor: pointer;
      font-family: var(--sans);
      transition: border-color 0.15s, background 0.15s;
    }
    .choice-btn.selected {
      border-color: var(--brand);
      background: rgba(31, 94, 122, 0.06);
    }
    .choice-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .match-code-box {
      font-family: var(--mono);
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: var(--brand);
      background: var(--bone);
      border: 1px solid var(--hairline);
      border-radius: 10px;
      padding: 10px 16px;
      text-align: center;
      margin: 8px 0;
    }

    /* ── Compose / Chat Input Bar ── */
    .compose-row {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .compose-input {
      flex: 1;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid var(--hairline);
      background: #fff;
      font-family: var(--sans);
      font-size: 13px;
    }

    /* ── Bottom Circle Bar (5 Circles) ── */
    .bottom-circles {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(250, 249, 245, 0.94);
      backdrop-filter: blur(8px);
      border-top: 1px solid var(--hairline);
      display: flex;
      justify-content: center;
      gap: 6px;
      padding: 10px 12px;
      z-index: 25;
    }
    .circle-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--ink-mute);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
    }
    .circle-btn:hover { background: var(--paper); color: var(--obsidian); }
    .circle-btn.active {
      background: #fff;
      color: var(--obsidian);
      font-weight: 600;
      border-color: var(--hairline);
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }

    /* ── Slide-Up Sheet (`☰` Receipt, `ConfirmSheet`, `My things`) ── */
    .sheet-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(20, 20, 19, 0.28);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 50;
    }
    .sheet {
      width: 100%;
      max-width: 560px;
      background: var(--bone);
      border-top-left-radius: 16px;
      border-top-right-radius: 16px;
      border: 1px solid var(--hairline);
      padding: 18px 20px 24px;
      box-shadow: 0 -8px 30px rgba(0,0,0,0.08);
      max-height: 85vh;
      overflow-y: auto;
    }
    .sheet-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .sheet-title {
      font-size: 15px;
      font-weight: 600;
    }
    canvas#spatialCanvas {
      width: 100%;
      height: 140px;
      background: var(--bone);
      border: 1px solid var(--hairline);
      border-radius: 8px;
      display: block;
      margin-top: 8px;
    }
  </style>
</head>

    // `P5: ScopePill` — sole place a Circle's color dot, name, and `local_only_badge` (`CSD-127`) are rendered

    // `P6: Chip` — `Choice | Badge | Filter | Sort`
    function renderP6Chip({ tag, label, tone = "", kind = "Badge", selected = false, disabled = false, onclick = "", style = "" }) {
      const tagAttr = tag ? `data-csd-tag="${tag}"` : "";
      const styleAttr = style ? `style="${style}"` : "";
      if (kind === "Choice") {
        return `
          <button class="btn ${selected ? 'btn-brand' : ''} ${tone}"
                  ${tagAttr} ${styleAttr}
                  ${disabled ? 'disabled' : ''}
                  ${onclick ? `onclick="${onclick}"` : ''}>
            ${label}
          </button>
        `;
      }
      return `<span class="chip ${tone}" ${tagAttr} ${styleAttr}>${label}</span>`;
    }

    // `P7: StateBlock` — 7-way epistemic surface state (`Populated | Loading | Empty | Error | FileGone | HiddenByRules | Unreviewed`)
    function renderP7StateBlock({ tag, tone = "", contentHtml, rightHtml = "" }) {

          ${rightHtml}

      `;
    }

    // `P2: FieldRow` — scalar state variable key-value row with `protocol_wire_name` and `VerificationBasis`
    function renderP2FieldRow({ tag, labelHtml, valueHtml, wireName = "", verification = "" }) {
      const basisBadge = verification
        ? ` <span class="chip ${verification === 'Wire' ? 'ok' : verification.startsWith('ByRule') ? 'brand' : ''}" style="font-size:10px;padding:1px 6px;">${verification}</span>`
        : "";
      const wireHint = wireName ? ` <code style="font-size:11px;color:var(--ink-mute);">(${wireName})</code>` : "";
      return `
        <div class="kv-row" ${tag ? `data-csd-tag="${tag}"` : ''}>
          <span>${labelHtml}${wireHint}</span>
          <span style="display:flex;align-items:center;gap:6px;">${valueHtml}${basisBadge}</span>
        </div>
      `;
    }

    // 1. FIRST-RUN WIZARD (`CSD-080`..`CSD-085`, `CSD-093`, `CSD-115`, `CSD-118`)

    function isValidFedIdLabel(label) {
      const t = (label || "").trim();
      return t.length > 0 && t.toLowerCase() !== "ciris-client-user";
    }

    function canWizardAdvanceFromYou() {
      const w = state.wizard;
      if (!w.identityPath) return false;
      if (w.identityPath === "NEW") {
        return isValidFedIdLabel(w.fedidLabel) &&
               w.deviceName.trim().length > 0 &&
               w.ageBand !== null &&
               w.ageBand !== "MINOR";
      }
      if (w.identityPath === "ADD_THIS_DEVICE") {
        return ["requested", "approved", "applied"].includes(w.addDeviceStatus);
      }
      return false;
    }

    function wizardSelectIdentityPath(path) {
      const w = state.wizard;
      if (["requested", "approved", "retrying"].includes(w.addDeviceStatus)) return;
      w.identityPath = path;
      renderAll();
    }

    function wizardScanQrFill() {
      // `btn_add_device_scan` (`P10: QrCeremony`) fills contact URI and never auto-sends (`CSD-093`)
      state.wizard.addDeviceContact = "ciris://ed25519:alice.ciris#root@192.168.1.42:4243";
      renderAll();
    }

    async function wizardSendAddDeviceRequest() {
      const w = state.wizard;
      const contact = (w.addDeviceContact || "").trim();
      const deviceName = (w.addDeviceName || "").trim();
      if (!deviceName || !contact) return;

      // Deterministic harness URI (`ciris://ed25519:alice.ciris#root@192.168.1.42:4243`) or offline fallback
      if (!state.liveNode.connected || contact.startsWith("ciris://ed25519:alice.ciris")) {
        w.addDeviceStatus = "requested";
        w.addDeviceMatchCode = "482 913";
        w.addDeviceServerNote = null;
        renderAll();
        return;
      }

      w.addDeviceServerNote = "Sending POST /v1/setup/add-device to local node…";
      renderAll();
      try {
        const resp = await fetch("/v1/setup/add-device", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contact,
            device_name: deviceName,
          }),
        });
        const data = await resp.json().catch(() => ({}));
        if (resp.ok) {
          w.addDeviceStatus = data.state || "requested";
          w.addDeviceMatchCode = data.match_code || data.code || data.verification_code || "482 913";
          w.addDeviceServerNote = `200 OK from /v1/setup/add-device: state=${w.addDeviceStatus}`;
        } else {
          w.addDeviceStatus = "failed";
          w.addDeviceMatchCode = null;
          w.addDeviceServerNote = `${resp.status} ${data.reason_id || 'refused'}: ${data.error || JSON.stringify(data)}`;
        }
      } catch (err) {
        w.addDeviceStatus = "failed";
        w.addDeviceServerNote = `Network error calling /v1/setup/add-device: ${err}`;
      }
      renderAll();
    }

        if (w.traceConsent === null) return;
        w.step = w.runWithAi ? "AI" : "COMPLETE";
      } else if (w.step === "AI") {
        w.step = "COMPLETE";
      }
      renderAll();
    }

      if (w.step === "COMPLETE") {
        w.step = w.runWithAi ? "AI" : "JOIN_FEDERATION";

        w.step = "JOIN_FEDERATION";
      } else if (w.step === "JOIN_FEDERATION") {
        w.step = "YOU";

      renderAll();

    async function syncLiveNode() {
      try {
        const hResp = await fetch("/health");
        if (!hResp.ok) return;
        const hData = await hResp.json();
        state.liveNode.connected = true;
        state.liveNode.version = hData.version || "0.5.241";
        state.liveNode.keyId = (hData.node && hData.node.key_id) || "qa-fresh-node";
        state.liveNode.standing = (hData.node && hData.node.standing) || "identified";

        const [stResp, ncResp, cdResp, lnResp] = await Promise.all([
          fetch("/v1/setup/status").catch(() => null),
          fetch("/v1/federation/node-code").catch(() => null),
          fetch("/v1/setup/consent-disclosure").catch(() => null),
          fetch("/cewpos/local-node").catch(() => null),
        ]);
        if (stResp && stResp.ok) {
          const st = await stResp.json();
          if (st.data) {
            state.liveNode.isFirstRun = !!st.data.is_first_run;
            if (st.data.is_first_run && !urlParams.get("instrument") && !urlParams.get("circle")) {
              state.setupMode = true;
            } else if (!st.data.is_first_run && state.wizard.ownershipState === "unclaimed") {
              state.wizard.ownershipState = "claimed";
            }
          }
        }
        if (ncResp && ncResp.ok) {
          const nc = await ncResp.json();
          state.liveNode.nodeCode = nc.code || null;
        }
        if (cdResp && cdResp.ok) {
          const cd = await cdResp.json();
          if (cd.data && cd.data.primary_action) {
            state.liveNode.consentDisclosureTitle = cd.data.primary_action.text;
          }
        }
        if (lnResp && lnResp.ok) {
          const ln = await lnResp.json();
          if (ln.claim_pin) {
            state.wizard.claimPin0600 = ln.claim_pin;
            state.liveNode.claimPinMode = ln.claim_pin_mode || "0o600";
          }
        }
        renderAll();
      } catch (_err) {
        // Offline / deterministic fallback
      }
    }

    async function wizardClaimOwnershipNow() {
      const w = state.wizard;
      w.ownershipState = "claiming";
      renderAll();

      if (state.liveNode.connected && state.liveNode.nodeCode) {
        try {
          const idResp = await fetch("/v1/self/identity", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({}),
          });
          if (idResp.ok) {
            const idData = await idResp.json();
            state.liveNode.ownerKeyId = idData.key_id;
          }
          const clResp = await fetch("/v1/setup/claim-remote", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              node_code: state.liveNode.nodeCode,
              claim_pin: (w.claimPin0600 || "").trim(),
              cohort_scope: "self",
            }),
          });
          if (clResp.ok) {
            const clData = await clResp.json();
            state.liveNode.accessToken = clData.access_token;
            state.liveNode.ownerKeyId = clData.identity_key_id;
            state.liveNode.ownerWaId = clData.wa_id;
            state.liveNode.attestationId = clData.owner_binding_attestation_id;
            state.multiDevice.selfKeyId = clData.identity_key_id || state.multiDevice.selfKeyId;
            w.ownershipState = "claimed";
            renderAll();
            return;
          } else {
            w.ownershipState = "error";
            renderAll();
            return;
          }
        } catch (_e) {
          // Fall back to deterministic check below
        }
      }

      setTimeout(() => {
        if (w.claimPin0600 && w.claimPin0600.trim().length >= 4) {
          w.ownershipState = "claimed";
        } else {
          w.ownershipState = "error";
        }
        renderAll();
      }, 60);
    }

      } else if (w.step === "COMPLETE") {

        // - `ADD_THIS_DEVICE`: `P1: CardShell` + `P7: StateBlock` + `P9: TwoPathCeremonyBlock` + `P3: ItemRow` (`☰` -> `P4`)

    // ══════════════════════════════════════════════════════════════════════════
    // 2. FULL MULTI-DEVICE & SELF-KEY ROSTER (`CSD-037`, `CSD-094`, `CSD-095`)
    // ══════════════════════════════════════════════════════════════════════════

    function switchActiveDevicePerspective(occId) {
      state.multiDevice.activeOccurrenceId = occId;
      state.multiDevice.lastReceiptNote = null;
      renderAll();
    }

    function toggleDeviceReachable(occId) {
      const dev = state.multiDevice.devices.find(d => d.occurrenceId === occId);
      if (dev) dev.reachable = !dev.reachable;
      renderAll();
    }

    // `CSD-037`: Evict device with 3-fact ConfirmSheet + CC 4.5.12.1 honesty note + 2-stage force_self
    function openEvictDeviceSheet(occId) {
      const dev = state.multiDevice.devices.find(d => d.occurrenceId === occId);
      if (!dev) return;
      const isSelf = occId === state.multiDevice.activeOccurrenceId;
      const enrolledCount = activeEnrolledDevices().length;
      const requiresQuorum = enrolledCount >= 2 && !isSelf;

      const host = document.getElementById("sheetHost");
      host.innerHTML = `
        <div class="sheet-backdrop" onclick="if(event.target===this)closeSheet()">
          <div class="sheet" data-csd-tag="confirm_evict_device_${occId}">
            <div class="sheet-header">
              <span class="sheet-title">Evict ${dev.label}?</span>
              <button class="btn-ghost" onclick="closeSheet()">&#10005;</button>
            </div>
            <div class="card" style="padding:8px 14px;">
              <div class="kv-row"><span>1. Device</span><strong>${dev.label} (<code>${dev.keyId}</code>)</strong></div>
              <div class="kv-row"><span>2. Future access</span><span>Cannot act as you or receive new Self-DEK content</span></div>
              <div class="kv-row"><span>3. Path</span><span>${isSelf ? 'Self-release (requires 2-step force_self)' : (requiresQuorum ? 'Creates Self-Key Roster eviction proposal (CSD-095)' : 'Immediate revocation')}</span></div>
            </div>
            <div class="state-banner danger" style="margin:10px 0;" data-csd-tag="txt_dek_honesty_note">
              <span><strong>Constitutional Honesty Note (CC 4.5.12.1 / 3.3.6.1):</strong> It can no longer act as you or receive anything new. Anything already shared with that device stays readable to it &mdash; CIRIS does not re-encrypt past content.</span>
            </div>
            ${isSelf && state.multiDevice.revokeForcePendingId !== occId ? `
              <div class="state-banner brand" data-csd-tag="txt_release_self_requires_force">
                <span>This is the device you are currently using (<code>self.release_self_requires_force</code>). Confirming once unlocks the final <code>force_self: true</code> release button.</span>
              </div>
              <div style="display:flex; gap:8px; margin-top:12px;">
                <button class="btn btn-danger" data-csd-tag="btn_evict_arm_force_self" onclick="state.multiDevice.revokeForcePendingId='${occId}'; openEvictDeviceSheet('${occId}');">
                  Step 1: Arm self-eviction
                </button>
                <button class="btn" onclick="closeSheet()">Cancel</button>
              </div>
            ` : `
              <div style="display:flex; gap:8px; margin-top:12px;">
                <button class="btn btn-danger" data-csd-tag="btn_confirm_evict_${occId}" onclick="executeEvictDevice('${occId}')">
                  ${isSelf ? 'Step 2: Evict this device (force_self: true)' : (requiresQuorum ? 'Propose eviction on Self-Key Roster' : 'Evict device now')}
                </button>
                <button class="btn" onclick="state.multiDevice.revokeForcePendingId=null; closeSheet();">Cancel</button>
              </div>
            `}
          </div>
        </div>
      `;
    }

    function executeEvictDevice(occId) {
      const dev = state.multiDevice.devices.find(d => d.occurrenceId === occId);
      if (!dev) return;
      const me = state.multiDevice.activeOccurrenceId;
      const myDev = state.multiDevice.devices.find(d => d.occurrenceId === me) || state.multiDevice.devices[0];
      const enrolledCount = activeEnrolledDevices().length;

      if (enrolledCount >= 3 && occId !== me) {
        // Multi-device quorum / 24h W_self eviction proposal (`CSD-095`)
        const propId = "prop-evict-" + occId;
        state.multiDevice.proposals.unshift({
          proposalId: propId,
          kind: "evict",
          subjectKeyId: dev.keyId,
          subjectOccurrenceId: dev.occurrenceId,
          subjectLabel: dev.label,
          subjectClass: dev.deviceClass,
          proposedByOccurrenceId: me,
          proposedByLabel: myDev.label,
          approvals: [me],
          objectors: [],
          windowRemSecs: 86400,
          earliestLoneAt: "2026-10-21T18:00:00Z (24h W_self)",
          settled: null,
        });
      } else {
        dev.revoked = true;
        dev.dekRecipient = false;
      }
      state.multiDevice.revokeForcePendingId = null;
      closeSheet();
      renderAll();
    }

    // `CSD-094`: Approve or Deny a pending device join request behind a 3-fact ConfirmSheet
    function openApproveDeviceConfirm(reqId, approve) {
      const req = state.multiDevice.pendingDeviceRequests.find(r => r.requestId === reqId);
      if (!req) return;
      const enrolledCount = activeEnrolledDevices().length;
      const willHold = approve && enrolledCount >= 2;

      const host = document.getElementById("sheetHost");
      host.innerHTML = `
        <div class="sheet-backdrop" onclick="if(event.target===this)closeSheet()">
          <div class="sheet" data-csd-tag="confirm_device_request_${reqId}">
            <div class="sheet-header">
              <span class="sheet-title">${approve ? 'Approve' : 'Deny'} ${req.label}?</span>
              <button class="btn-ghost" onclick="closeSheet()">&#10005;</button>
            </div>
            <div class="card" style="padding:8px 14px;">
              <div class="kv-row"><span>1. Device &amp; class</span><strong>${req.label} (<code>${req.deviceClass}</code>)</strong></div>
              <div class="kv-row"><span>2. 6-digit match code</span><strong class="mono-hint">${req.matchCode}</strong></div>
              <div class="kv-row"><span>3. Outcome</span><span>${!approve ? 'Refuses request immediately' : (willHold ? '202 Held: opens Self-Key Roster proposal (24h W_self or 2nd device signature)' : '200 Approved: enrolls device immediately (single-device roster)')}</span></div>
            </div>
            <div style="display:flex; gap:8px; margin-top:12px;">
              <button class="btn ${approve ? 'btn-brand' : 'btn-danger'}"
                      data-csd-tag="btn_confirm_device_req_yes"
                      onclick="executeDeviceRequestDecision('${reqId}', ${approve})">
                ${approve ? 'Confirm approval' : 'Confirm denial'}
              </button>
              <button class="btn" onclick="closeSheet()">Cancel</button>
            </div>
          </div>
        </div>
      `;
    }

    function executeDeviceRequestDecision(reqId, approve) {
      const req = state.multiDevice.pendingDeviceRequests.find(r => r.requestId === reqId);
      if (!req) return;
      const enrolledCount = activeEnrolledDevices().length;
      const me = state.multiDevice.activeOccurrenceId;
      const myDev = state.multiDevice.devices.find(d => d.occurrenceId === me) || state.multiDevice.devices[0];

      if (!approve) {
        req.status = "denied";
      } else if (enrolledCount <= 1) {
        // `roster_size == 1` -> `200 {approved: true}` immediate landing (`CSD-094`)
        req.status = "approved";
        if (!state.multiDevice.devices.some(d => d.occurrenceId === req.occurrenceId)) {
          state.multiDevice.devices.push({
            occurrenceId: req.occurrenceId,
            keyId: req.keyId,
            label: req.label,
            deviceClass: req.deviceClass,
            reachable: false,
            hardwareCustody: "secure_enclave",
            dekRecipient: true,
            revoked: false,
          });
        }
      } else {
        // `roster_size >= 2` -> `202 {approved: false, held: true, proposal_id}` (`CSD-094` + `CSD-095`)
        req.status = "held";
        const propId = "prop-add-" + req.occurrenceId;
        state.multiDevice.lastHeldBannerProposalId = propId;
        if (!state.multiDevice.proposals.some(p => p.proposalId === propId)) {
          state.multiDevice.proposals.unshift({
            proposalId: propId,
            kind: "add",
            subjectKeyId: req.keyId,
            subjectOccurrenceId: req.occurrenceId,
            subjectLabel: req.label,
            subjectClass: req.deviceClass,
            proposedByOccurrenceId: me,
            proposedByLabel: myDev.label,
            approvals: [me],
            objectors: [],
            windowRemSecs: 86400,
            earliestLoneAt: "2026-10-21T17:45:00Z (24h W_self)",
            settled: null,
          });
        }
      }
      closeSheet();
      renderAll();
    }

    // `CSD-095`: Agree (`+1`) or Object (`-1`) to a Self-Key Roster proposal behind 3-fact `ConfirmSheet`
    function openRosterAnswerConfirm(propId, assent) {
      const p = state.multiDevice.proposals.find(x => x.proposalId === propId);
      if (!p) return;
      const changeText = (p.kind === "add" ? "Add " : "Evict ") + p.subjectLabel;
      const effectText = assent
        ? (p.approvals.length + 1 >= 2
            ? "Reaches quorum (2 signatures) and lands immediately"
            : "Records your +1 scores signature toward quorum")
        : "Records your -1 scores objection, blocking the 24h single-device window and refusing the change";

      const host = document.getElementById("sheetHost");
      host.innerHTML = `
        <div class="sheet-backdrop" onclick="if(event.target===this)closeSheet()">
          <div class="sheet" data-csd-tag="confirm_roster_answer">
            <div class="sheet-header">
              <span class="sheet-title">${assent ? 'Agree' : 'Object'} to ${changeText}?</span>
              <button class="btn-ghost" onclick="closeSheet()">&#10005;</button>
            </div>
            <div class="card" style="padding:8px 14px;">
              <div class="kv-row"><span>1. Change</span><strong>${changeText}</strong></div>
              <div class="kv-row"><span>2. Proposed by</span><strong>${p.proposedByLabel}</strong></div>
              <div class="kv-row"><span>3. What your answer does</span><span>${effectText}</span></div>
            </div>
            ${p.kind === 'evict' && assent ? `
              <div style="font-size:12px; color:var(--danger); margin-bottom:10px;">
                CC 4.5.12.1: Already-shared content stays readable to the evicted device; CIRIS does not re-encrypt past content.
              </div>
            ` : ''}
            <div style="display:flex; gap:8px; margin-top:12px;">
              <button class="btn ${assent ? 'btn-brand' : 'btn-danger'}"
                      data-csd-tag="btn_confirm_roster_answer_yes"
                      onclick="executeRosterAnswer('${propId}', ${assent})">
                ${assent ? 'Sign agreement (+1)' : 'Sign objection (-1)'}
              </button>
              <button class="btn" data-csd-tag="btn_confirm_roster_answer_cancel" onclick="closeSheet()">Cancel</button>
            </div>
          </div>
        </div>
      `;
    }

    function executeRosterAnswer(propId, assent) {
      const p = state.multiDevice.proposals.find(x => x.proposalId === propId);
      if (!p) return;
      const me = state.multiDevice.activeOccurrenceId;

      if (assent) {
        if (!p.approvals.includes(me)) p.approvals.push(me);
        if (p.approvals.length >= 2) {
          p.settled = "LANDED";
          if (p.kind === "add") {
            if (!state.multiDevice.devices.some(d => d.occurrenceId === p.subjectOccurrenceId)) {
              state.multiDevice.devices.push({
                occurrenceId: p.subjectOccurrenceId,
                keyId: p.subjectKeyId,
                label: p.subjectLabel,
                deviceClass: p.subjectClass || "phone",
                reachable: false,
                hardwareCustody: "secure_enclave",
                dekRecipient: true,
                revoked: false,
              });
            }
            const req = state.multiDevice.pendingDeviceRequests.find(r => r.occurrenceId === p.subjectOccurrenceId);
            if (req) req.status = "approved";
          } else if (p.kind === "evict") {
            const dev = state.multiDevice.devices.find(d => d.occurrenceId === p.subjectOccurrenceId);
            if (dev) {
              dev.revoked = true;
              dev.dekRecipient = false;
            }
          }

    function draw3DViewForm(claim) {
      const canvas = document.getElementById("spatialCanvas");
      if (!canvas) return;
      const ctx = canvas.getContext("2d");
      const w = canvas.width, h = canvas.height;
      ctx.fillStyle = "#FAF9F5";
      ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = "#E4E0D6";
      ctx.fillRect(40, h - 24, w - 80, 4);

      const t = Math.max(0, Math.min(1, (claim.score + 1) / 2));
      const r = Math.round((0.85 + (0.20 - 0.85) * t) * 255);
      const g = Math.round((0.12 + (0.72 - 0.12) * t) * 255);
      const b = Math.round((0.12 + (0.30 - 0.12) * t) * 255);
      const radius = 16 + claim.confidence * 22;

      ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
      ctx.beginPath();
      ctx.arc(w / 2, h / 2, radius, 0, Math.PI * 2);
      ctx.fill();
    }

          <div class="card" data-csd-tag="csd_113_retirement">
            <div class="card-header">
              <div class="card-header-title">
                <span>Retirement ladder (CSD-113)</span>
                <span class="chip brand">Step ${state.retirementStage}/7 &middot; ${curStep}</span>
              </div>
              <button class="btn-ghost" onclick="toggleExpand('retire')">&ctdot;</button>
            </div>
            ${state.expandedIds['retire'] ? `
              <div class="expand-body">
                ${steps.map((s, idx) => `
                  <div class="kv-row">
                    <span style="${idx + 1 === state.retirementStage ? 'font-weight:600; color:var(--obsidian);' : ''}">${idx + 1}. ${s}</span>
                    <span>${idx === 0 ? 'Cancelable (1-step)' : 'Forward-only'}</span>
                  </div>
                `).join("")}
                <div style="display:flex; gap:8px; margin-top:10px;">
                  <button class="btn" onclick="state.retirementStage=Math.min(7,state.retirementStage+1); renderAll();">Next step</button>
                  <button class="btn-ghost" onclick="state.retirementStage=1; renderAll();">Reset</button>
                </div>
              </div>
            ` : ''}
          </div>
        `;
      }

      if (inst.id === "ThisNode") {
        return `
          ${renderExpandableCard("csd_node_standing", "Trust root standing", `Rooted · v${state.liveNode.version}`, "ok", `
            <div class="kv-row"><span>Local node</span><span class="mono-hint">127.0.0.1:4243 (${state.liveNode.standing} · ${state.liveNode.keyId})</span></div>
            <div class="kv-row"><span>Agent runtime</span><span class="mono-hint">${state.hasAgent ? '127.0.0.1:8080 (22/22 services · ciris-agent 2.17.0)' : 'Not attached (CSD-083 node-only)'}</span></div>
            <div class="kv-row"><span>Crypto</span><span class="mono-hint">Ed25519 + ML-DSA-65 / X25519 + ML-KEM-768</span></div>
          `)}
          <div class="card" data-csd-tag="csd_080_first_run_launcher">
            <div class="card-header">
              <div class="card-header-title">
                <span>First-Run Setup &amp; Node Claim Wizard (CSD-080..085, 093)</span>
                <span class="chip brand">${state.wizard.ownershipState}</span>
              </div>
              <button class="btn" data-csd-tag="btn_open_setup_wizard" onclick="startFirstRunWizard(false)">
                Open Setup Wizard&hellip;
              </button>
            </div>
          </div>
          ${renderExpandableCard("csd_118_never_allowed", "Never-allowed list & operator declaration (CSD-118)", "T0 · Enforced", "brand", `
            <div class="kv-row"><span>prohibited:*</span><span>No hidden scoring, no silent forward, no unconsented training</span></div>
            <div class="kv-row"><span>CSD/4 tests</span><span class="mono-hint">first_run [root.none, node.unclaimed] &middot; declared [root.none, node.claimed]</span></div>
          `)}
          ${renderExpandableCard("csd_csd4_catalogue_status", "CSD/4 catalogue v5 &amp; trace checkpoints (CSD-001..129)", "101/101 Green · T0–T19 · 120 atoms", "ok", `
            <div class="kv-row"><span>Cohort 1 (Pinned requirements.yaml)</span><span class="mono-hint">20/20 cards green (0 pending)</span></div>
            <div class="kv-row"><span>Cohort 2 (Testable flows)</span><span class="mono-hint">6/6 cards green (T1, T2, T8, T18)</span></div>
            <div class="kv-row"><span>Cohort 3 (Forced &amp; Reserved #179/#206)</span><span class="mono-hint">31/31 cards green (T0..T19)</span></div>
            <div class="kv-row"><span>Cohort 4 (Supports &amp; Ops)</span><span class="mono-hint">44/44 cards green (derives: [ops])</span></div>
            <div class="kv-row"><span>Resolved trace instants</span><span class="mono-hint">134 test instants &middot; 74 checkpoints written</span></div>
          `)}
        `;
      }

      if (inst.id === "SomeoneITrust") {
        return `
          ${renderExpandableCard("csd_117_wa", "Wise Authority rulings & conduct (CSD-117)", "Judges are judged", "brand", `
            <div class="kv-row"><span>Standing</span><span>Every WA deferral ruling is signed, peer-reviewed, and contestable</span></div>
          `)}
        `;
      }

      return `
        ${renderExpandableCard("csd_116_principles", "Published ethical principles (CSD-116)", "Lexical order", "brand", `
          <div class="kv-row"><span>1. Meta-Goal M-1</span><span>Adaptive coherence &amp; flourishing</span></div>
          <div class="kv-row"><span>2. Tie-break rule</span><span>Protect the most vulnerable party first (CC 1.4)</span></div>
          <div class="kv-row"><span>3. Guarantee G14</span><span>Always state what the protocol cannot verify</span></div>
        `)}
      `;
    }

    function renderExpandableCard(tag, title, chipLabel, chipTone, bodyHtml) {
      const open = !!state.expandedIds[tag];
      return `
        <div class="card" data-csd-tag="${tag}">
          <div class="card-header">
            <div class="card-header-title">
              <span>${title}</span>
              <span class="chip ${chipTone}">${chipLabel}</span>
            </div>
            <button class="btn-ghost" data-csd-tag="btn_${tag}_ellipsis" onclick="toggleExpand('${tag}')">&ctdot;</button>
          </div>
          ${open ? `<div class="expand-body">${bodyHtml}</div>` : ''}
        </div>
      `;
    }

    function renderCeremonyCard(circleId) {
      const spec = CEREMONIES_BY_CIRCLE[circleId] || CEREMONIES_BY_CIRCLE.JustMe;
      const votes = state.ceremonyVotes[circleId] || { app: 1, obj: 0 };
      let statusLabel = `${votes.app} of ${spec.need} signed`;
      let statusTone = "warn";
      if (votes.obj > 0) {
        statusLabel = "Objected";
        statusTone = "danger";
      } else if (votes.app >= spec.need) {
        statusLabel = "Approved";
        statusTone = "ok";
      }
      const key = "ceremony_" + circleId;
      const open = !!state.expandedIds[key];

      return `
        <div class="card" data-csd-tag="csd_two_path_ceremony_${circleId}">
          <div class="card-header">
            <div class="card-header-title">
              <span>${spec.title}</span>
              <span class="chip ${statusTone}">${statusLabel}</span>
            </div>
            <button class="btn-ghost" data-csd-tag="btn_ceremony_ellipsis" onclick="toggleExpand('${key}')">&ctdot;</button>
          </div>
          ${open ? `
            <div class="expand-body">
              <div class="kv-row"><span>Rule</span><span class="mono-hint">${spec.policy}</span></div>
              <div class="kv-row"><span>Tally</span><span>${votes.app} approvals &middot; ${votes.obj} objections</span></div>
              <div style="display:flex; gap:8px; margin-top:10px;">
                <button class="btn btn-brand" onclick="state.ceremonyVotes['${circleId}'].app++; renderAll();">Approve</button>
                <button class="btn" onclick="state.ceremonyVotes['${circleId}'].obj++; renderAll();">Object</button>
                <button class="btn-ghost" onclick="state.ceremonyVotes['${circleId}']={app:1,obj:0}; renderAll();">Reset</button>
              </div>
            </div>
          ` : ''}
        </div>
      `;
    }

    // ── Main Render ──
    function renderAll() {
      const circle = getCircle(state.circleId);
      const pendingRosterCount = answerableProposalCount();

      // Update Top Bar Badge (`CSD-095`)
      const badgeEl = document.getElementById("top_devices_badge");
      if (badgeEl) {
        if (pendingRosterCount > 0) {
          badgeEl.style.display = "inline-flex";
          badgeEl.textContent = pendingRosterCount;
        } else {
          badgeEl.style.display = "none";
        }
      }

      // Header Title
      const headerTitle = document.getElementById("headerTitle");
      if (state.setupMode) {
        headerTitle.innerHTML = `<span style="color:var(--brand);">First-Run Setup</span>`;
      } else if (state.instrumentId) {
        const inst = INSTRUMENTS.find(i => i.id === state.instrumentId);
        headerTitle.innerHTML = `<span style="color:var(--ink-mute); font-weight:400;">My things /</span> <span>${inst.label}</span>`;
      } else {
        headerTitle.innerHTML = `<span class="circle-dot" style="background:${circle.color}"></span><span>${circle.label}</span>`;
      }

      const stopBtn = document.getElementById("btn_stop_everything");
      stopBtn.textContent = state.halted ? "Halted (423)" : "Stop";
      stopBtn.className = state.halted ? "btn btn-stop halted" : "btn btn-stop";

      // Tabs Bar
      const tabsBar = document.getElementById("tabsBar");
      if (state.setupMode || state.instrumentId) {
        tabsBar.style.display = "none";
      } else {
        tabsBar.style.display = "flex";
        tabsBar.innerHTML = TABS.map(t => `
          <button class="tab-pill ${state.tab === t ? 'active' : ''}"
                  data-csd-tag="tab_${t.toLowerCase()}"
                  onclick="selectTab('${t}')">${t}</button>
        `).join("");
      }

      // Bottom Circle Switcher
      document.getElementById("circleNav").innerHTML = CIRCLES.map(c => `
        <button class="circle-btn ${!state.setupMode && !state.instrumentId && state.circleId === c.id ? 'active' : ''}"
                data-csd-tag="nav_circle_${c.id}"
                onclick="selectCircle('${c.id}')">
          <span class="circle-dot" style="background:${c.color}"></span>
          <span>${c.label}</span>
        </button>
      `).join("");

      let html = "";

      // Global Halt Banner (`P7`)
      if (state.halted) {
        html += `
          <div class="state-banner danger" data-csd-tag="state_halt_423">
            <span><strong>Agent paused (423 Locked)</strong> &middot; Data doors remain open</span>
            <button class="btn-ghost" onclick="toggleExpand('halt_detail')">&ctdot;</button>
          </div>
          ${state.expandedIds['halt_detail'] ? `
            <div class="lens-drawer" data-csd-tag="state_halt_423_data_doors_open">
              Autonomous actions are refused (<code>HALT_LATCHED_423</code>). Reading, exporting, and 1-step take-back continue normally (<code>Inv_X1_LatchDoesNotBlockServing</code>).
            </div>
          ` : ''}
        `;
      }

      // If First-Run Setup Mode is active, render the First-Run Wizard (`CSD-080`..`CSD-085`, `CSD-093`)
      if (state.setupMode) {
        html += renderFirstRunWizard();
        document.getElementById("surfaceRoot").innerHTML = html;
        return;
      }

      // If an instrument under `My things` is active, render it
      if (state.instrumentId) {
        const inst = INSTRUMENTS.find(i => i.id === state.instrumentId);
        html += renderInstrumentSurface(inst);
        document.getElementById("surfaceRoot").innerHTML = html;
        return;
      }

      // Otherwise render the active `(Circle × Tab)`
      const rows = CLAIMS.filter(c => c.scope === state.circleId && c.tab === state.tab);

      if (state.tab === "Files" || state.tab === "Chats") {
        html += `
          <div class="quiet-lens" data-csd-tag="csd_policy_lens_bar">
            <span>Lens: <strong>my rules</strong> &middot; ${rows.length} ${state.tab.toLowerCase()}</span>
            <button class="btn-ghost" onclick="toggleExpand('lens')">&ctdot;</button>
          </div>
          ${state.expandedIds['lens'] ? `
            <div class="lens-drawer">
              <div style="display:flex; justify-content:space-between; align-items:center;">
                <span>Blur items with neighbour content notes (<code>cw_class</code>)</span>
                <button class="btn" onclick="state.blurEnabled=!state.blurEnabled; renderAll();">
                  ${state.blurEnabled ? 'Blur: On' : 'Blur: Off'}
                </button>
              </div>
            </div>
          ` : ''}
        `;
      }

      if (state.tab === "Decisions") {
        html += renderCeremonyCard(state.circleId);
      } else {
        html += `
          <div class="card" data-csd-tag="csd_main_card">
            ${rows.length > 0 ? rows.map(renderItemRow).join("") : `
              <div class="item-row"><span style="color:var(--ink-mute); font-size:13px;">No ${state.tab.toLowerCase()} in ${circle.label} yet.</span></div>
            `}
          </div>
        `;
      }

      // Contextual footer action per tab (quiet, 1-line)
      if (state.tab === "Chats") {
        html += `
          <div class="compose-row">
            <input id="chatInput" class="compose-input" placeholder="Write a signed message to ${circle.label}&hellip;" onkeydown="if(event.key==='Enter')sendChatMessage()" />
            <button class="btn btn-brand" onclick="sendChatMessage()">Send</button>
          </div>
        `;
      } else if (state.tab === "People" && state.circleId !== "JustMe") {
        html += `
          <div style="display:flex; justify-content:space-between; align-items:center; padding:4px 2px;">
            <span style="font-size:12px; color:var(--ink-mute);">One-step exit (<code>Inv_ExitOneStep</code>)</span>
            <button class="btn" data-csd-tag="btn_leave_circle" onclick="selectCircle('JustMe')">Leave ${circle.label} (1-step)</button>
          </div>
        `;
      } else if (state.tab === "Safety" && (state.circleId === "Neighbours" || state.circleId === "CommunitiesAndBusinesses")) {
        html += `
          <div style="display:flex; justify-content:flex-end; padding:4px 2px;">
            <button class="btn" data-csd-tag="btn_open_protected_report" onclick="openProtectedReportSheet()">File protected report&hellip;</button>
          </div>
        `;
      }

      document.getElementById("surfaceRoot").innerHTML = html;
    }

    renderAll();
    syncLiveNode();
  </script>
</body>
</html>
