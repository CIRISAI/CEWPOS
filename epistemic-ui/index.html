<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Circles — Constitutional Mesh</title>
  <style>
    :root {
      --bone: #FAF9F5;
      --paper: #F2EFE9;
      --obsidian: #141413;
      --ink-mute: #6E6B64;
      --hairline: #E4E0D6;
      --brand: #1F5E7A;
      --ok: #207A3C;
      --warn: #B86B14;
      --danger: #B82323;
      --c-justme: #22C0E8;
      --c-family: #419CA0;
      --c-neighbours: #7A6FD6;
      --c-communities: #C96A38;
      --c-everyone: #B08A3E;
      --mono: "JetBrains Mono", "SFMono-Regular", Consolas, monospace;
      --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #0F141C;
      color: var(--obsidian);
      font-family: var(--sans);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* ── Full-Screen Bevy / CIRISHolon Spatial Viewport (100vw × 100vh) ── */
    #bevyViewport {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at 50% 18%, #F6F4EE 0%, #EAE5DA 62%, #DDD6C7 100%);
    }
    canvas#bevySceneCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* ── Full-Screen 3D Spatial Scene Root (Perspective Camera + 3D Slabs) ── */
    .shell {
      position: relative;
      z-index: 10;
      max-width: 780px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 0 20px 104px;
      perspective: 1400px;
      transform-style: preserve-3d;
    }
    #surfaceRoot {
      transform-style: preserve-3d;
      transition: transform 0.12s ease-out;
    }

    /* ── Top Spatial HUD Bar: `My things`, Context Title, `Stop`, `⋯` ── */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      margin-top: 12px;
      margin-bottom: 10px;
      border: 1px solid rgba(20, 20, 19, 0.1);
      border-radius: 16px;
      position: sticky;
      top: 12px;
      background: rgba(250, 249, 245, 0.86);
      backdrop-filter: blur(16px);
      box-shadow: 0 10px 30px rgba(20, 20, 19, 0.06), 0 1px 0 rgba(255, 255, 255, 0.8) inset;
      z-index: 20;
    }
    .topbar-center {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 15px;
      letter-spacing: -0.01em;
    }
    .topbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ── Buttons & Quiet Triggers (`☰` Hamburger & `⋯` Ellipsis) ── */
    .btn {
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--hairline);
      background: #fff;
      color: var(--obsidian);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn:hover:not(:disabled) { background: var(--paper); }
    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .btn-ghost {
      background: transparent;
      border: 1px solid transparent;
      color: var(--ink-mute);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 14px;
      line-height: 1;
      cursor: pointer;
    }
    .btn-ghost:hover {
      background: var(--paper);
      color: var(--obsidian);
    }
    .btn-stop {
      color: var(--danger);
      border-color: rgba(184, 35, 35, 0.35);
      background: #fff;
      font-weight: 600;
    }
    .btn-stop.halted {
      background: var(--danger);
      color: #fff;
      border-color: var(--danger);
    }
    .btn-brand {
      background: var(--brand);
      color: #fff;
      border-color: var(--brand);
    }
    .btn-brand:hover:not(:disabled) { opacity: 0.92; background: var(--brand); }
    .btn-danger {
      background: rgba(184, 35, 35, 0.08);
      color: var(--danger);
      border-color: rgba(184, 35, 35, 0.35);
    }

    /* ── 7 Circle Tabs & Step Indicators ── */
    .tabs {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      padding: 12px 0;
      margin-bottom: 6px;
    }
    .tab-pill {
      border: none;
      background: transparent;
      color: var(--ink-mute);
      font-size: 13px;
      font-weight: 500;
      padding: 5px 11px;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
    }
    .tab-pill:hover { color: var(--obsidian); background: var(--paper); }
    .tab-pill.active {
      background: var(--obsidian);
      color: var(--bone);
      font-weight: 600;
    }

    /* ── Quiet Context / Lens Line (`⋯` to expand) ── */
    .quiet-lens {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: var(--ink-mute);
      padding: 2px 2px 10px;
    }
    .lens-drawer {
      background: var(--paper);
      border: 1px solid var(--hairline);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 12px;
      font-size: 12px;
    }

    /* ── P1: CardShell (3D Spatial Slab in Full-Screen Bevy Scene) ── */
    .card {
      background: rgba(255, 255, 255, 0.90);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(20, 20, 19, 0.10);
      border-radius: 16px;
      padding: 8px 20px 14px;
      margin-bottom: 16px;
      box-shadow: 0 18px 42px rgba(20, 20, 19, 0.06), 0 1px 0 rgba(255, 255, 255, 0.92) inset;
      transform-style: preserve-3d;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 0 10px;
    }
    .card-header-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--obsidian);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      letter-spacing: -0.01em;
    }

    /* ── P9: 3D Context Question & Selection Tiles in Full-Screen Bevy Scene ── */
    .p9-question-hero {
      padding: 6px 0 14px;
      border-bottom: 1px solid var(--hairline);
      margin-bottom: 14px;
    }
    .p9-question-eyebrow {
      font-family: var(--mono);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--brand);
      font-weight: 600;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .p9-question-title {
      font-size: 21px;
      font-weight: 650;
      color: var(--obsidian);
      letter-spacing: -0.02em;
      line-height: 1.3;
    }
    .p9-question-sub {
      font-size: 13.5px;
      color: var(--ink-mute);
      margin-top: 4px;
    }
    .p9-selection-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 12px;
      margin: 12px 0;
      transform-style: preserve-3d;
    }
    .p9-selection-tile {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-align: left;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1.5px solid var(--hairline);
      background: rgba(250, 249, 245, 0.92);
      cursor: pointer;
      font-family: var(--sans);
      transform: translate3d(0, 0, 4px);
      transition: transform 0.18s cubic-bezier(0.2, 0.8, 0.2, 1), border-color 0.16s, background 0.16s, box-shadow 0.18s;
      box-shadow: 0 6px 16px rgba(20, 20, 19, 0.04);
    }
    .p9-selection-tile:hover:not(:disabled) {
      transform: translate3d(0, -2px, 14px);
      border-color: rgba(31, 94, 122, 0.45);
      background: #fff;
      box-shadow: 0 12px 26px rgba(20, 20, 19, 0.08);
    }
    .p9-selection-tile.selected {
      transform: translate3d(0, -3px, 22px);
      border-color: var(--brand);
      background: #fff;
      box-shadow: 0 16px 34px rgba(31, 94, 122, 0.14), 0 0 0 1px var(--brand);
    }
    .p9-selection-tile:disabled {
      opacity: 0.48;
      cursor: not-allowed;
    }
    .p9-tile-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }
    .p9-tile-check {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 1.5px solid var(--hairline);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: #fff;
      background: #fff;
      flex-shrink: 0;
    }
    .p9-selection-tile.selected .p9-tile-check {
      background: var(--brand);
      border-color: var(--brand);
    }
    .p9-tile-label {
      font-size: 14px;
      font-weight: 600;
      color: var(--obsidian);
      line-height: 1.3;
    }
    .p9-tile-sub {
      font-size: 12px;
      color: var(--ink-mute);
      line-height: 1.4;
      margin-top: 4px;
    }

    /* ── Modern Spatial Field Controls (No 1990s HTML Forms) ── */
    .spatial-field-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 12px;
      margin: 12px 0;
    }
    .spatial-field-box {
      background: rgba(250, 249, 245, 0.95);
      border: 1.5px solid var(--hairline);
      border-radius: 12px;
      padding: 10px 14px;
      box-shadow: 0 4px 12px rgba(20, 20, 19, 0.03);
      transition: border-color 0.16s, box-shadow 0.18s, background 0.16s;
    }
    .spatial-field-box:focus-within {
      border-color: var(--brand);
      background: #ffffff;
      box-shadow: 0 8px 20px rgba(31, 94, 122, 0.10);
    }
    .spatial-field-label {
      font-size: 11px;
      font-family: var(--mono);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--ink-mute);
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .spatial-input {
      width: 100%;
      border: none;
      background: transparent;
      font-size: 14.5px;
      font-weight: 600;
      color: var(--obsidian);
      outline: none;
      font-family: var(--sans);
    }
    .spatial-input::placeholder {
      color: rgba(90, 98, 106, 0.5);
      font-weight: 400;
    }

    /* ── P3: ItemRow — Strictly 3 Scannable Inline Elements (`Title`, `ScopePill`/`Chip`, `☰`/`⋯`) ── */
    .item-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 0;
      border-top: 1px solid #F2EFE9;
    }
    .item-row:first-child { border-top: none; }
    .item-title {
      font-size: 14px;
      font-weight: 500;
      color: var(--obsidian);
    }
    .item-row.blurred .item-title {
      filter: blur(4px);
      transition: filter 0.18s;
    }
    .item-row.blurred:hover .item-title { filter: none; }
    .item-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    /* ── P5: ScopePill ── */
    .scope-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      color: var(--obsidian);
      background: var(--bone);
      border: 1px solid var(--hairline);
    }
    .circle-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* ── P6: Chip ── */
    .chip {
      display: inline-flex;
      align-items: center;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--paper);
      color: var(--ink-mute);
    }
    .chip.ok { background: rgba(32, 122, 60, 0.1); color: var(--ok); }
    .chip.warn { background: rgba(184, 107, 20, 0.12); color: var(--warn); }
    .chip.danger { background: rgba(184, 35, 35, 0.12); color: var(--danger); }
    .chip.brand { background: rgba(31, 94, 122, 0.1); color: var(--brand); }

    /* ── Expandable Detail Drawer (`⋯`) ── */
    .expand-body {
      border-top: 1px solid #F2EFE9;
      padding: 10px 0 14px;
      font-size: 12px;
      color: var(--ink-mute);
    }
    .kv-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      padding: 6px 0;
      border-bottom: 1px dashed #F2EFE9;
    }
    .kv-row:last-child { border-bottom: none; }
    .mono-hint {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--ink-mute);
    }

    /* ── P7: StateBlock ── */
    .state-banner {
      padding: 12px 14px;
      border-radius: 10px;
      margin-bottom: 12px;
      font-size: 13px;
      border: 1px solid var(--hairline);
      background: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .state-banner.danger {
      border-color: rgba(184, 35, 35, 0.4);
      background: rgba(184, 35, 35, 0.05);
      color: var(--danger);
    }
    .state-banner.brand {
      border-color: rgba(31, 94, 122, 0.35);
      background: rgba(31, 94, 122, 0.05);
      color: var(--brand);
    }

    /* ── Form Inputs & Choice Cards (First-Run Wizard) ── */
    .field-input {
      width: 100%;
      padding: 8px 11px;
      border-radius: 8px;
      border: 1px solid var(--hairline);
      background: var(--bone);
      font-family: var(--sans);
      font-size: 13px;
      color: var(--obsidian);
    }
    .choice-btn {
      flex: 1;
      text-align: left;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--hairline);
      background: var(--bone);
      cursor: pointer;
      font-family: var(--sans);
      transition: border-color 0.15s, background 0.15s;
    }
    .choice-btn.selected {
      border-color: var(--brand);
      background: rgba(31, 94, 122, 0.06);
    }
    .choice-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .match-code-box {
      font-family: var(--mono);
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: var(--brand);
      background: var(--bone);
      border: 1px solid var(--hairline);
      border-radius: 10px;
      padding: 10px 16px;
      text-align: center;
      margin: 8px 0;
    }

    /* ── Compose / Chat Input Bar ── */
    .compose-row {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .compose-input {
      flex: 1;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid var(--hairline);
      background: #fff;
      font-family: var(--sans);
      font-size: 13px;
    }

    /* ── Bottom Circle Bar (5 Circles) ── */
    .bottom-circles {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(250, 249, 245, 0.94);
      backdrop-filter: blur(8px);
      border-top: 1px solid var(--hairline);
      display: flex;
      justify-content: center;
      gap: 6px;
      padding: 10px 12px;
      z-index: 25;
    }
    .circle-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--ink-mute);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
    }
    .circle-btn:hover { background: var(--paper); color: var(--obsidian); }
    .circle-btn.active {
      background: #fff;
      color: var(--obsidian);
      font-weight: 600;
      border-color: var(--hairline);
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }

    /* ── Slide-Up Sheet (`☰` Receipt, `ConfirmSheet`, `My things`) ── */
    .sheet-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(20, 20, 19, 0.28);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 50;
    }
    .sheet {
      width: 100%;
      max-width: 560px;
      background: var(--bone);
      border-top-left-radius: 16px;
      border-top-right-radius: 16px;
      border: 1px solid var(--hairline);
      padding: 18px 20px 24px;
      box-shadow: 0 -8px 30px rgba(0,0,0,0.08);
      max-height: 85vh;
      overflow-y: auto;
    }
    .sheet-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .sheet-title {
      font-size: 15px;
      font-weight: 600;
    }
    canvas#spatialCanvas {
      width: 100%;
      height: 160px;
      background: #0F1319;
      border: 1px solid var(--hairline);
      border-radius: 8px;
      display: block;
      margin-top: 8px;
    }

    /* ── 3D Bevy / CIRISHolon (`holon-render-3d`) Deferral-Vote Stage ── */
    .holon-3d-stage {
      background: radial-gradient(circle at 50% 42%, #182230 0%, #0D1117 100%);
      color: #EDF2F7;
      border: 1px solid #2A3648;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
      box-shadow: 0 10px 28px rgba(10, 14, 22, 0.22);
      position: relative;
      overflow: hidden;
    }
    .holon-3d-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 10px;
    }
    .holon-3d-title {
      font-size: 14px;
      font-weight: 600;
      color: #F7FAFC;
      letter-spacing: -0.01em;
    }
    .holon-3d-sub {
      font-size: 12px;
      color: #A0AEC0;
      margin-top: 2px;
    }
    .holon-canvas-wrap {
      position: relative;
      width: 100%;
      height: 310px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.12);
      background: radial-gradient(circle at 50% 50%, #16202E 0%, #0A0E14 100%);
      overflow: hidden;
      cursor: grab;
    }
    .holon-canvas-wrap:active {
      cursor: grabbing;
    }
    canvas#holonDeferralCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .holon-ledger-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid rgba(255,255,255,0.1);
      font-family: var(--mono);
      font-size: 11px;
      color: #A0AEC0;
    }
    .holon-orb-strip {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 10px;
    }
    .holon-orb-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.06);
      color: #F7FAFC;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, transform 0.12s;
    }
    .holon-orb-pill:hover {
      background: rgba(255,255,255,0.14);
      transform: translateY(-1px);
    }
    .holon-orb-pill.bonded {
      border-color: #38B2AC;
      background: rgba(56, 178, 172, 0.22);
      font-weight: 600;
    }

    /* ── Universal CEG Hamburger (`☰`) 9 AttOps + Referent & Moderation Grid ── */
    .attop-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-top: 8px;
    }
    .attop-btn {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      padding: 7px 9px;
      border-radius: 8px;
      border: 1px solid var(--hairline);
      background: #fff;
      cursor: pointer;
      text-align: left;
      font-family: var(--sans);
      transition: background 0.12s, border-color 0.12s;
    }
    .attop-btn:hover:not(:disabled) {
      background: var(--paper);
      border-color: var(--brand);
    }
    .attop-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      background: var(--bone);
    }
    .attop-name {
      font-size: 12px;
      font-weight: 600;
      color: var(--obsidian);
    }
    .attop-why {
      font-size: 10px;
      color: var(--ink-mute);
      line-height: 1.25;
      margin-top: 2px;
    }
  </style>
</head>
<body>

  <!-- Full-Screen Bevy / CIRISHolon 3D Spatial Viewport (100vw × 100vh) -->
  <div id="bevyViewport" data-csd-tag="csd_080_holon_wizard_3d">
    <canvas id="bevySceneCanvas"></canvas>
  </div>

  <div class="shell">
    <!-- Top Bar -->
    <header class="topbar">
      <button id="btn_my_things" data-csd-tag="btn_my_things" class="btn" onclick="openMyThingsSheet()">
        &#9670; My things

    // Build a `HolonFrameBuffer` (`24.0`-bohr World Box, Atom 0 = Context `Z=8` at `[12,12,12]`, Atoms `1..=K` = Choices)
    function buildHolonFrameFromDeferral(dv) {
      const center = [12.0, 12.0, 12.0];
      const atoms = [
        {
          idx: 0,
          label: dv.contextTitle,
          subtitle: dv.contextSubtitle || dv.dimension,
          z: 8,
          pos: center,
          radius: 1.48,
          isContext: true,
          receiptId: dv.receiptId || dv.deferralId,
        }
      ];
      const bonds = [];
      const choices = dv.choices || [];
      const n = Math.max(1, choices.length);
      choices.forEach((ch, i) => {
        const angle = (2 * Math.PI * i) / n - Math.PI / 2;
        const isSel = !!ch.selected || (dv.selectedChoiceId && dv.selectedChoiceId === ch.choiceId);
        const orbitR = isSel ? 4.2 : 6.6;
        const zOff = ((i % 3) - 1) * 1.65;
        const pos = [
          center[0] + orbitR * Math.cos(angle),
          center[1] + orbitR * Math.sin(angle),
          center[2] + zOff,
        ];
        atoms.push({
          idx: i + 1,
          choiceId: ch.choiceId,
          label: ch.label,
          subtitle: ch.subtitle || "",
          voteScore: typeof ch.voteScore === "number" ? ch.voteScore : 1.0,
          z: ch.atomicNumber || (ch.voteScore < 0 ? 9 : ch.voteScore === 0 ? 3 : 7),
          pos,
          radius: isSel ? 1.24 : 0.98,
          selected: isSel,
          disabled: !!ch.disabled,
          onClickJs: ch.onClickJs || "",
          csdTag: ch.csdTag || `holon_orb_${ch.choiceId}`,
          receiptId: ch.receiptId || `orb_${ch.choiceId}`,
        });
        if (isSel) {
          bonds.push({ a: 0, b: i + 1, order: 2 });
        }
      });
      return { boxL: 24.0, atoms, bonds, deferral: dv };
    }

    // ── P9: ChoiceBlock (Context, Options, Consequences / What Changes Based on Each Option) ──

    function renderP9ChoiceBlock({

            </div>
          </div>
          <div class="p9-question-title">${contextTitle}</div>
          ${contextSubtitle ? `<div class="p9-question-sub">${contextSubtitle}</div>` : ''}

        ${optionsGridHtml}
        ${summaryHtml ? `<div style="font-size:12.5px;color:var(--ink-mute);padding:4px 0 8px;">${summaryHtml}</div>` : ''}

    function wizardCast3DVote(choiceId) {
      const w = state.wizard;
      state.holon3d.wExt += 0.0125;
      state.holon3d.ePair -= 0.042;
      if (choiceId === "choice_identity_new") {
        w.identityPath = "NEW";
        if (!w.fedidLabel.trim()) w.fedidLabel = "alice.ciris";
        if (!w.ageBand) w.ageBand = "ADULT";
      } else if (choiceId === "choice_identity_add_device") {
        w.identityPath = "ADD_THIS_DEVICE";
        if (!w.addDeviceContact) w.addDeviceContact = "ciris://ed25519:alice.ciris#root@192.168.1.42:4243";
      } else if (choiceId === "choice_age_adult") {
        w.identityPath = w.identityPath || "NEW";
        if (!w.fedidLabel.trim()) w.fedidLabel = "alice.ciris";
        w.ageBand = "ADULT";
      } else if (choiceId === "choice_age_declined") {
        w.identityPath = w.identityPath || "NEW";
        if (!w.fedidLabel.trim()) w.fedidLabel = "alice.ciris";
        w.ageBand = "DECLINED";
      } else if (choiceId === "choice_age_minor") {
        w.identityPath = w.identityPath || "NEW";
        w.ageBand = "MINOR";
      } else if (choiceId === "choice_consent_local_only") {
        w.traceConsent = false;
        w.traceAnalyze = false;
      } else if (choiceId === "choice_consent_share_traces") {
        w.traceConsent = true;
      } else if (choiceId === "choice_bond_local_ollama") {
        w.runWithAi = true;
        w.llmProvider = "local_ollama";
        w.llmStatus = "ok";
      } else if (choiceId === "choice_bond_ciris_portal") {
        w.runWithAi = true;
        w.llmProvider = "ciris_portal";
        w.llmStatus = "ok";
      } else if (choiceId === "choice_bond_node_only") {
        w.runWithAi = false;
      } else if (choiceId === "choice_claim_0600_pin") {
        wizardClaimOwnershipNow();
        return;
      } else if (choiceId === "choice_complete_enter_circles") {
        if (w.identityPath === "ADD_THIS_DEVICE" && w.addDeviceStatus !== "approved") {
          w.addDeviceStatus = "approved";
        }
        wizardFinishSetup();
        return;
      } else if (choiceId === "choice_claim_unclaimed") {
        wizardFinishSetup();
        return;
      }
      renderAll();
    }

    async function wizardSendAddDeviceRequest() {
      const w = state.wizard;
      const contact = (w.addDeviceContact || "").trim();
      const deviceName = (w.addDeviceName || "").trim();
      if (!deviceName || !contact) return;

      // Deterministic harness URI (`ciris://ed25519:alice.ciris#root@192.168.1.42:4243`) or offline fallback
      if (!state.liveNode.connected || contact.startsWith("ciris://ed25519:alice.ciris")) {
        w.addDeviceStatus = "requested";
        w.addDeviceMatchCode = "482 913";
        w.addDeviceServerNote = null;
        renderAll();
        return;
      }

      w.addDeviceStatus = "retrying";
      w.addDeviceServerNote = "Contacting existing device over Reticulum mesh (POST /v1/setup/add-device)…";
      renderAll();
      try {
        const resp = await fetch("/v1/setup/add-device", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contact,
            device_name: deviceName,
          }),
        });
        const data = await resp.json().catch(() => ({}));
        if (resp.ok) {
          w.addDeviceStatus = data.state || "requested";
          w.addDeviceMatchCode = data.match_code || data.code || data.verification_code || "482 913";
          w.addDeviceServerNote = `200 OK from /v1/setup/add-device: state=${w.addDeviceStatus}`;
        } else if (resp.status === 503 && data.reason_id === "add_device.owner_route_pending") {
          const retrySecs = parseInt(resp.headers.get("Retry-After") || "10", 10) || 10;
          w.addDeviceStatus = "retrying";
          w.addDeviceMatchCode = null;
          w.addDeviceServerNote = `503 ${data.reason_id}: ${data.error} (Auto-retrying in ${retrySecs}s while mesh route converges…)`;
          setTimeout(() => {
            if (state.wizard.addDeviceStatus === "retrying") {
              wizardSendAddDeviceRequest();
            }
          }, retrySecs * 1000);
        } else {
          w.addDeviceStatus = "failed";
          w.addDeviceMatchCode = null;
          w.addDeviceServerNote = `${resp.status} ${data.reason_id || 'refused'}: ${data.error || JSON.stringify(data)}`;
        }
      } catch (err) {
        w.addDeviceStatus = "failed";
        w.addDeviceServerNote = `Network error calling /v1/setup/add-device: ${err}`;
      }
      renderAll();
    }

      try {
        const hResp = await fetch("/health");
        if (!hResp.ok) return;
        const hData = await hResp.json();
        state.liveNode.connected = true;
        state.liveNode.version = hData.version || "0.5.241";
        state.liveNode.keyId = (hData.node && hData.node.key_id) || "qa-fresh-node";
        state.liveNode.standing = (hData.node && hData.node.standing) || "identified";

        const [stResp, ncResp, cdResp, lnResp] = await Promise.all([
          fetch("/v1/setup/status").catch(() => null),
          fetch("/v1/federation/node-code").catch(() => null),
          fetch("/v1/setup/consent-disclosure").catch(() => null),
          fetch("/cewpos/local-node").catch(() => null),
        ]);
        if (stResp && stResp.ok) {
          const st = await stResp.json();
          if (st.data) {
            state.liveNode.isFirstRun = !!st.data.is_first_run;
            if (st.data.is_first_run && !urlParams.get("instrument") && !urlParams.get("circle")) {
              state.setupMode = true;
            } else if (!st.data.is_first_run && state.wizard.ownershipState === "unclaimed") {
              state.wizard.ownershipState = "claimed";
            }
          }
        }
        if (ncResp && ncResp.ok) {
          const nc = await ncResp.json();
          state.liveNode.nodeCode = nc.code || null;
        }
        if (cdResp && cdResp.ok) {
          const cd = await cdResp.json();
          if (cd.data && cd.data.primary_action) {
            state.liveNode.consentDisclosureTitle = cd.data.primary_action.text;

        if (lnResp && lnResp.ok) {
          const ln = await lnResp.json();
          if (ln.claim_pin) {
            state.wizard.claimPin0600 = ln.claim_pin;
            state.liveNode.claimPinMode = ln.claim_pin_mode || "0o600";

        renderAll();

      }

                consequence: `Binds ${w.fedidLabel || 'alice.ciris'} as SYSTEM_ADMIN on this node and consumes the one-time PIN file.`,
                chipLabel: "POST /v1/setup/claim-remote",

          const pinInputHtml = `

              <input class="spatial-input" style="font-family:var(--mono);" data-csd-tag="input_claim_pin" value="${w.claimPin0600}" oninput="state.wizard.claimPin0600=this.value; renderAll();" />
            </div>
          `;

          const claimStateHtml = `
            ${w.ownershipState === "claiming" ? renderP7StateBlock({
              tag: "setup_ownership_claiming",
              contentHtml: "Verifying 0600 <code>claim_pin</code> and binding owner key&hellip;",
            }) : ''}
            ${w.ownershipState === "claimed" ? `
              ${renderP7StateBlock({
                tag: "setup_ownership_claimed",
                contentHtml: `<strong>This node is yours.</strong> Role: <code>SYSTEM_ADMIN</code> &middot; Owner: <code>${w.fedidLabel || 'alice.ciris'}</code>`,
                rightHtml: renderP6Chip({ label: "Claimed", tone: "ok" }),
              })}
              ${renderP3ItemRow({
                id: "setup_owner_claim",
                titleHtml: `Owner Binding Attestation: <code>${state.liveNode.attestationId || 'att-owner-0600-pin'}</code>`,
                subtitleHtml: `POST /v1/setup/claim-remote &middot; WA: <code>${state.liveNode.ownerWaId || 'wa-2026-owner'}</code>`,
                scopeId: "JustMe",
                localOnlyBadge: true,
              })}

            ${w.ownershipState === "error" ? renderP7StateBlock({
              tag: "setup_ownership_error",
              tone: "danger",

              rightHtml: `<button class="btn" data-csd-tag="btn_setup_finish_unclaimed" onclick="wizardFinishSetup()">Continue unclaimed</button>`,

          const step4FooterHtml = `
            <div style="display:flex; justify-content:space-between; padding:14px 0 6px;">
              <button class="btn" data-csd-tag="btn_back" onclick="wizardPrevStep()">&larr; Back</button>
              <button class="btn btn-brand" data-csd-tag="btn_finish_setup" onclick="wizardFinishSetup()">
                Finish Setup &amp; Open Circles &rarr;
              </button>

          `;

          stepBodyHtml = `
            <div data-csd-tag="csd_085_claim_node">
              ${claimChoiceHtml}
              ${pinInputHtml}
              ${claimStateHtml}

      }

      // Single cohesive 3D Spatial Slab container — no nested cards!
      return renderP1CardShell({
        tag: "csd_082_setup_wizard",
        titleHtml: "First-Run Setup Wizard &middot; 3D Choice Slabs (P9)",
        chipLabel: w.runWithAi ? "CSD-082 · With AI (3 steps)" : "CSD-083 · Node-only (2 steps)",
        chipTone: "brand",
        headerRightHtml: stepIndicatorsHtml,
        ellipsisKey: "wiz_node_posture",
        ellipsisHtml: wizardHeaderEllipsisHtml,
        bodyHtml: deferralStepBarHtml + stepBodyHtml,
      });
    }

    // ══════════════════════════════════════════════════════════════════════════
    // 2. FULL MULTI-DEVICE & SELF-KEY ROSTER (`CSD-037`, `CSD-094`, `CSD-095`)
    // ══════════════════════════════════════════════════════════════════════════

    function switchActiveDevicePerspective(occId) {
      state.multiDevice.activeOccurrenceId = occId;
      state.multiDevice.lastReceiptNote = null;
      renderAll();
    }

    function toggleDeviceReachable(occId) {
      const dev = state.multiDevice.devices.find(d => d.occurrenceId === occId);
      if (dev) dev.reachable = !dev.reachable;
      renderAll();
    }

    // `CSD-037`: Evict device with 3-fact ConfirmSheet + CC 4.5.12.1 honesty note + 2-stage force_self
    function openEvictDeviceSheet(occId) {
      const dev = state.multiDevice.devices.find(d => d.occurrenceId === occId);
      if (!dev) return;
      const isSelf = occId === state.multiDevice.activeOccurrenceId;
      const enrolledCount = activeEnrolledDevices().length;
      const requiresQuorum = enrolledCount >= 2 && !isSelf;

      const host = document.getElementById("sheetHost");
      host.innerHTML = `
        <div class="sheet-backdrop" onclick="if(event.target===this)closeSheet()">
          <div class="sheet" data-csd-tag="confirm_evict_device_${occId}">
            <div class="sheet-header">
              <span class="sheet-title">Evict ${dev.label}?</span>
              <button class="btn-ghost" onclick="closeSheet()">&#10005;</button>
            </div>
            <div class="card" style="padding:8px 14px;">
              <div class="kv-row"><span>1. Device</span><strong>${dev.label} (<code>${dev.keyId}</code>)</strong></div>
              <div class="kv-row"><span>2. Future access</span><span>Cannot act as you or receive new Self-DEK content</span></div>
              <div class="kv-row"><span>3. Path</span><span>${isSelf ? 'Self-release (requires 2-step force_self)' : (requiresQuorum ? 'Creates Self-Key Roster eviction proposal (CSD-095)' : 'Immediate revocation')}</span></div>
            </div>
            <div class="state-banner danger" style="margin:10px 0;" data-csd-tag="txt_dek_honesty_note">
              <span><strong>Constitutional Honesty Note (CC 4.5.12.1 / 3.3.6.1):</strong> It can no longer act as you or receive anything new. Anything already shared with that device stays readable to it &mdash; CIRIS does not re-encrypt past content.</span>
            </div>
            ${isSelf && state.multiDevice.revokeForcePendingId !== occId ? `
              <div class="state-banner brand" data-csd-tag="txt_release_self_requires_force">
                <span>This is the device you are currently using (<code>self.release_self_requires_force</code>). Confirming once unlocks the final <code>force_self: true</code> release button.</span>
              </div>
              <div style="display:flex; gap:8px; margin-top:12px;">
                <button class="btn btn-danger" data-csd-tag="btn_evict_arm_force_self" onclick="state.multiDevice.revokeForcePendingId='${occId}'; openEvictDeviceSheet('${occId}');">
                  Step 1: Arm self-eviction
                </button>
                <button class="btn" onclick="closeSheet()">Cancel</button>
              </div>
            ` : `
              <div style="display:flex; gap:8px; margin-top:12px;">
                <button class="btn btn-danger" data-csd-tag="btn_confirm_evict_${occId}" onclick="executeEvictDevice('${occId}')">
                  ${isSelf ? 'Step 2: Evict this device (force_self: true)' : (requiresQuorum ? 'Propose eviction on Self-Key Roster' : 'Evict device now')}
                </button>
                <button class="btn" onclick="state.multiDevice.revokeForcePendingId=null; closeSheet();">Cancel</button>
              </div>
            `}
          </div>
        </div>
      `;
    }

    function executeEvictDevice(occId) {
      const dev = state.multiDevice.devices.find(d => d.occurrenceId === occId);
      if (!dev) return;
      const me = state.multiDevice.activeOccurrenceId;
      const myDev = state.multiDevice.devices.find(d => d.occurrenceId === me) || state.multiDevice.devices[0];
      const enrolledCount = activeEnrolledDevices().length;

      if (enrolledCount >= 3 && occId !== me) {
        // Multi-device quorum / 24h W_self eviction proposal (`CSD-095`)
        const propId = "prop-evict-" + occId;
        state.multiDevice.proposals.unshift({
          proposalId: propId,
          kind: "evict",
          subjectKeyId: dev.keyId,
          subjectOccurrenceId: dev.occurrenceId,
          subjectLabel: dev.label,
          subjectClass: dev.deviceClass,
          proposedByOccurrenceId: me,
          proposedByLabel: myDev.label,
          approvals: [me],
          objectors: [],
          windowRemSecs: 86400,
          earliestLoneAt: "2026-10-21T18:00:00Z (24h W_self)",
          settled: null,
        });
      } else {
        dev.revoked = true;
        dev.dekRecipient = false;
      }
      state.multiDevice.revokeForcePendingId = null;
      closeSheet();
      renderAll();
    }

    // `CSD-094`: Approve or Deny a pending device join request behind a 3-fact ConfirmSheet
    function openApproveDeviceConfirm(reqId, approve) {
      const req = state.multiDevice.pendingDeviceRequests.find(r => r.requestId === reqId);
      if (!req) return;
      const enrolledCount = activeEnrolledDevices().length;
      const willHold = approve && enrolledCount >= 2;

      const host = document.getElementById("sheetHost");
      host.innerHTML = `
        <div class="sheet-backdrop" onclick="if(event.target===this)closeSheet()">
          <div class="sheet" data-csd-tag="confirm_device_request_${reqId}">
            <div class="sheet-header">
              <span class="sheet-title">${approve ? 'Approve' : 'Deny'} ${req.label}?</span>
              <button class="btn-ghost" onclick="closeSheet()">&#10005;</button>
            </div>
            <div class="card" style="padding:8px 14px;">
              <div class="kv-row"><span>1. Device &amp; class</span><strong>${req.label} (<code>${req.deviceClass}</code>)</strong></div>
              <div class="kv-row"><span>2. 6-digit match code</span><strong class="mono-hint">${req.matchCode}</strong></div>
              <div class="kv-row"><span>3. Outcome</span><span>${!approve ? 'Refuses request immediately' : (willHold ? '202 Held: opens Self-Key Roster proposal (24h W_self or 2nd device signature)' : '200 Approved: enrolls device immediately (single-device roster)')}</span></div>
            </div>
            <div style="display:flex; gap:8px; margin-top:12px;">
              <button class="btn ${approve ? 'btn-brand' : 'btn-danger'}"
                      data-csd-tag="btn_confirm_device_req_yes"
                      onclick="executeDeviceRequestDecision('${reqId}', ${approve})">
                ${approve ? 'Confirm approval' : 'Confirm denial'}
              </button>
              <button class="btn" onclick="closeSheet()">Cancel</button>
            </div>
          </div>
        </div>
      `;
    }

    function executeDeviceRequestDecision(reqId, approve) {
      const req = state.multiDevice.pendingDeviceRequests.find(r => r.requestId === reqId);
      if (!req) return;
      const enrolledCount = activeEnrolledDevices().length;
      const me = state.multiDevice.activeOccurrenceId;
      const myDev = state.multiDevice.devices.find(d => d.occurrenceId === me) || state.multiDevice.devices[0];

      if (!approve) {
        req.status = "denied";
      } else if (enrolledCount <= 1) {
        // `roster_size == 1` -> `200 {approved: true}` immediate landing (`CSD-094`)
        req.status = "approved";
        if (!state.multiDevice.devices.some(d => d.occurrenceId === req.occurrenceId)) {
          state.multiDevice.devices.push({
            occurrenceId: req.occurrenceId,
            keyId: req.keyId,
            label: req.label,
            deviceClass: req.deviceClass,
            reachable: false,
            hardwareCustody: "secure_enclave",
            dekRecipient: true,
            revoked: false,
          });
        }
      } else {
        // `roster_size >= 2` -> `202 {approved: false, held: true, proposal_id}` (`CSD-094` + `CSD-095`)
        req.status = "held";
        const propId = "prop-add-" + req.occurrenceId;
        state.multiDevice.lastHeldBannerProposalId = propId;
        if (!state.multiDevice.proposals.some(p => p.proposalId === propId)) {
          state.multiDevice.proposals.unshift({
            proposalId: propId,
            kind: "add",
            subjectKeyId: req.keyId,
            subjectOccurrenceId: req.occurrenceId,
            subjectLabel: req.label,
            subjectClass: req.deviceClass,
            proposedByOccurrenceId: me,
            proposedByLabel: myDev.label,
            approvals: [me],
            objectors: [],
            windowRemSecs: 86400,
            earliestLoneAt: "2026-10-21T17:45:00Z (24h W_self)",
            settled: null,
          });
        }
      }
      closeSheet();
      renderAll();
    }

    // `CSD-095`: Agree (`+1`) or Object (`-1`) to a Self-Key Roster proposal behind 3-fact `ConfirmSheet`
    function openRosterAnswerConfirm(propId, assent) {
      const p = state.multiDevice.proposals.find(x => x.proposalId === propId);
      if (!p) return;
      const changeText = (p.kind === "add" ? "Add " : "Evict ") + p.subjectLabel;
      const effectText = assent
        ? (p.approvals.length + 1 >= 2
            ? "Reaches quorum (2 signatures) and lands immediately"
            : "Records your +1 scores signature toward quorum")
        : "Records your -1 scores objection, blocking the 24h single-device window and refusing the change";

      const host = document.getElementById("sheetHost");
      host.innerHTML = `
        <div class="sheet-backdrop" onclick="if(event.target===this)closeSheet()">
          <div class="sheet" data-csd-tag="confirm_roster_answer">
            <div class="sheet-header">
              <span class="sheet-title">${assent ? 'Agree' : 'Object'} to ${changeText}?</span>
              <button class="btn-ghost" onclick="closeSheet()">&#10005;</button>
            </div>
            <div class="card" style="padding:8px 14px;">
              <div class="kv-row"><span>1. Change</span><strong>${changeText}</strong></div>
              <div class="kv-row"><span>2. Proposed by</span><strong>${p.proposedByLabel}</strong></div>
              <div class="kv-row"><span>3. What your answer does</span><span>${effectText}</span></div>
            </div>
            ${p.kind === 'evict' && assent ? `
              <div style="font-size:12px; color:var(--danger); margin-bottom:10px;">
                CC 4.5.12.1: Already-shared content stays readable to the evicted device; CIRIS does not re-encrypt past content.
              </div>
            ` : ''}
            <div style="display:flex; gap:8px; margin-top:12px;">
              <button class="btn ${assent ? 'btn-brand' : 'btn-danger'}"
                      data-csd-tag="btn_confirm_roster_answer_yes"
                      onclick="executeRosterAnswer('${propId}', ${assent})">
                ${assent ? 'Sign agreement (+1)' : 'Sign objection (-1)'}
              </button>
              <button class="btn" data-csd-tag="btn_confirm_roster_answer_cancel" onclick="closeSheet()">Cancel</button>
            </div>
          </div>
        </div>
      `;
    }

    function executeRosterAnswer(propId, assent) {
      const p = state.multiDevice.proposals.find(x => x.proposalId === propId);
      if (!p) return;
      const me = state.multiDevice.activeOccurrenceId;

      if (assent) {
        if (!p.approvals.includes(me)) p.approvals.push(me);
        if (p.approvals.length >= 2) {
          p.settled = "LANDED";
          if (p.kind === "add") {
            if (!state.multiDevice.devices.some(d => d.occurrenceId === p.subjectOccurrenceId)) {
              state.multiDevice.devices.push({
                occurrenceId: p.subjectOccurrenceId,
                keyId: p.subjectKeyId,
                label: p.subjectLabel,
                deviceClass: p.subjectClass || "phone",
                reachable: false,
                hardwareCustody: "secure_enclave",
                dekRecipient: true,
                revoked: false,
              });
            }
            const req = state.multiDevice.pendingDeviceRequests.find(r => r.occurrenceId === p.subjectOccurrenceId);
            if (req) req.status = "approved";
          } else if (p.kind === "evict") {
            const dev = state.multiDevice.devices.find(d => d.occurrenceId === p.subjectOccurrenceId);
            if (dev) {
              dev.revoked = true;
              dev.dekRecipient = false;
            }
          }
        }
        state.multiDevice.lastReceiptNote = `Signed scores +1 on self_roster:${p.kind} (${p.proposalId}) by ${me} at federation scope -> ${p.settled || 'PENDING'}`;
      } else {
        if (!p.objectors.includes(me)) p.objectors.push(me);
        p.settled = "REFUSED";
        state.multiDevice.lastReceiptNote = `Signed scores -1 objection on self_roster:${p.kind} (${p.proposalId}) by ${me} -> REFUSED (24h lone window blocked)`;
      }
      closeSheet();
      renderAll();
    }

    function renderDevicesAndKeysSurface() {
      const md = state.multiDevice;
      const enrolled = activeEnrolledDevices();
      const visibleDevices = md.showRevoked ? md.devices : enrolled;
      const openProposals = md.proposals.filter(p => !p.settled);
      const settledProposals = md.proposals.filter(p => !!p.settled);

      return `
        <!-- Perspective Switcher so reviewer/harness can test A1 (Proposer) vs A2 (Second Device Voter) -->
        <div class="quiet-lens" data-csd-tag="multi_device_perspective_bar">
          <span>Viewing as device: <strong>${md.activeOccurrenceId.toUpperCase()}</strong> &middot; Roster size: <strong>${enrolled.length}</strong></span>
          <div style="display:flex; gap:4px;">
            ${md.devices.filter(d => !d.revoked).map(d => `
              <button class="btn ${md.activeOccurrenceId === d.occurrenceId ? 'btn-brand' : ''}"
                      style="padding:3px 9px; font-size:11px;"
                      data-csd-tag="btn_view_as_${d.occurrenceId}"
                      onclick="switchActiveDevicePerspective('${d.occurrenceId}')">
                ${d.label.split(' ')[0]} (${d.occurrenceId.replace('occ-', '').toUpperCase()})
              </button>
            `).join("")}
          </div>
        </div>

        <!-- CARD 1: CSD-095 Changes to Your Devices — Self-Key Roster -->
        <div class="card" data-csd-tag="card_self_roster">
          <div class="card-header">
            <div class="card-header-title">
              <span>Changes to your devices &mdash; Self-key roster (CSD-095)</span>
              ${openProposals.length > 0
                ? `<span class="chip warn">${openProposals.length} waiting</span>`
                : `<span class="chip ok">All settled</span>`}
            </div>
            <button class="btn-ghost" data-csd-tag="btn_self_roster_refresh" title="Refresh proposals" onclick="renderAll()">&#8635;</button>
          </div>

          ${md.lastReceiptNote ? `
            <div class="state-banner brand" data-csd-tag="text_self_roster_receipt">
              <span class="mono-hint">${md.lastReceiptNote}</span>
            </div>
          ` : ''}

          ${openProposals.length === 0 ? `
            <div class="item-row" data-csd-tag="text_self_roster_empty">
              <span style="font-size:13px; color:var(--ink-mute);">No pending additions or evictions on your self-key roster.</span>
            </div>
          ` : openProposals.map(p => {
            const isOwn = p.proposedByOccurrenceId === md.activeOccurrenceId;
            const need = enrolled.length >= 3 ? 2 : 2;
            const sigText = `Signatures: ${p.approvals.length} of ${need}${enrolled.length >= 3 ? ` (quorum of ${enrolled.length})` : ''}`;
            const pathText = enrolled.length === 2 && p.kind === "add"
              ? `2-device roster: lands immediately on 2nd signature, or after 24h W_self (${p.earliestLoneAt}) if unopposed`
              : `Quorum path: 2 signatures land immediately · Lone path: 1 signature after ${p.earliestLoneAt} if 0 objections`;
            const propDvId = `self_roster_3d_${p.proposalId}`;
            const propDv = {
              deferralId: propDvId,
              contextTitle: `${p.kind === 'add' ? 'Add' : 'Evict'} ${p.subjectLabel}`,
              contextSubtitle: `Proposed by ${p.proposedByLabel}`,
              dimension: `self_roster:${p.kind}`,
              scope: "Everyone",
              quorumRequired: need,
              quorumApprovals: p.approvals.length,
              quorumObjections: p.objectors.length,
              choices: [
                {
                  choiceId: `${p.proposalId}_assent`,
                  label: "Agree (+1)",
                  subtitle: "Sign op:scores +1.0 toward 2-device quorum",
                  voteScore: 1.0,
                  atomicNumber: 7,
                  selected: p.approvals.length >= 1,
                  disabled: isOwn,
                  onClickJs: isOwn ? "" : `openRosterAnswerConfirm('${p.proposalId}', true)`,
                },
                {
                  choiceId: `${p.proposalId}_wait`,
                  label: "24h W_self Hold (0)",
                  subtitle: p.earliestLoneAt,
                  voteScore: 0.0,
                  atomicNumber: 3,
                  selected: p.approvals.length === 1 && p.objectors.length === 0,
                  disabled: true,
                },
                {
                  choiceId: `${p.proposalId}_object`,
                  label: "Object (-1)",
                  subtitle: "Sign op:scores -1.0 to block lone-signer path",
                  voteScore: -1.0,
                  atomicNumber: 9,
                  selected: p.objectors.length > 0,
                  disabled: isOwn,
                  onClickJs: isOwn ? "" : `openRosterAnswerConfirm('${p.proposalId}', false)`,
                },
              ],
            };
            window.__HOLON_ACTIVE_FRAMES = window.__HOLON_ACTIVE_FRAMES || {};
            window.__HOLON_ACTIVE_FRAMES[propDvId] = buildHolonFrameFromDeferral(propDv);
            return `
              <div class="item-row" style="flex-direction:column; align-items:stretch; gap:8px;" data-csd-tag="row_self_roster_${p.proposalId}">
                <div class="p9-question-hero"
                     style="margin:2px 0;"
                     data-bevy-question="1"
                     data-bevy-deferral-id="${propDvId}"
                     data-csd-tag="holon_canvas_${p.proposalId}">
                  <div style="display:flex; justify-content:space-between; align-items:center;">
                    <div>
                      <div class="p9-question-eyebrow">P9 &middot; SELF-ROSTER CEREMONY QUESTION &middot; <code>self_roster:${p.kind}</code></div>
                      <strong class="p9-question-title" style="display:block;font-size:15px;" data-csd-tag="text_self_roster_kind_${p.proposalId}">
                        ${p.kind === 'add' ? 'Add device' : 'Evict device'}: ${p.subjectLabel}?
                      </strong>
                      <div style="font-size:12px; color:var(--ink-mute);">
                        Proposed by ${p.proposedByLabel} &middot; <span class="mono-hint">${p.subjectKeyId}</span>
                      </div>
                    </div>
                    <div style="display:flex;align-items:center;gap:6px;">
                      <span class="chip warn" data-csd-tag="text_self_roster_signatures_${p.proposalId}">${sigText}</span>
                      <button class="btn-ghost" data-csd-tag="btn_receipt_${p.proposalId}" title="5-fact CEG receipt &amp; actions (P4)" onclick="openReceiptSheet('setup_add_device')">&#9776;</button>
                    </div>
                  </div>
                </div>
                <div style="font-size:12px; color:var(--ink-mute);" data-csd-tag="text_self_roster_path_${p.proposalId}">
                  ${pathText}
                </div>
                ${p.objectors.length > 0 ? `
                  <div style="font-size:12px; color:var(--danger);" data-csd-tag="text_self_roster_objectors_${p.proposalId}">
                    Objectors: ${p.objectors.join(", ")}
                  </div>
                ` : ''}
                <div style="display:flex; justify-content:space-between; align-items:center; padding-top:4px;">
                  ${isOwn ? `
                    <span style="font-size:12px; color:var(--ink-mute);" data-csd-tag="text_self_roster_own_${p.proposalId}">
                      This device proposed this change, so another of your devices answers it. (Switch to A2 above to answer!)
                    </span>
                  ` : `
                    <div style="display:flex; gap:8px;">
                      <button class="btn btn-brand"
                              data-bevy-choice="1"
                              data-bevy-selected="1"

    // ── `☰` Universal CEG Hamburger (`P4: ReceiptSheet` / `CSD-006` / `v0.5.243`) ──
    // Available on EVERY CEG object and its referents (blobs, files, messages, communities, rules, 3D holon orbs):
    // 1. 5 Universal Envelope Facts
    // 2. 3D `CIRISHolon` Atom/Bond Spatial View-Form (`#spatialCanvas`)
    // 3. All 9 Uniform `AttOp`s (`ViewDetails`, `History`, `Evidence`, `Copy`, `Cosign`, `Delegate`, `Supersede`, `Withdraw`, `Recant` with inline `whyDisabled` reasons)
    // 4. Referent / Blob / File Acts (`Open`, `Where is this file` `/custody`, `Rename`, `Move`)
    // 5. Moderation & Safety Acts (`Flag content` `/v1/safety/flag`, `Moderate author` `/v1/safety/moderation`, `Reveal` `/reveal`)
    function computeUniform9AttOps(c) {
      const isProducer = c.attester === "ed25519:viewer_self" || (c.attester && c.attester.includes(state.wizard.fedidLabel || "alice"));
      const isTerminal = c.op === "withdraws" || c.op === "recants";
      return [
        { op: "ViewDetails", label: "View envelope JSON", enabled: true, whyDisabled: null },
        { op: "History",     label: "Revision lineage",   enabled: true, whyDisabled: null },
        { op: "Evidence",    label: "Merkle / STH proof", enabled: true, whyDisabled: null },
        { op: "Copy",        label: "Copy canonical URI", enabled: true, whyDisabled: null },
        { op: "Cosign",      label: "Cosign (+1)",        enabled: c.op === "scores", whyDisabled: c.op !== "scores" ? `op:${c.op} does not accept cosignatures (RC9 matrix)` : null },
        { op: "Delegate",    label: "Delegate",           enabled: c.op === "delegates_to", whyDisabled: c.op !== "delegates_to" ? "Inv_BondDepthOne: only op:delegates_to supports delegation" : null },
        { op: "Supersede",   label: "Supersede (Revise)", enabled: isProducer && !isTerminal, whyDisabled: !isProducer ? "Only the original attester can supersede" : (isTerminal ? `Terminal op:${c.op} cannot be superseded` : null) },
        { op: "Withdraw",    label: "Withdraw (1-step)",  enabled: isProducer && c.op !== "withdraws", whyDisabled: !isProducer ? "Rule 0: only producer can withdraw" : "Already withdrawn" },
        { op: "Recant",      label: "Recant (Fault)",     enabled: isProducer && c.op !== "recants", whyDisabled: !isProducer ? "Rule 0: only producer can recant" : "Already recanted" },
      ];
    }

    function openReceiptSheet(claimId) {

      if (!c) return;
      const sc = getCircle(c.scope);
      const attOps = computeUniform9AttOps(c);
      const isBlobOrFile = c.tab === "Files" || (c.dimension && c.dimension.startsWith("holds_bytes:"));
      const isCommunityOrNeighbour = c.scope === "Neighbours" || c.scope === "CommunitiesAndBusinesses" || c.tab === "Chats";

      host.innerHTML = `

            <!-- 4. Uniform 9 AttOps (RC9 Occupancy Matrix + Inline whyDisabled) -->

              <div style="font-size:11px;font-weight:600;color:var(--ink-mute);margin-bottom:6px;">
                UNIFORM 9 CEG ATTESTATION OPS (<code>AttOp</code>)
              </div>
              <div style="display:flex;gap:6px;flex-wrap:wrap;">
                ${attOps.map(a => `
                  <button class="btn" style="font-size:11px;padding:4px 9px;"

              ${attOps.some(a => !a.enabled) ? `
                <div style="font-size:11px;color:var(--ink-mute);margin-top:6px;">

            <!-- 5. Referent / Blob / File Custody Acts (v0.5.243 /v1/files/{id}/custody|rename|move) -->
            ${isBlobOrFile ? `

                  BLOB &amp; FILE CUSTODY REFERENT ACTS (<code>/v1/files/{id}</code>)

            <!-- 6. Community Moderation & Content Flagging (v0.5.243 /v1/safety/moderation|flag) -->
            ${isCommunityOrNeighbour ? `
              <div class="card" style="padding:8px 14px; margin-top:8px;" data-csd-tag="receipt_moderation_acts_${c.id}">
                <div style="font-size:11px;font-weight:600;color:var(--ink-mute);margin-bottom:6px;">
                  MODERATION &amp; SAFETY ACTS (<code>CC 4.5.4 &middot; v0.5.243</code>)
                </div>

                  <button class="btn btn-danger" style="font-size:11px;padding:4px 9px;" data-csd-tag="btn_mod_hide_${c.id}" onclick="executeModerationAct('${c.id}', 'hide_item')">
                    Moderator Hide item
                  </button>
                  <button class="btn" style="font-size:11px;padding:4px 9px;" data-csd-tag="btn_mod_reveal_${c.id}" onclick="executeModerationAct('${c.id}', 'reveal')">
                    Reveal gated item
                  </button>
                </div>
              </div>
            ` : ''}
          </div>
        </div>
      `;
      draw3DViewForm(c);
      const detailsEl = host.querySelector("details");
      detailsEl.addEventListener("toggle", () => {
        if (detailsEl.open) draw3DViewForm(c);
      });
    }

    async function executeHamburgerAttOp(claimId, op) {
      const c = CLAIMS.find(x => x.id === claimId) || getSetupReceiptClaim(claimId);
      if (!c) return;
      if (op === "Withdraw") {
        if (state.liveNode.connected && c.tab === "Chats") {
          await fetch(`/v1/chat/${state.activeCommunityId}/messages/${c.id}/withdraw`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ reason: "1-step producer withdrawal" }),
          }).catch(() => null);
        }
        oneStepWithdraw(claimId);
        return;
      }
      if (op === "Supersede") {
        const revTitle = c.title.endsWith(" (v2)") ? c.title : `${c.title} (v2)`;
        c.title = revTitle;
        if (state.liveNode.connected && c.tab === "Chats") {
          await fetch(`/v1/chat/${state.activeCommunityId}/messages/${c.id}/supersede`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ body: revTitle }),
          }).catch(() => null);
        }
        state.lastHamburgerNote = `Superseded ${c.id} -> minted revision envelope (${revTitle})`;
      } else if (op === "Recant") {
        c.op = "recants";
        c.score = -1.0;
        if (state.liveNode.connected && c.tab === "Chats") {
          await fetch(`/v1/chat/${state.activeCommunityId}/messages/${c.id}/recant`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ reason: "Producer fault recantation" }),
          }).catch(() => null);
        }
        state.lastHamburgerNote = `Recanted ${c.id} (op:recants signed on record)`;
      } else if (op === "Cosign") {
        c.confidence = Math.min(1.0, (c.confidence || 0.9) + 0.05);
        state.lastHamburgerNote = `Cosigned ${c.id} (op:scores +1.0 co-attestation recorded)`;
      } else if (op === "History") {
        state.lastHamburgerNote = `Lineage for ${c.id}: genesis -> active head (STH #42 verified)`;
      } else if (op === "Evidence") {
        state.lastHamburgerNote = `Merkle inclusion proof verified: Ed25519 + ML-DSA-65 hybrid signature valid`;
      } else if (op === "Copy") {
        state.lastHamburgerNote = `Copied canonical URI: ciris://ceg/${c.scope}/${c.id}`;
      } else {
        state.lastHamburgerNote = `Envelope ${c.id}: subject=${c.subject}, attester=${c.attester}, dim=${c.dimension}`;
      }
      openReceiptSheet(claimId);
    }

    async function executeBlobAct(claimId, act) {
      const c = CLAIMS.find(x => x.id === claimId) || getSetupReceiptClaim(claimId);
      if (!c) return;
      if (act === "custody") {
        if (state.liveNode.connected) {
          await fetch(`/v1/files/${claimId}/custody`).catch(() => null);
        }
        state.lastHamburgerNote = `GET /v1/files/${claimId}/custody: held on Local Node (${state.liveNode.keyId}) + 2 cohort replicas (72h custody:ack:v1)`;
      } else if (act === "rename") {
        c.title = c.title.startsWith("renamed-") ? c.title : `renamed-${c.title}`;
        if (state.liveNode.connected) {
          await fetch(`/v1/files/${claimId}/rename`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name: c.title }),
          }).catch(() => null);
        }
        state.lastHamburgerNote = `POST /v1/files/${claimId}/rename -> ${c.title}`;
      } else if (act === "move") {
        c.scope = c.scope === "JustMe" ? "Family" : "JustMe";
        if (state.liveNode.connected) {
          await fetch(`/v1/files/${claimId}/move`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ cohort: c.scope }),
          }).catch(() => null);
        }
        state.lastHamburgerNote = `POST /v1/files/${claimId}/move -> moved to ${c.scope}`;
      }
      openReceiptSheet(claimId);
      renderAll();
    }

    async function executeModerationAct(claimId, action) {
      const c = CLAIMS.find(x => x.id === claimId) || getSetupReceiptClaim(claimId);
      if (!c) return;
      if (action === "flag") {
        c.cw_opinion = { by: "viewer_self", rule: "cw_class:community_flag" };
        if (state.liveNode.connected) {
          await fetch("/v1/safety/flag", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ target_id: claimId, flag_class: "cw_class:community_flag", community_id: state.activeCommunityId }),
          }).catch(() => null);
        }
        state.lastHamburgerNote = `POST /v1/safety/flag: signed content note (cw_class:community_flag) on ${claimId}`;
      } else if (action === "reveal") {
        c.cw_opinion = null;
        if (state.liveNode.connected) {
          await fetch(`/v1/chat/${state.activeCommunityId}/items/${claimId}/reveal`, { method: "POST" }).catch(() => null);
        }
        state.lastHamburgerNote = `POST /v1/chat/${state.activeCommunityId}/items/${claimId}/reveal: item unblurred for your view`;
      } else {
        if (state.liveNode.connected) {
          await fetch("/v1/safety/moderation", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ community_id: state.activeCommunityId, target_id: claimId, action, reason: "CC 4.5.4 named moderator action" }),
          }).catch(() => null);
        }
        state.lastHamburgerNote = `POST /v1/safety/moderation (${action}) signed by Named Moderator on ${claimId} (CC 4.5.4)`;
      }
      openReceiptSheet(claimId);
      renderAll();
    }

    function oneStepWithdraw(claimId) {
      const c = CLAIMS.find(x => x.id === claimId);
      if (c) c.scope = "JustMe";
      closeSheet();
      renderAll();
    }

      const host = document.getElementById("sheetHost");

    // Draw the 3D Spatial Slab preview inside `P4: ReceiptSheet` (`#spatialCanvas`) — no molecular spheres
    function draw3DViewForm(claim) {
      const canvas = document.getElementById("spatialCanvas");
      if (!canvas) return;
      const ctx = canvas.getContext("2d");
      const w = canvas.width, h = canvas.height;
      ctx.fillStyle = "#F3F2EE";
      ctx.fillRect(0, 0, w, h);

      // Subtle 3D architectural perspective grid
      ctx.strokeStyle = "rgba(43, 84, 126, 0.12)";
      ctx.lineWidth = 1;
      for (let x = 24; x < w; x += 48) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, h);
        ctx.stroke();
      }
      for (let y = 24; y < h; y += 36) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(w, y);
        ctx.stroke();
      }

      // 3D selection spline connecting Context Slab (left) -> Signed Envelope Slab (right)
      const bGrad = ctx.createLinearGradient(w * 0.34, h * 0.5, w * 0.66, h * 0.5);
      bGrad.addColorStop(0, "#2B547E");
      bGrad.addColorStop(1, "#2E6F40");
      ctx.strokeStyle = bGrad;
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      ctx.moveTo(w * 0.38, h * 0.46);
      ctx.bezierCurveTo(w * 0.48, h * 0.32, w * 0.52, h * 0.60, w * 0.60, h * 0.46);
      ctx.stroke();

      // Context Question Slab (left)
      ctx.fillStyle = "#FFFFFF";
      ctx.strokeStyle = "#2B547E";
      ctx.lineWidth = 1.6;
      ctx.fillRect(24, 34, 185, 86);
      ctx.strokeRect(24, 34, 185, 86);
      ctx.fillStyle = "#2B547E";
      ctx.font = "600 9px 'IBM Plex Mono', monospace";
      ctx.fillText("CONTEXT QUESTION SLAB (P9)", 34, 52);
      ctx.fillStyle = "#1A1D1F";
      ctx.font = "600 11px 'IBM Plex Sans', sans-serif";
      ctx.fillText(String(claim.dimension || "claim").slice(0, 24), 34, 72);
      ctx.fillStyle = "#5A626A";
      ctx.font = "10px 'IBM Plex Mono', monospace";
      ctx.fillText(`subject: ${String(claim.subject || "").slice(0, 18)}`, 34, 92);

      // Signed Selection / Envelope Slab (right)
      ctx.fillStyle = "#EEF4FA";
      ctx.strokeStyle = "#2E6F40";
      ctx.lineWidth = 1.8;
      ctx.fillRect(w - 215, 34, 191, 86);
      ctx.strokeRect(w - 215, 34, 191, 86);
      ctx.fillStyle = "#2E6F40";
      ctx.font = "600 9px 'IBM Plex Mono', monospace";
      ctx.fillText(`SIGNED SELECTION · op:${claim.op}`, w - 205, 52);
      ctx.fillStyle = "#1A1D1F";
      ctx.font = "600 11px 'IBM Plex Sans', sans-serif";
      ctx.fillText(String(claim.title || claim.id).slice(0, 24), w - 205, 72);
      ctx.fillStyle = "#5A626A";
      ctx.font = "10px 'IBM Plex Mono', monospace";
      ctx.fillText(`score=${(claim.score ?? 1.0).toFixed(2)} · conf=${(claim.confidence ?? 1.0).toFixed(2)}`, w - 205, 92);

      ctx.fillStyle = "#5A626A";
      ctx.font = "10px 'IBM Plex Mono', monospace";
      ctx.fillText(`view_form(&Form) · 3D Spatial Slab Projection · scope=${claim.scope}`, 24, h - 18);
    }
